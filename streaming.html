<head>
<meta charset="UTF-8">

<title>Streaming - MiniTok</title>

<style>
body{
  margin:0;
  background:#000;
  color:#fff;
  font-family:Arial;
}

/* HEADER */
header{
  padding:15px;
  background:#111;
  font-size:20px;
  position:sticky;
  top:0;
  z-index:1000;
}

/* CONTAINER */
.container{
  padding:20px;
}

/* GRID VERTICAL */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(200px,1fr));
  gap:15px;
}

/* CARD */
.card{
  background:#111;
  border-radius:10px;
  cursor:pointer;
  transition:.3s;
  overflow:hidden;
}

.card:hover{
  transform:scale(1.05);
}

.card img{
  width:100%;
  height:250px;
  object-fit:cover;
}

.card p{
  padding:10px;
  font-size:14px;
}

/* PLAYER */
#playerArea{
  display:none;
  padding:20px;
  background:#111;
}

video{
  width:100%;
  max-height:70vh;
}
</style>
</head>

<body>

<header>🎬 Netflix Style Streaming</header>

<div id="playerArea">
<h2 id="title"></h2>
<video id="videoPlayer" controls></video>
</div>

<div class="container">
<h2>🔥 Trending Movies</h2>
<div class="grid" id="videoGrid"></div>
</div>

<script>
async function loadVideos(){
  let res = await fetch("https://archive.org/advancedsearch.php?q=collection:(moviesandfilms)&output=json&rows=30");
  let data = await res.json();

  for(let v of data.response.docs){
    let mp4 = await getMP4(v.identifier);
    if(mp4){ addCard(v.identifier,v.title,mp4); }
  }
}

async function getMP4(id){
  try{
    let res = await fetch(`https://archive.org/metadata/${id}`);
    let data = await res.json();
    let file = data.files.find(f=>f.name.endsWith(".mp4"));
    if(file){
      return `https://archive.org/download/${id}/${file.name}`;
    }
  }catch(e){}
  return null;
}

function addCard(id,title,mp4){
  let thumb = `https://archive.org/services/img/${id}`;
  document.getElementById("videoGrid").innerHTML += `
  <div class="card" onclick="play('${mp4}','${title.replace(/'/g,"")}')">
    <img src="${thumb}">
    <p>${title}</p>
  </div>`;
}

function play(src,title){
  document.getElementById("playerArea").style.display="block";
  document.getElementById("title").innerText=title;
  let video=document.getElementById("videoPlayer");
  video.src=src;
  video.play();

  window.scrollTo({top:0,behavior:"smooth"});
}

loadVideos();
</script>

<style>
body{margin:0;background:#000;color:#fff;font-family:Arial;overflow:hidden}

<div id="nav">
<button onclick="login()">Login</button>
<button onclick="showFeed()">Feed</button>
<button onclick="showMovies()">Movies</button>
</div>

<div id="feed"></div>

<!-- IKLAN OVERLAY -->
<div id="adOverlay">
<h2>🎯 Sponsor</h2>
<button onclick="goLink()">Lanjut</button>
<button onclick="closeAd()">Skip</button>
</div>

<script type="module">

// ================= FIREBASE =================
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
import { getAuth, signInWithPopup, GoogleAuthProvider } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js";
import { getDatabase, ref, set, get, push, onValue } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "APIKEY",
  authDomain: "PROJECT.firebaseapp.com",
  databaseURL: "https://PROJECT-default-rtdb.firebaseio.com",
  projectId: "PROJECT"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);

let currentUser=null;

// LOGIN
window.login = async function(){
  const res = await signInWithPopup(auth,new GoogleAuthProvider());
  currentUser = res.user;
  alert("Login: "+currentUser.displayName);
}

// ================= VIDEO DATA =================
let videos=[
"https://media.w3.org/2010/05/sintel/trailer.mp4",
"https://media.w3.org/2010/05/bunny/trailer.mp4",
"https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4",
"https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerFun.mp4",
"https://archive.org/download/SampleVideo1280x7205mb/SampleVideo_1280x720_5mb.mp4"
];

// ================= LOAD =================
function load(){
let feed=document.getElementById("feed");
feed.innerHTML="";

videos.forEach((src,i)=>{

let div=document.createElement("div");
div.className="video";

div.innerHTML=`
<video src="${src}" muted loop playsinline data-id="${i}"></video>

<div class="overlay">Video ${i+1}</div>

<div class="ui">
<div onclick="like(${i})">❤️ <span id="like${i}">0</span></div>
<div>👁 <span id="view${i}">0</span></div>
<div onclick="share('${src}')">📤</div>
<div onclick="goLink()">💰</div>
</div>

<div class="commentBox">
<input placeholder="Komentar..." onkeydown="sendComment(event,${i})">
<div id="list${i}"></div>
</div>
`;

feed.appendChild(div);
});

autoPlay();
loadRealtime();
attachAds();
}

window.onload=load;

// ================= AUTOPLAY =================
function autoPlay(){
let vids=document.querySelectorAll("video");

let observer=new IntersectionObserver(entries=>{
entries.forEach(entry=>{
let v=entry.target;
if(entry.isIntersecting){
v.muted=false;
v.play();
addView(v.dataset.id);
}else{
v.pause();
}
});
},{threshold:0.7});

vids.forEach(v=>observer.observe(v));
}

// ================= FIREBASE DATA =================
async function addView(i){
let snap=await get(ref(db,'views/'+i));
let val=snap.val()||0;
set(ref(db,'views/'+i),val+1);
}

window.like=async function(i){
let snap=await get(ref(db,'likes/'+i));
let val=snap.val()||0;
set(ref(db,'likes/'+i),val+1);
}

// ================= KOMENTAR =================
window.sendComment=function(e,i){
if(e.key==="Enter"){
let text=e.target.value;
if(!text)return;

push(ref(db,'comments/'+i),{
user: currentUser?currentUser.displayName:"Anon",
text:text
});
e.target.value="";
}
}

// realtime komentar
function loadRealtime(){
videos.forEach((v,i)=>{
onValue(ref(db,'comments/'+i),snap=>{
let data=snap.val();
let html="";
for(let k in data){
html+=`<p><b>${data[k].user}</b>: ${data[k].text}</p>`;
}
document.getElementById("list"+i).innerHTML=html;
});
});
}

// ================= IKLAN =================
function attachAds(){
document.querySelectorAll("video").forEach(v=>{

// akhir video (short video)
v.addEventListener("ended",()=>{
showAd();
});

// interval film panjang
setInterval(()=>{
if(!v.paused){
showBanner();
}
},600000); // 10 menit

});
}

function showAd(){
document.getElementById("adOverlay").style.display="flex";
}

window.closeAd=function(){
document.getElementById("adOverlay").style.display="none";
}

function showBanner(){
let b=document.createElement("div");
b.innerHTML=`
<div style="position:fixed;bottom:0;width:100%;background:#111;padding:10px;text-align:center">
📢 Iklan <button onclick="goLink()">Buka</button>
</div>`;
document.body.appendChild(b);
setTimeout(()=>b.remove(),10000);
}

// ================= SHARE =================
window.share=function(url){
if(navigator.share){
navigator.share({url:url});
}else{
window.open("https://wa.me/?text="+url);
}
}

// ================= MONET =================
window.goLink=function(){
window.open(https://www.profitablecpmratenetwork.com/i5gzxdgr?key=72e84d2f8c4935bbf89be21a6ea02ff1","_blank");
}

// ================= NAV =================
window.showFeed=function(){
document.getElementById("feed").style.display="block";
}

window.showMovies=function(){
alert("Tambahkan halaman film panjang di sini");
}

</script>
