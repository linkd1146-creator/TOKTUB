<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Streaming - MiniTok</title>

<style>
body{
  margin:0;
  background:#000;
  color:#fff;
  font-family:Arial;
}

/* HEADER */
header{
  padding:15px;
  background:#111;
  font-size:20px;
  position:sticky;
  top:0;
  z-index:1000;
}

/* CONTAINER */
.container{
  padding:20px;
}

/* GRID VERTICAL */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(200px,1fr));
  gap:15px;
}

/* CARD */
.card{
  background:#111;
  border-radius:10px;
  cursor:pointer;
  transition:.3s;
  overflow:hidden;
}

.card:hover{
  transform:scale(1.05);
}

.card img{
  width:100%;
  height:250px;
  object-fit:cover;
}

.card p{
  padding:10px;
  font-size:14px;
}

/* PLAYER */
#playerArea{
  display:none;
  padding:20px;
  background:#111;
}

video{
  width:100%;
  max-height:70vh;
}
</style>
</head>

<body>

<header>🎬 Netflix Style Streaming</header>

<div id="playerArea">
<h2 id="title"></h2>
<video id="videoPlayer" controls></video>
</div>

<div class="container">
<h2>🔥 Trending Movies</h2>
<div class="grid" id="videoGrid"></div>
</div>

<script>
async function loadVideos(){
  let res = await fetch("https://archive.org/advancedsearch.php?q=collection:(moviesandfilms)&output=json&rows=30");
  let data = await res.json();

  for(let v of data.response.docs){
    let mp4 = await getMP4(v.identifier);
    if(mp4){ addCard(v.identifier,v.title,mp4); }
  }
}

async function getMP4(id){
  try{
    let res = await fetch(`https://archive.org/metadata/${id}`);
    let data = await res.json();
    let file = data.files.find(f=>f.name.endsWith(".mp4"));
    if(file){
      return `https://archive.org/download/${id}/${file.name}`;
    }
  }catch(e){}
  return null;
}

function addCard(id,title,mp4){
  let thumb = `https://archive.org/services/img/${id}`;
  document.getElementById("videoGrid").innerHTML += `
  <div class="card" onclick="play('${mp4}','${title.replace(/'/g,"")}')">
    <img src="${thumb}">
    <p>${title}</p>
  </div>`;
}

function play(src,title){
  document.getElementById("playerArea").style.display="block";
  document.getElementById("title").innerText=title;
  let video=document.getElementById("videoPlayer");
  video.src=src;
  video.play();

  window.scrollTo({top:0,behavior:"smooth"});
}

loadVideos();
</script>

</body>
</html>
