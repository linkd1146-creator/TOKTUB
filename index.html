<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MiniTok</title>

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- TOP BAR -->
  <div class="top-bar">
    <div class="logo">MiniTok</div>

    <div class="menu-btn" onclick="toggleMenu()">☰</div>

    <div class="dropdown" id="dropdown">
      <div onclick="setCategory('trending')">🔥 Trending</div>
      <div onclick="setCategory('comedy')">😂 Comedy</div>
      <div onclick="setCategory('anime')">🎌 Anime</div>
      <div onclick="setCategory('news')">📰 News</div>
      <div onclick="setCategory('sports')">⚽ Sports</div>
      <div onclick="setCategory('product')">🛍 Product</div>
    </div>
  </div>

  <!-- VIDEO FEED -->
  <div class="feed" id="feed"></div>

  <!-- SCRIPT -->
  <script src="app.js"></script>

</body>
</html>
