<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MiniTok</title>

<style>
body{
  margin:0;
  background:black;
  font-family:Arial;
  overflow:hidden;
}

/* FEED VIDEO */
.feed{
  height:100vh;
  overflow-y:scroll;
  scroll-snap-type:y mandatory;
}

.video-box{
  height:100vh;
  position:relative;
  scroll-snap-align:start;
}

iframe{
  width:100%;
  height:100%;
  border:none;
}

/* Overlay text */
.overlay{
  position:absolute;
  bottom:90px;
  left:15px;
  color:white;
  text-shadow:0 0 5px black;
  max-width:70%;
}

/* Action buttons */
.actions{
  position:absolute;
  right:10px;
  bottom:120px;
  color:white;
  font-size:24px;
  text-align:center;
}

.actions div{
  margin:12px 0;
  cursor:pointer;
}

/* ☰ MENU BUTTON (POJOK KIRI) */
.menu-btn{
  position:fixed;
  top:15px;
  left:15px;
  font-size:28px;
  color:white;
  cursor:pointer;
  z-index:1001;
}

/* PANEL MENU */
.menu-panel{
  position:fixed;
  top:0;
  left:-260px;
  width:250px;
  height:100%;
  background:#111;
  padding-top:60px;
  transition:0.3s;
  z-index:1000;
  display:flex;
  flex-direction:column;
}

.menu-panel a{
  padding:15px 20px;
  color:white;
  text-decoration:none;
  border-bottom:1px solid #222;
  font-size:14px;
}

.menu-panel a:hover{
  background:#222;
}

/* ACTIVE MENU */
.menu-open{
  left:0;
}
</style>
</head>

<body>

<!-- ☰ BARIS TIGA POJOK KIRI -->
<div class="menu-btn" onclick="toggleMenu()">☰</div>

<!-- PANEL MENU -->
<div class="menu-panel" id="menu">

<a href="blog.html">📰 Blog</a>
<a href="about.html">👤 About</a>
<a href="streaming.html">🎬 Streaming</a>
<a href="affiliate.html">🛍 Shopee</a>
<a href="blibli.html">🛒 Blibli</a>
<a href="promo.html">🔥 Promo</a>
<a href="donasi.html">❤️ Donasi Sosial</a>
<a href="disclaimer.html">⚠ Disclaimer</a>
<a href="privacy.html">🔒 Privacy</a>
<a href="terms.html">📄 Terms</a>

</div>

<!-- VIDEO FEED -->
<div class="feed" id="feed"></div>

<script>
function toggleMenu(){
  document.getElementById("menu").classList.toggle("menu-open");
}
</script>

<!-- FILE VIDEO -->
<script src="app.js"></script>

</body>
</html>
