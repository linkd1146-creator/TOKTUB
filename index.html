<!-- ADS (LESS DISTURBING FIX) -->
<script>
window.addEventListener("load", function(){
  setTimeout(()=>{
    let s=document.createElement("script");
    s.src="https://quge5.com/88/tag.min.js";
    s.setAttribute("data-zone","237451");
    s.async=true;
    document.body.appendChild(s);
  }, 8000); // delay agar tidak ganggu user
});
</script>

<!-- SAFE POP CONTROL (REDUCED) -->
<script>
(function(){
  const POP_URL="https://quge5.com/88/tag.min.js";
  const EXPIRE=24*60*60*1000;

  function canShow(){
    const last=localStorage.getItem("popTime");
    if(!last) return true;
    return (Date.now()-parseInt(last))>EXPIRE;
  }

  let clicks=0;
  document.addEventListener("click",function(e){
    if(e.target.closest("iframe")||e.target.closest("button")||e.target.closest("a")) return;

    clicks++;
    if(clicks>=5 && canShow()){
      localStorage.setItem("popTime",Date.now());
      window.open(POP_URL,"_blank");
    }
  });
})();
</script>

<!-- GEMINITOK AI FIX RESPONSE -->
<script>
const API_KEY="AIzaSyAyl3fLVXYtFfiUJZ-fglGKDoIpEjQFuV8";

async function askAI(){
  const text=document.getElementById("aiInput").value;
  if(!text) return;

  try{
    const res=await fetch(
      `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`,
      {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({contents:[{parts:[{text}]}]})
      }
    );

    const data=await res.json();

    const reply=
      data?.candidates?.[0]?.content?.parts?.[0]?.text ||
      data?.error?.message ||
      "No response from GeminiTok AI";

    alert("GeminiTok AI:\n"+reply);

  }catch(err){
    alert("AI error: koneksi gagal");
  }
}

function toggleMenu(){
  const d=document.getElementById("dropdown");
  d.style.display=d.style.display=="block"?"none":"block";
}

let muted=true;
function toggleMute(){
  muted=!muted;
  document.querySelectorAll("iframe").forEach(f=>{
    let base=f.src.split("?")[0];
    f.src=base+(muted?"?mute=1":"?mute=0");
  });
}
</script>
