<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MiniTok.fun - Viral Videos & AI Tools 2026</title>

<meta name="description" content="Watch viral videos, AI tools reviews, trending content and tech updates daily.">
<meta name="keywords" content="viral videos, AI tools, trending videos, tech review, video shorts">
<meta name="author" content="MiniTok.fun">
<meta name="robots" content="index, follow">

<link rel="stylesheet" href="style.css">
<link rel="icon" type="image/x-icon" href="/favicon.ico">

<style>
body{
  margin:0;
  background:black;
  font-family:sans-serif;
  overflow:hidden;
}

/* VIDEO FEED */
.container{
  height:100vh;
  overflow-y:scroll;
  scroll-snap-type:y mandatory;
}

.video-box{
  height:100vh;
  scroll-snap-align:start;
}

/* TOPBAR */
.topbar{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  display:flex;
  overflow-x:auto;
  background:rgba(0,0,0,0.7);
  z-index:9999;
}

.topbar button{
  color:white;
  background:none;
  border:none;
  padding:12px;
  cursor:pointer;
  font-size:14px;
}

/* MENU (ORIGINAL KEEP) */
.menu-btn{
  position:fixed;
  top:10px;
  right:15px;
  font-size:28px;
  z-index:10000;
  cursor:pointer;
  color:white;
}

.dropdown{
  display:none;
  position:fixed;
  top:50px;
  right:15px;
  background:#111;
  padding:10px;
  border-radius:8px;
  z-index:10000;
}

.dropdown a{
  display:block;
  padding:8px;
  color:white;
  text-decoration:none;
}

.show{display:block}

/* LOGIN */
.login-center{
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  text-align:center;
  z-index:99999;
  color:white;
}

.login-btn{
  padding:14px 25px;
  border:none;
  border-radius:30px;
  background:linear-gradient(45deg,#ff0050,#ff6600);
  color:white;
  cursor:pointer;
}

/* FOLLOW */
.follow-btn{
  position:fixed;
  bottom:25px;
  left:50%;
  transform:translateX(-50%);
  width:65px;
  height:65px;
  border-radius:50%;
  background:#ff0050;
  border:none;
  color:white;
  font-size:28px;
  z-index:99999;
  animation:pulse 1s infinite;
}

/* NOTIF */
.notif{
  position:fixed;
  top:10px;
  right:60px;
  color:white;
  z-index:10000;
}

/* ACTION PANEL TIKTOK */
.action-panel{
  position:absolute;
  right:10px;
  bottom:120px;
  display:flex;
  flex-direction:column;
  gap:15px;
  color:white;
}

.action-btn{
  font-size:22px;
  cursor:pointer;
}

/* SHOPEE CART */
.cart{
  position:fixed;
  bottom:110px;
  right:20px;
  font-size:28px;
  animation:blink 0.8s infinite;
}

@keyframes pulse{
  50%{transform:translateX(-50%) scale(1.1)}
}
@keyframes blink{
  50%{opacity:0.3}
}
</style>

</head>

<body>

<!-- MENU ORIGINAL (JANGAN DIHAPUS) -->
<div class="menu-btn" onclick="toggleMenu()">⋮</div>

<div class="dropdown" id="dropdown">
  <a href="blog.html">Blog</a>
  <a href="about.html">About</a>
  <a href="streaming.html">Streaming</a>
  <a href="game.html">Game</a>
  <a href="promo.html">Promo</a>
  <a href="blibli.html">Blibli</a>
  <a href="donasi.html">Donasi</a>
  <a href="privacy.html">Privacy</a>
  <a href="terms.html">Terms</a>
</div>

<!-- TOPBAR (KEEP) -->
<div class="topbar">
  <button>🔥 Trending</button>
  <button>📰 News</button>
  <button>⚽ Sport</button>
  <button>🎵 Musik</button>
</div>

<!-- FEED -->
<div class="container" id="feed">

  <div class="video-box" id="video1">

    <!-- ACTIONS -->
    <div class="action-panel">
      <div class="action-btn" onclick="likeVideo('video1')">❤️ <span id="like-video1">0</span></div>
      <div class="action-btn" onclick="commentVideo('video1')">💬</div>
      <div class="action-btn" onclick="shareVideo('video1')">📤</div>
    </div>

  </div>

</div>

<!-- SHOPEE CART -->
<div class="cart">🛒</div>

<!-- LOGIN -->
<div class="login-center" id="loginBox">
  <h2>Welcome to MiniTok.fun</h2>
  <button class="login-btn" id="loginBtn">Login with Google</button>
</div>

<!-- FOLLOW -->
<button class="follow-btn" id="followBtn">+</button>

<!-- NOTIF -->
<div class="notif">🔔 <span id="notifCount">0</span></div>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyBFfH4ix22IIjYczrXi4EeuAzH7eykWH1A",
    authDomain: "toktube-70b00.firebaseapp.com",
    projectId: "toktube-70b00",
    storageBucket: "toktube-70b00.firebasestorage.app",
    messagingSenderId: "668818456806",
    appId: "1:668818456806:web:6452e3e606819ff72abb27",
    measurementId: "G-MN85RFYLNV"
  };
  
firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();

let currentUser = null;
let creatorId = "OWNER";

/* LOGIN */
document.getElementById("loginBtn").onclick = () => {
  const provider = new firebase.auth.GoogleAuthProvider();
  auth.signInWithPopup(provider);
};

/* AUTH */
auth.onAuthStateChanged(user=>{
  if(user){
    currentUser = user;
    document.getElementById("loginBox").style.display="none";
    listenNotif(user.uid);
  }
});

/* LIKE */
function likeVideo(id){
  updateVideoStats(id,"likes");
}

/* COMMENT */
function commentVideo(id){
  let t = prompt("Comment:");
  if(!t) return;

  db.collection("comments").add({
    videoId:id,
    text:t,
    user:currentUser?.uid,
    time:Date.now()
  });

  updateVideoStats(id,"comments");
}

/* SHARE */
function shareVideo(id){
  const url = window.location.href + "?video=" + id;
  navigator.clipboard.writeText(url);
  updateVideoStats(id,"shares");
  alert("Shared!");
}

/* FOLLOW */
document.getElementById("followBtn").onclick = async ()=>{
  if(!currentUser) return alert("Login dulu!");

  const ref = db.collection("follows").doc(currentUser.uid+"_"+creatorId);
  const doc = await ref.get();

  if(doc.exists){
    await ref.delete();
    document.getElementById("followBtn").innerText="+";
  }else{
    await ref.set({
      followerId:currentUser.uid,
      creatorId,
      time:Date.now()
    });

    alert("Follow sukses 🔥");
  }

  updateFollowers();
};

/* NOTIF */
function listenNotif(){
  db.collection("follows")
  .where("creatorId","==",creatorId)
  .onSnapshot(()=>{
    alert("🔥 New follower!");
  });
}

/* FOLLOW COUNT */
async function updateFollowers(){
  const snap = await db.collection("follows")
  .where("creatorId","==",creatorId)
  .get();

  document.getElementById("notifCount").innerText = snap.size;
}

/* =========================
   🔥 VIRAL AI ENGINE (ADDED)
========================= */

async function updateVideoStats(id,type){
  const ref = db.collection("videos").doc(id);
  const doc = await ref.get();

  if(!doc.exists){
    await ref.set({likes:0,comments:0,shares:0,views:1,viralScore:1});
  }

  await ref.set({
    [type]: firebase.firestore.FieldValue.increment(1)
  },{merge:true});

  calculateScore(id);
}

async function calculateScore(id){
  const doc = await db.collection("videos").doc(id).get();
  const d = doc.data();

  const score =
    (d.likes||0)*1 +
    (d.comments||0)*2 +
    (d.shares||0)*3 +
    (d.views||0)*0.5;

  await db.collection("videos").doc(id).update({
    viralScore:score
  });
}

/* =========================
   🌍 EXPLORE AUTO RANK
========================= */

async function loadExplore(){
  const feed = document.getElementById("feed");
  feed.innerHTML="";

  const snap = await db.collection("videos")
  .orderBy("viralScore","desc")
  .limit(10)
  .get();

  snap.forEach(v=>{
    feed.innerHTML += `
      <div class="video-box">
        <h3 style="color:white">🔥 Score: ${v.data().viralScore||0}</h3>
      </div>
    `;
  });
}

setInterval(loadExplore,5000);
loadExplore();

function toggleMenu(){
  document.getElementById("dropdown").classList.toggle("show");
}
</script>

</body>
</html>
