<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MiniTok.fun - Viral Videos 2026</title>

<link rel="icon" href="/favicon.ico">

<style>
body{
  margin:0;
  background:black;
  font-family:sans-serif;
  overflow:hidden;
}

/* ================= TIKTOK SWIPE ================= */
.container{
  height:100vh;
  overflow-y:scroll;
  scroll-snap-type:y mandatory;
}

.video-box{
  height:100vh;
  scroll-snap-align:start;
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#000;
}

/* ================= TOPBAR ================= */
.topbar{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  display:flex;
  gap:10px;
  padding:10px;
  overflow-x:auto;
  z-index:9999;
  background:rgba(0,0,0,0.4);
}

.topbar button{
  color:white;
  background:none;
  border:none;
  padding:8px 12px;
  font-size:13px;
  white-space:nowrap;
}

/* ================= MENU ================= */
.menu-btn{
  position:fixed;
  top:10px;
  right:15px;
  font-size:26px;
  z-index:10000;
  color:white;
  cursor:pointer;
}

.dropdown{
  display:none;
  position:fixed;
  top:50px;
  right:15px;
  background:#111;
  padding:10px;
  border-radius:10px;
  z-index:10000;
}

.dropdown a{
  display:block;
  padding:8px;
  color:white;
  text-decoration:none;
}

.show{display:block}

/* ================= LOGIN CENTER ================= */
.login-center{
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  color:white;
  text-align:center;
  z-index:99999;
}

.login-btn{
  padding:12px 20px;
  border:none;
  border-radius:30px;
  background:linear-gradient(45deg,#ff0050,#ff6600);
  color:white;
}

/* ================= FOLLOW BUTTON (TIKTOK) ================= */
.follow-btn{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  width:60px;
  height:60px;
  border-radius:50%;
  background:#ff0050;
  color:white;
  font-size:28px;
  z-index:99999;
  animation:pulse 1s infinite;
}

/* ================= ACTION ICONS (TIKTOK STYLE) ================= */
.action-panel{
  position:absolute;
  right:12px;
  bottom:120px;
  display:flex;
  flex-direction:column;
  gap:18px;
  z-index:10;
}

.action-btn{
  color:white;
  font-size:22px;
  text-align:center;
  cursor:pointer;
}

/* Shopee cart */
.cart{
  position:fixed;
  bottom:100px;
  right:15px;
  font-size:28px;
  animation:blink 1s infinite;
}

/* notif */
.notif{
  position:fixed;
  top:10px;
  right:60px;
  color:white;
}

/* AI FLOAT (GEMINI LINK FIX) */
.ai-float{
  position:fixed;
  left:15px;
  bottom:90px;
  width:55px;
  height:55px;
  border-radius:50%;
  background:#2b6cff;
  display:flex;
  align-items:center;
  justify-content:center;
  color:white;
  text-decoration:none;
  z-index:9999;
}

/* animations */
@keyframes pulse{
  50%{transform:translateX(-50%) scale(1.15)}
}

@keyframes blink{
  50%{opacity:0.4}
}
</style>

</head>

<body>

<!-- GEMINI AI FIX -->
<a href="ai.html" class="ai-float">🤖</a>

<!-- MENU (KEEP ORIGINAL) -->
<div class="menu-btn" onclick="toggleMenu()">⋮</div>

<div class="dropdown" id="dropdown">
  <a href="blog.html">Blog</a>
  <a href="about.html">About</a>
  <a href="streaming.html">Streaming</a>
  <a href="game.html">Game</a>
  <a href="promo.html">Promo</a>
  <a href="blibli.html">Blibli</a>
  <a href="donasi.html">Donasi</a>
  <a href="privacy.html">Privacy</a>
  <a href="terms.html">Terms</a>
</div>

<!-- TOPBAR FIX -->
<div class="topbar">
  <button>🔥 Trending</button>
  <button>📰 News</button>
  <button>⚽ Sport</button>
  <button>🎵 Music</button>
</div>

<!-- FEED (TIKTOK SWIPE FIX) -->
<div class="container" id="feed">

  <div class="video-box" id="video1">

    <!-- TIKTOK ICONS -->
    <div class="action-panel">
      <div class="action-btn" onclick="like('video1')">❤️<div id="like-video1">0</div></div>
      <div class="action-btn" onclick="comment()">💬</div>
      <div class="action-btn" onclick="share('video1')">📤</div>
    </div>

  </div>

</div>

<!-- SHOPEE CART -->
<div class="cart">🛒</div>

<!-- LOGIN -->
<div class="login-center" id="loginBox">
  <h2>Welcome to MiniTok</h2>
  <button class="login-btn" id="loginBtn">Login Google</button>
</div>

<!-- FOLLOW -->
<button class="follow-btn" id="followBtn">+</button>

<!-- NOTIF -->
<div class="notif">🔔 <span id="notifCount">0</span></div>

<!-- FIREBASE FIX -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyBFfH4ix22IIjYczrXi4EeuAzH7eykWH1A",
    authDomain: "toktube-70b00.firebaseapp.com",
    projectId: "toktube-70b00",
    storageBucket: "toktube-70b00.firebasestorage.app",
    messagingSenderId: "668818456806",
    appId: "1:668818456806:web:6452e3e606819ff72abb27",
    measurementId: "G-MN85RFYLNV"
  };

firebase.initializeApp(firebaseConfig);

const auth=firebase.auth();
const db=firebase.firestore();

let currentUser=null;
let creatorId="OWNER";

/* LOGIN */
document.getElementById("loginBtn").onclick=()=>{
  auth.signInWithPopup(new firebase.auth.GoogleAuthProvider());
};

/* AUTH */
auth.onAuthStateChanged(u=>{
  if(u){
    currentUser=u;
    document.getElementById("loginBox").style.display="none";
  }
});

/* LIKE */
function like(id){
  let el=document.getElementById("like-"+id);
  el.innerText=parseInt(el.innerText)+1;
}

/* COMMENT */
function comment(){
  let t=prompt("Comment:");
  if(!t) return;
  alert("Komentar terkirim");
}

/* SHARE FIX (LINK BALIK KE VIDEO) */
function share(id){
  let link=window.location.origin+"?video="+id;
  navigator.clipboard.writeText(link);
  alert("Link copied: "+link);
}

/* FOLLOW */
document.getElementById("followBtn").onclick=()=>{
  if(!currentUser) return alert("Login dulu!");
  alert("Follow sukses 🔥");
};

function toggleMenu(){
  document.getElementById("dropdown").classList.toggle("show");
}
</script>

</body>
</html>
