<style>
body{
  margin:0;
  background:black;
  font-family:sans-serif;
  overflow:hidden;

/* ================= VIDEO ================= */

.container{
  height:100vh;
  overflow-y:scroll;
  scroll-snap-type:y mandatory;
}

.video-box{
  height:100vh;
  scroll-snap-align:start;
}

iframe{
  width:100%;
  height:100%;
  border:none;
}

/* ================= TOPBAR ================= */

.topbar{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  display:flex;
  overflow-x:auto;
  background:rgba(0,0,0,0.7);
  z-index:9999;
}

.topbar button{
  color:white;
  background:none;
  border:none;
  padding:12px;
  cursor:pointer;
  font-size:14px;
}

/* ================= MENU ================= */

.menu-btn{
  position:fixed;
  top:10px;
  right:15px;
  font-size:28px;
  z-index:10000;
  cursor:pointer;
  color:#2b6cff;   /* BIRU */
  font-weight:bold;
}

.dropdown{
  display:none;
  position:fixed;
  top:50px;
  right:15px;
  background:#111;
  padding:10px;
  border-radius:8px;
  z-index:10000;
  min-width:180px;
}

.dropdown a{
  display:block;
  padding:8px;
  color:white;
  text-decoration:none;
  font-size:14px;
}

.dropdown a:hover{
  background:#222;
}

.show{
  display:block;
}

/* ================= AI FLOAT ================= */

.ai-float{
  position:fixed;
  left:15px;
  bottom:90px;
  width:60px;
  height:60px;
  background:#2b6cff;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:26px;
  border-radius:50%;
  text-decoration:none;
  z-index:9999;
}

/* ================= VOLUME ================= */

.volume-control{
  position:fixed;
  top:60px;
  right:15px;
  z-index:9999;
  color:white;
}
</style>

</head>

<body>

<!-- AI FLOAT -->

  <button>😂 Comedy</button>
  <button>🎌 Anime</button>
  <button>📰 News</button>
  <button>⚽ Sports</button>
  <button>🛒 Products</button>
</div>

<!-- VOLUME -->
<div class="volume-control">
  🔊 <input type="range" id="volumeSlider" min="0" max="100" value="50">
</div>

<!-- VIDEO FEED -->
<div class="container">

  <div class="video-box">
    <div id="player1"></div>
  </div>

  <div class="video-box">
    <div id="player2"></div>
  </div>

  <div class="video-box">
    <div id="player3"></div>
  </div>

</div>

<!-- YOUTUBE API -->
<script src="https://www.youtube.com/iframe_api"></script>

<script>
let players = [];

/* YOUTUBE READY */
function onYouTubeIframeAPIReady(){

  players[0] = new YT.Player('player1',{
    videoId:'dQw4w9WgXcQ',
    playerVars:{autoplay:0,controls:0}
  });

  players[1] = new YT.Player('player2',{
    videoId:'9bZkp7q19f0',
    playerVars:{autoplay:0,controls:0}
  });

  players[2] = new YT.Player('player3',{
    videoId:'3tmd-ClpJxA',
    playerVars:{autoplay:0,controls:0}
  });
}

/* MENU */
function toggleMenu(){
  document.getElementById("dropdown").classList.toggle("show");
}

/* VOLUME */
document.addEventListener("DOMContentLoaded",function(){

  const slider=document.getElementById("volumeSlider");

  slider.addEventListener("input",function(){
    players.forEach(p=>{
      if(p && p.setVolume){
        p.setVolume(this.value);
      }
    });
  });

});

/* AUTO PLAY SCROLL */
const container=document.querySelector(".container");

container.addEventListener("scroll",function(){

  const boxes=document.querySelectorAll(".video-box");

  boxes.forEach((box,index)=>{
    const rect=box.getBoundingClientRect();
    const center=window.innerHeight/2;

    if(rect.top<=center && rect.bottom>=center){
      players[index]?.playVideo();
    }else{
      players[index]?.pauseVideo();
    }
  });

});
</script>
