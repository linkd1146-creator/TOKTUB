<style>
body{
  margin:0;
  background:black;
  font-family:sans-serif;
  overflow:hidden;
  color:white;
}

/* FEED SWIPE */
.container{
  height:100vh;
  overflow-y:scroll;
  scroll-snap-type:y mandatory;
}

.video-box{
  height:100vh;
  scroll-snap-align:start;
  position:relative;
}

/* TOPBAR */
.topbar{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  display:flex;
  overflow-x:auto;
  background:rgba(0,0,0,0.7);
  z-index:9999;
}

.topbar button{
  color:white;
  background:none;
  border:none;
  padding:12px;
  cursor:pointer;
}

/* MENU TIGA TITIK (TIDAK DIHAPUS) */
.menu-btn{
  position:fixed;
  top:10px;
  right:15px;
  font-size:28px;
  z-index:10000;
  cursor:pointer;
  color:white;
}

.dropdown{
  display:none;
  position:fixed;
  top:50px;
  right:15px;
  background:#111;
  padding:10px;
  border-radius:8px;
  z-index:10000;
}

.dropdown a{
  display:block;
  padding:8px;
  color:white;
  text-decoration:none;
}

.show{ display:block; }

/* FOLLOW BUTTON (TIKTOK STYLE) */
.follow-btn{
  position:fixed;
  bottom:25px;
  left:50%;
  transform:translateX(-50%);
  width:65px;
  height:65px;
  border-radius:50%;
  background:#ff0050;
  border:none;
  font-size:28px;
  z-index:99999;
  box-shadow:0 0 15px rgba(255,0,80,0.6);
}

/* LOGIN CENTER */
.login-center{
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  text-align:center;
  z-index:99999;
}

.login-btn{
  padding:14px 25px;
  border:none;
  border-radius:30px;
  background:linear-gradient(45deg,#ff0050,#ff6600);
  color:white;
  font-size:16px;
  cursor:pointer;
}

/* NOTIF */
.notif{
  position:fixed;
  top:10px;
  right:60px;
  z-index:99999;
}

/* ACTION ICONS (TIKTOK STYLE) */
.actions{
  position:absolute;
  right:10px;
  bottom:120px;
  display:flex;
  flex-direction:column;
  gap:15px;
}

.icon{
  width:45px;
  height:45px;
  border-radius:50%;
  background:rgba(255,255,255,0.15);
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
}

.cart{
  background:orange;
  animation:blink 0.8s infinite;
}

@keyframes blink{
  50%{opacity:0.3;}
}
</style>

</head>

<body>

<!-- AI FLOAT -->
<a href="ai.html" style="position:fixed;left:15px;bottom:90px;z-index:9999;">🤖</a>

<!-- NOTIF -->

<!-- LOGIN -->
<div class="login-center" id="loginBox">
  <h2>Welcome to MiniTok.fun</h2>
  <button class="login-btn" id="loginBtn">Login with Google</button>
</div>

<video autoplay loop muted width="100%" height="100%">

</video>

<div class="actions">

<div class="icon">❤️</div>

<div class="icon">💬</div>

<div class="icon">📤</div>

</div>

</div>

</div>

<!-- FOLLOW -->
<button class="follow-btn" id="followBtn">+</button>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig = {
apiKey:"AIzaSyBFfH4ix22IIjYczrXi4EeuAzH7eykWH1A",
authDomain:"toktube-70b00.firebaseapp.com",
projectId:"toktube-70b00",
storageBucket:"toktube-70b00.firebasestorage.app",
messagingSenderId:"668818456806",
appId:"1:668818456806:web:6452e3e606819ff72abb27"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();

let currentUser=null;
let creatorId="GANTI_UID";

/* MENU */
function toggleMenu(){
document.getElementById("dropdown").classList.toggle("show");
}

/* LOGIN */
document.getElementById("loginBtn").onclick=()=>{
const provider=new firebase.auth.GoogleAuthProvider();
auth.signInWithPopup(provider);
};

/* AUTH */
auth.onAuthStateChanged(user=>{
if(user){
currentUser=user;
document.getElementById("loginBox").style.display="none";
}
});

/* FOLLOW */
document.getElementById("followBtn").onclick=async()=>{
if(!currentUser) return alert("Login dulu!");

const ref=db.collection("follows").doc(currentUser.uid+"_"+creatorId);
const doc=await ref.get();

if(doc.exists){
await ref.delete();
document.getElementById("followBtn").innerText="+";
}else{
await ref.set({
followerId:currentUser.uid,
creatorId:creatorId,
time:Date.now()
});
document.getElementById("followBtn").innerText="✓";
}

const snap=await db.collection("follows")
.where("creatorId","==",creatorId).get();

document.getElementById("notifCount").innerText=snap.size;
};
</script>

</body>
