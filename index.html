<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MiniTok.fun - Viral Videos & AI Tools 2026</title>

<meta name="description" content="Watch viral videos, AI tools reviews, trending content and tech updates daily.">
<meta name="keywords" content="viral videos, AI tools, trending videos, tech review, video shorts">
<meta name="author" content="MiniTok.fun">
<meta name="robots" content="index, follow">

<link rel="stylesheet" href="style.css">

<style>
body{
  margin:0;
  background:black;
  font-family:sans-serif;
  overflow:hidden;
}

/* CONTAINER */
.container{
  height:100vh;
  overflow-y:scroll;
  scroll-snap-type:y mandatory;
}

.video-box{
  height:100vh;
  scroll-snap-align:start;
}

iframe{
  width:100%;
  height:100%;
  border:none;
}

/* TOPBAR */
.topbar{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  display:flex;
  overflow-x:auto;
  background:rgba(0,0,0,0.7);
  z-index:9999;
}

.topbar button{
  color:white;
  background:none;
  border:none;
  padding:12px;
  cursor:pointer;
}

/* MENU */
.menu-btn{
  position:fixed;
  top:10px;
  right:10px;
  font-size:28px;
  z-index:10000;
  cursor:pointer;
  color:white;
}

.dropdown{
  display:none;
  position:fixed;
  top:50px;
  right:10px;
  background:#111;
  padding:10px;
  border-radius:8px;
  z-index:10000;
}

.dropdown a{
  display:block;
  padding:8px;
  color:white;
  text-decoration:none;
}

.dropdown a:hover{
  background:#222;
}

.show{
  display:block;
}

/* AI FLOAT */
.ai-float{
  position:fixed;
  left:15px;
  bottom:90px;
  width:60px;
  height:60px;
  background:#2b6cff;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:26px;
  border-radius:50%;
  text-decoration:none;
  z-index:9999;
}

/* VOLUME */
.volume-control{
  position:fixed;
  top:60px;
  right:10px;
  z-index:9999;
  color:white;
}
</style>

</head>

<body>

<!-- AI FLOAT -->
<a href="ai.html" class="ai-float">🤖</a>

<!-- MENU -->
<div class="menu-btn" onclick="toggleMenu()">⋮</div>

<div class="dropdown" id="dropdown">
  <a href="blog.html">Blog</a>
  <a href="about.html">About</a>
  <a href="donasi.html">Donasi</a>
</div>

<!-- TOPBAR -->
<div class="topbar">
  <button>🔥 Trending</button>
  <button>😂 Comedy</button>
  <button>🎌 Anime</button>
  <button>📰 News</button>
  <button>⚽ Sports</button>
</div>

<!-- VOLUME -->
<div class="volume-control">
  🔊 <input type="range" id="volumeSlider" min="0" max="100" value="50">
</div>

<!-- VIDEO FEED -->
<div class="container">

  <div class="video-box">
    <div id="player1"></div>
  </div>

  <div class="video-box">
    <div id="player2"></div>
  </div>

  <div class="video-box">
    <div id="player3"></div>
  </div>

</div>

<!-- YOUTUBE API -->
<script src="https://www.youtube.com/iframe_api"></script>

<script>
let players = [];

function onYouTubeIframeAPIReady() {

  players[0] = new YT.Player('player1', {
    videoId: 'dQw4w9WgXcQ',
    playerVars:{ autoplay:0, controls:0 }
  });

  players[1] = new YT.Player('player2', {
    videoId: '9bZkp7q19f0',
    playerVars:{ autoplay:0, controls:0 }
  });

  players[2] = new YT.Player('player3', {
    videoId: '3tmd-ClpJxA',
    playerVars:{ autoplay:0, controls:0 }
  });
}

/* MENU */
function toggleMenu(){
  document.getElementById("dropdown").classList.toggle("show");
}

/* VOLUME */
document.addEventListener("DOMContentLoaded", function(){

  const slider = document.getElementById("volumeSlider");

  slider.addEventListener("input", function(){
    players.forEach(player=>{
      if(player && player.setVolume){
        player.setVolume(this.value);
      }
    });
  });

});

/* AUTO PLAY SCROLL */
const container = document.querySelector(".container");

container.addEventListener("scroll", function(){

  const boxes = document.querySelectorAll(".video-box");

  boxes.forEach((box,index)=>{
    const rect = box.getBoundingClientRect();
    const center = window.innerHeight / 2;

    if(rect.top <= center && rect.bottom >= center){
      players[index]?.playVideo();
    } else {
      players[index]?.pauseVideo();
    }
  });

});
</script>

</body>
</html>
