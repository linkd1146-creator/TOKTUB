<!-- ================= SAFE POP (1x / 24 JAM) ================= -->
<script>
(function(){
  const POP_URL = "https://quge5.com/88/tag.min.js"; // GANTI LINK
  const EXPIRE = 24 * 60 * 60 * 1000;

  function canShow(){
    const last = localStorage.getItem("popTime");
    if(!last) return true;
    return (Date.now() - parseInt(last)) > EXPIRE;
  }

  function showPop(){
    if(!canShow()) return;
    localStorage.setItem("popTime", Date.now());
    window.open(POP_URL, "_blank");
  }

  let clickCount = 0;
  document.addEventListener("click", function(){
    clickCount++;
    if(clickCount >= 3){
      showPop();
    }
  });
})();
</script>

<script>

  if(!localStorage.getItem("pushAsked")){
    document.getElementById("pushBox").style.display="block";
  }
}, 60000);

function enablePush(){
  localStorage.setItem("pushAsked","yes");
  document.getElementById("pushBox").style.display="none";

<script>
(function(){
  const DIRECT_LINK = "https://quge5.com/88/tag.min.js"; // GANTI
  const EXPIRE = 24 * 60 * 60 * 1000;

  function canShow(){
    const last = localStorage.getItem("directTime");
    if(!last) return true;
    return (Date.now() - parseInt(last)) > EXPIRE;
  }

  function isIgnored(element){
    return (
      element.closest("video") ||
      element.closest("iframe") ||
      element.closest(".menu-btn") ||
      element.closest(".dropdown") ||
      element.closest(".topbar") ||
      element.closest("a") ||
      element.closest("button")
    );
  }

  let validClicks = 0;

  document.addEventListener("click", function(e){

    // Jika klik di area yang harus diabaikan → stop
    if(isIgnored(e.target)) return;

    validClicks++;

    if(validClicks >= 3 && canShow()){
      localStorage.setItem("directTime", Date.now());
      window.open(DIRECT_LINK, "_blank");
    }

  });

})();
</script>
