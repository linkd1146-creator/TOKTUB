<!-- BOT ICON -->
<div class="bot-icon" onclick="toggleAI()">🤖</div>

<!-- AI PANEL -->
<div class="ai-panel" id="aiPanel">

  <div class="ai-header">
    GeminiTok AI
    <span class="close-btn" onclick="toggleAI()">✖</span>
  </div>

  <div class="ai-mode">
    <button onclick="setMode('chat')" id="chatBtn">💬</button>
    <button onclick="setMode('voice')" id="voiceBtn">🎤</button>
  </div>

  <div class="ai-chat" id="aiChat"></div>

  <div class="ai-input">
    <input id="aiText" placeholder="Tulis pesan...">
    <button onclick="sendAI()">Send</button>
  </div>

</div>

<script>
const API_KEY = "MASUKKAN_API_KEY_KAMU_DISINI";

/* OPEN CLOSE PANEL */
function toggleAI(){
  const panel=document.getElementById("aiPanel");
  panel.style.display = (panel.style.display==="flex")?"none":"flex";
}

/* ADD MESSAGE */
function addAI(text,type){
  const div=document.createElement("div");
  div.className="msg "+type;
  div.innerText=text;
  const chat=document.getElementById("aiChat");
  chat.appendChild(div);
  chat.scrollTop=chat.scrollHeight;
}

/* SEND CHAT */
async function sendAI(){
  const input=document.getElementById("aiText");
  const text=input.value;
  if(!text) return;

  addAI(text,"user");
  input.value="";

  try{
    const res=await fetch(
      "https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key="+API_KEY,
      {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
          contents:[{
            role:"user",
            parts:[{text:"Jawab seperti ChatGPT. "+text}]
          }]
        })
      }
    );

    const data=await res.json();

    const reply=
      data?.candidates?.[0]?.content?.parts?.[0]?.text
      || "No response";

    addAI(reply,"ai");

  }catch(e){
    addAI("Error koneksi AI","ai");
  }
}

/* VOICE */
function setMode(mode){
  document.getElementById("chatBtn").classList.remove("active");
  document.getElementById("voiceBtn").classList.remove("active");

  if(mode==="chat"){
    document.getElementById("chatBtn").classList.add("active");
  }else{
    document.getElementById("voiceBtn").classList.add("active");
    startVoice();
  }
}

function startVoice(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){
    alert("Voice tidak support");
    return;
  }

  const rec=new SR();
  rec.lang="id-ID";
  rec.start();

  rec.onresult=(e)=>{
    document.getElementById("aiText").value=
    e.results[0][0].transcript;
  };
}

setMode("chat");
</script>

<!-- ================= SAFE POP (1x / 24 JAM) ================= -->
<script>
(function(){
  const POP_URL = ""; // GANTI LINK
  const EXPIRE = 24 * 60 * 60 * 1000;

  function canShow(){
    const last = localStorage.getItem("popTime");
    if(!last) return true;
    return (Date.now() - parseInt(last)) > EXPIRE;
  }

  function showPop(){
    if(!canShow()) return;
    localStorage.setItem("popTime", Date.now());
    window.open(POP_URL, "_blank");
  }

  let clickCount = 0;
  document.addEventListener("click", function(){
    clickCount++;
    if(clickCount >= 3){
      showPop();
    }
  });
})();
</script>

<script>
(function(){
  const DIRECT_LINK = ""; // GANTI
  const EXPIRE = 24 * 60 * 60 * 1000;

  function canShow(){
    const last = localStorage.getItem("directTime");
    if(!last) return true;
    return (Date.now() - parseInt(last)) > EXPIRE;
  }

  function isIgnored(element){
    return (
      element.closest("video") ||
      element.closest("iframe") ||
      element.closest(".menu-btn") ||
      element.closest(".dropdown") ||
      element.closest(".topbar") ||
      element.closest("a") ||
      element.closest("button")
    );
  }

  let validClicks = 0;

  document.addEventListener("click", function(e){

    // Jika klik di area yang harus diabaikan → stop
    if(isIgnored(e.target)) return;

    validClicks++;

    if(validClicks >= 3 && canShow()){
      localStorage.setItem("directTime", Date.now());
      window.open(DIRECT_LINK, "_blank");
    }

  });

})();
</script>
