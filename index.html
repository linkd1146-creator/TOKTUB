<!-- ================= FIREBASE COMPAT (FIXED) ================= -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
/* ================= FIREBASE CONFIG ================= */
const firebaseConfig = {
apiKey: "AIzaSyBFfH4ix22IIjYczrXi4EeuAzH7eykWH1A",
authDomain: "toktube-70b00.firebaseapp.com",
projectId: "toktube-70b00",
storageBucket: "toktube-70b00.firebasestorage.app",
messagingSenderId: "668818456806",
appId: "1:668818456806:web:6452e3e606819ff72abb27"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();

let currentUser = null;
let creatorId = "GANTI_DENGAN_UID_KAMU";

/* ================= MENU LOGIC ================= */
function toggleMenu(){
document.getElementById("dropdown").classList.toggle("show");
}

/* ================= LOGIN BUTTON ================= */
const loginBtn = document.createElement("button");
loginBtn.innerText="Login";
loginBtn.style.position="fixed";
loginBtn.style.bottom="160px";
loginBtn.style.right="15px";
loginBtn.style.zIndex="99999";
document.body.appendChild(loginBtn);

loginBtn.onclick=()=>{
const provider=new firebase.auth.GoogleAuthProvider();
auth.signInWithPopup(provider);
};

/* ================= FOLLOW BUTTON ================= */
const followBtn=document.createElement("button");
followBtn.innerText="Follow";
followBtn.style.position="fixed";
followBtn.style.bottom="120px";
followBtn.style.right="15px";
followBtn.style.zIndex="99999";
document.body.appendChild(followBtn);

/* ================= FOLLOWER COUNT ================= */
const followerBox=document.createElement("div");
followerBox.style.position="fixed";
followerBox.style.bottom="90px";
followerBox.style.right="15px";
followerBox.style.color="white";
followerBox.innerHTML="Followers: <span id='count'>0</span>";
document.body.appendChild(followerBox);

/* ================= AUTH STATE ================= */
auth.onAuthStateChanged(user=>{
if(user){
currentUser=user;
loginBtn.style.display="none";
console.log("UID:",user.uid);
}
});

/* ================= FOLLOW SYSTEM ================= */
followBtn.onclick=async ()=>{
if(!currentUser) return alert("Login dulu!");

const ref=db.collection("follows")
.doc(currentUser.uid+"_"+creatorId);

const doc=await ref.get();

if(doc.exists){
await ref.delete();
followBtn.innerText="Follow";
}else{
await ref.set({
followerId:currentUser.uid,
creatorId:creatorId,
timestamp:Date.now()
});
followBtn.innerText="Unfollow";
}

updateCount();
};

/* ================= COUNT FOLLOWER ================= */
async function updateCount(){
const snap=await db.collection("follows")
.where("creatorId","==",creatorId)
.get();

document.getElementById("count").innerText=snap.size;
}

updateCount();

</script>
