/* ===== TOP BAR LAYOUT SAFE ===== */

.ai-bar input{

.ai-bar button{
  background:#2b6cff;
  border:none;
  color:white;
  padding:8px 10px;
  border-radius:6px;
}

/* MENU 3 DOTS (SAFE RIGHT TOP) */
.menu-btn{
  position:fixed;
  top:10px;
  right:10px;
  font-size:26px;
  z-index:200;
  cursor:pointer;
}

.dropdown{
  position:fixed;
  top:50px;
  right:10px;
  background:#111;
  padding:10px;
  border-radius:10px;
  display:none;
  z-index:199;
}

.dropdown a{
  display:block;
  color:white;
  text-decoration:none;
  margin:6px 0;
}

/* CATEGORY BAR (NOT OVERLAP AI + MENU) */
.topbar{
  position:fixed;
  top:55px;
  width:100%;
  display:flex;
  overflow-x:auto;
  gap:8px;
  background:rgba(0,0,0,0.9);
  padding:8px;
  z-index:90;
  white-space:nowrap;
}

.topbar button{
  background:#222;
  color:white;
  border:none;
  padding:6px 10px;
  border-radius:20px;
  font-size:12px;
}

/* FEED FROM app.js */
.container{
  margin-top:110px;
  height:100vh;
  overflow-y:auto;
}

/* VOLUME */
.volume{
  position:fixed;
  left:10px;
  top:100px;
  background:#111;
  padding:6px;
  border-radius:8px;
  z-index:150;
  font-size:12px;
}

</style>

</head>

<!-- ===== GEMINITOK AI (NO BENTROK MENU) ===== -->

<!-- ADS SAFE -->
<script>
window.addEventListener("load", function(){
  let s=document.createElement("script");
  s.src="https://quge5.com/88/tag.min.js";
  s.setAttribute("data-zone","237451");
  s.async=true;
  document.body.appendChild(s);
});
</script>

<!-- GEMINI TOK AI SCRIPT -->
<script>
const API_KEY="AIzaSyAyl3fLVXYtFfiUJZ-fglGKDoIpEjQFuV8";

async function askAI(){
  const text=document.getElementById("aiInput").value;
  if(!text) return;

  const res=await fetch(
    `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`,
    {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({contents:[{parts:[{text}]}]})
    }
  );

  const data=await res.json();
  alert("GeminiTok AI: "+(data.candidates?.[0]?.content?.parts?.[0]?.text||"No response"));
}

function toggleMenu(){
  const d=document.getElementById("dropdown");
  d.style.display=d.style.display=="block"?"none":"block";
}

let muted=true;
function toggleMute(){
  muted=!muted;
  document.querySelectorAll("iframe").forEach(f=>{
    let base=f.src.split("?")[0];
    f.src=base+(muted?"?mute=1":"?mute=0");
  });
}
</script>

<!-- ===== MAIN VIDEO APP ===== -->
<script src="app.js" defer></script>

</body>
