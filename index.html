<!DOCTYPE html>

<head>

<link rel="stylesheet" href="style.css">

position:fixed;

width:100%;

display:flex;

z-index:99999;

<div>

</div>

<div>
<button onclick="prevMusic()">⏮</button>

<style>
body{
  margin:0;
  background:black;
  font-family:sans-serif;
  overflow:hidden;
}

/* VIDEO */
.container{
  height:100vh;
  overflow-y:scroll;
  scroll-snap-type:y mandatory;
}

.video-box{
  height:100vh;
  scroll-snap-align:start;
}

iframe{
  width:100%;
  height:100%;
  border:none;
}

/* TOPBAR */
.topbar{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  display:flex;
  overflow-x:auto;
  background:rgba(0,0,0,0.7);
  z-index:9999;
}

.topbar.trending { background:#ff004f; }
.topbar.news { background:#0066ff; }
.topbar.sports { background:#00c853; }
  
.topbar button{
  color:white;
  background:none;
  border:none;
  padding:12px;
  cursor:pointer;
  font-size:14px;
}

.topbar button.active{
  color:#2b6cff;
  border-bottom:2px solid #2b6cff;
}

/* MENU */
.menu-btn{
  position:fixed;
  top:10px;
  right:15px;
  font-size:28px;
  z-index:10000;
  cursor:pointer;
  color:#2b6cff;
  font-weight:bold;
}

.dropdown{
  display:none;
  position:fixed;
  top:50px;
  right:15px;
  background:#111;
  padding:10px;
  border-radius:8px;
  z-index:10000;
  min-width:180px;
}

.dropdown a{
  display:block;
  padding:8px;
  color:white;
  text-decoration:none;
  font-size:14px;
}

.dropdown a:hover{
  background:#222;
}

.show{
  display:block;
}

/* AI FLOAT */
.ai-float{
  position:fixed;
  left:15px;
  bottom:90px;
  width:60px;
  height:60px;
  background:#2b6cff;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:26px;
  border-radius:50%;
  text-decoration:none;
  z-index:9999;
}

/* VOLUME */
.volume-control{
  position:fixed;
  top:60px;
  right:15px;
  z-index:9999;
  color:white;
}
</style>

</head>

<body>

<!-- AI FLOAT -->
<a href="ai.html" class="ai-float">🤖</a>

<!-- MENU -->
<div class="menu-btn" onclick="toggleMenu()">⋮</div>

<div class="dropdown" id="dropdown">
  <a href="blog.html">Blog</a>
  <a href="about.html">About</a>
  <a href="streaming.html">Streaming</a>
  <a href="affiliate.html">Shopee Partner</a>
  <a href="promo.html">Promo</a>
  <a href="blibli.html">Blibli</a>
  <a href="donasi.html">Donasi</a>
  <a href="disclaimer.html">Disclaimer</a>
  <a href="privacy.html">Privacy</a>
  <a href="terms.html">Terms</a>
</div>

<!-- TOPBAR -->
<div class="topbar" id="topbar">
  <button class="cat-btn active" onclick="setCategory('trending')">🔥 Trending</button>
  <button class="cat-btn" onclick="setCategory('news')">📰 Berita</button>
  <button class="cat-btn" onclick="setCategory('sports')">⚽ Olahraga</button>
  <button class="cat-btn" onclick="openMusic()">🎵 Musik</button>
</div>

<!-- VIDEO FEED -->
<div class="container" id="feed"></div>

<!-- MUSIC SECTION (Hidden Default) -->
<div id="musicSection" style="display:none; height:100vh; background:black; color:white; text-align:center; padding-top:80px;">
  <h2>🎵 Music Player</h2>
  <div id="musicPlayer" style="margin-top:20px;"></div>

  <div style="margin-top:15px;">
    <button onclick="prevMusic()">⏮</button>
    <button onclick="nextMusic()">⏭</button>
  </div>
</div>
  
<!-- VOLUME -->
<div class="volume-control">
  🔊 <input type="range" id="volumeSlider" min="0" max="100" value="50">
</div>

<!-- VIDEO FEED -->
<div class="container" id="feed">

  <div class="video-box">
    <div id="player1"></div>
  </div>

  <div class="video-box">
    <div id="player2"></div>
  </div>

  <div class="video-box">
    <div id="player3"></div>
  </div>

</div>

<!-- YOUTUBE API (LOAD SEKALI SAJA) -->
<script src="https://www.youtube.com/iframe_api"></script>

<!-- APP.JS -->
<script src="app.js" defer></script>

<script>
/* MENU TOGGLE */
function toggleMenu(){
  document.getElementById("dropdown").classList.toggle("show");
}

/* TOPBAR ACTIVE */
const buttons = document.querySelectorAll(".cat-btn");

buttons.forEach(btn=>{
  btn.addEventListener("click",function(){
    buttons.forEach(b=>b.classList.remove("active"));
    this.classList.add("active");
  });
});
</script>

</body>
</html>
