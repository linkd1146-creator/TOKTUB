<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MiniTok.fun - Viral Videos & AI Tools 2026</title>

<link rel="stylesheet" href="style.css">

<style>
body{
  margin:0;
  font-family:Arial;
  background:black;
  color:white;
  overflow:hidden;
}

/* ===== AI BAR ===== */
.ai-bar{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  background:#1a1a1a;
  display:flex;
  align-items:center;
  gap:8px;
  padding:6px;
  z-index:9999;
}

.menu-btn{
  font-size:26px;
  cursor:pointer;
  padding:0 10px;
  color:white;
}

.ai-bar input{
  flex:1;
  padding:8px;
  border:none;
  border-radius:6px;
  outline:none;
}

.ai-bar button{
  background:#2b6cff;
  border:none;
  color:white;
  padding:8px 10px;
  border-radius:6px;
}

/* ===== CATEGORY ===== */
.topbar{
  position:fixed;
  top:60px;
  width:100%;
  display:flex;
  overflow-x:auto;
  gap:8px;
  background:rgba(0,0,0,0.9);
  padding:8px;
  z-index:90;
  white-space:nowrap;
}

.topbar button{
  background:#222;
  color:white;
  border:none;
  padding:6px 10px;
  border-radius:20px;
  font-size:12px;
}

/* ===== FEED ===== */
.container{
  margin-top:120px;
  height:100vh;
  overflow-y:auto;
}

/* ===== CHAT PANEL ===== */
.chat-panel{
  position:fixed;
  right:-100%;
  top:0;
  width:320px;
  height:100%;
  background:#0f0f0f;
  z-index:99999;
  transition:0.3s;
  display:flex;
  flex-direction:column;
  border-left:1px solid #222;
}

.chat-box{
  flex:1;
  overflow-y:auto;
  padding:10px;
}

.msg{
  margin:5px 0;
  padding:8px;
  border-radius:8px;
  font-size:13px;
}

.user{background:#2b6cff;}
.ai{background:#222;}

.chat-input{
  display:flex;
  gap:5px;
  padding:8px;
  border-top:1px solid #222;
}

.chat-input input{
  flex:1;
  padding:8px;
}

.chat-input button{
  background:#2b6cff;
  color:white;
  border:none;
  padding:8px;
}

/* ===== VOICE BUTTON STYLE ===== */
</style>

</head>
<body>

<!-- AI BAR -->
<div class="ai-bar">

  <div class="menu-btn" onclick="toggleMenu()">☰</div>

  <input id="aiInput" placeholder="GeminiTok AI...">

  <button onclick="startVoice()">🎤</button>

  <button onclick="askAI()">AI</button>

  <button onclick="toggleChat()">💬</button>

</div>

<!-- CATEGORY -->
<div class="topbar">
  <button>🔥 Trending</button>
  <button>😂 Comedy</button>
  <button>🎌 Anime</button>
  <button>📰 News</button>
  <button>⚽ Sports</button>
  <button>🛒 Products</button>
</div>

<!-- FEED -->
<div class="container" id="feed"></div>

<!-- MENU -->
<div class="dropdown" id="dropdown">
  <a href="blog.html">Blog</a>
  <a href="about.html">About</a>
  <a href="streaming.html">Streaming</a>
  <a href="affiliate.html">Shopee Partner</a>
  <a href="promo.html">Promo</a>
  <a href="blibli.html">Blibli</a>
  <a href="donasi.html">Donasi</a>
  <a href="disclaimer.html">Disclaimer</a>
  <a href="privacy.html">Privacy</a>
  <a href="terms.html">Terms</a>
</div>

<!-- CHAT PANEL -->
<div class="chat-panel" id="chatPanel">

  <div class="chat-box" id="chatBox"></div>

  <div class="chat-input">
    <input id="chatInput" placeholder="Ketik pesan...">
    <button onclick="sendChat()">Send</button>
  </div>

</div>

<!-- ===== SCRIPT ===== -->
<script>
let API_KEY = "AIzaSyAyl3fLVXYtFfiUJZ-fglGKDoIpEjQFuV8"; // isi API Gemini kamu

function toggleChat(){
  const panel = document.getElementById("chatPanel");
  panel.style.right = panel.style.right === "0px" ? "-100%" : "0px";
}

function addMsg(text,type){
  const box=document.getElementById("chatBox");
  const div=document.createElement("div");
  div.className="msg "+type;
  div.innerText=text;
  box.appendChild(div);
  box.scrollTop=box.scrollHeight;
}

async function sendChat(){
  const input=document.getElementById("chatInput");
  const text=input.value;
  if(!text) return;

  addMsg(text,"user");
  input.value="";

  const res=await fetch(
    `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`,
    {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({contents:[{parts:[{text}]}]})
    }
  );

  const data=await res.json();

  const reply =
    data?.candidates?.[0]?.content?.parts?.[0]?.text ||
    "AI tidak merespon";

  addMsg(reply,"ai");
}

function startVoice(){
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SpeechRecognition){
    alert("Voice tidak support");
    return;
  }

  const recognition = new SpeechRecognition();
  recognition.lang = "id-ID";
  recognition.start();

  recognition.onresult = function(e){
    document.getElementById("aiInput").value =
    e.results[0][0].transcript;
  };
}

function askAI(){
  const text=document.getElementById("aiInput").value;
  if(!text) return;
  alert("AI: " + text);
}

function toggleMenu(){
  const d=document.getElementById("dropdown");
  d.style.display=d.style.display=="block"?"none":"block";
}
</script>

<!-- APP.JS -->
<script src="app.js" defer></script>

</body>
</html>
