<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MiniTok.fun - Viral Videos & AI Tools 2026</title>

<meta name="description" content="Watch viral videos, AI tools reviews, trending content and tech updates daily.">
<meta name="keywords" content="viral videos, AI tools, trending videos, tech review, video shorts">
<meta name="author" content="MiniTok.fun">
<meta name="robots" content="index, follow">

<link rel="stylesheet" href="style.css">

<style>
body{
  margin:0;
  background:black;
  font-family:sans-serif;
  overflow:hidden;
}

/* VIDEO FEED */
.container{
  height:100vh;
  overflow-y:scroll;
  scroll-snap-type:y mandatory;
}

.video-box{
  height:100vh;
  scroll-snap-align:start;
}

/* TOPBAR */
.topbar{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  display:flex;
  overflow-x:auto;
  background:rgba(0,0,0,0.7);
  z-index:9999;
}

.topbar.trending { background:#ff004f; }
.topbar.news { background:#0066ff; }
.topbar.sports { background:#00c853; }
.topbar.music { background:#9c27b0; }

.topbar button{
  color:white;
  background:none;
  border:none;
  padding:12px;
  cursor:pointer;
  font-size:14px;
}

.topbar button.active{
  border-bottom:2px solid white;
}

/* MENU */
.menu-btn{
  position:fixed;
  top:10px;
  right:15px;
  font-size:28px;
  z-index:10000;
  cursor:pointer;
  color:white;
}

.dropdown{
  display:none;
  position:fixed;
  top:50px;
  right:15px;
  background:#111;
  padding:10px;
  border-radius:8px;
  z-index:10000;
}

.dropdown a{
  display:block;
  padding:8px;
  color:white;
  text-decoration:none;
}

.dropdown a:hover{
  background:#222;
}

.show{ display:block; }

/* MINI MUSIC BAR */
#miniMusicBar{
  position:fixed;
  bottom:0;
  left:0;
  width:100%;
  height:70px;
  background:#111;
  display:none;
  align-items:center;
  justify-content:space-between;
  padding:10px 20px;
  color:white;
  z-index:99999;
}

/* AI FLOAT */
.ai-float{
  position:fixed;
  left:15px;
  bottom:90px;
  width:60px;
  height:60px;
  background:#2b6cff;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:26px;
  border-radius:50%;
  text-decoration:none;
  z-index:9999;
}

/* VOLUME */
.volume-control{
  position:fixed;
  top:60px;
  right:15px;
  z-index:9999;
  color:white;
}
</style>

</head>

<body>

<!-- AI FLOAT -->
<a href="ai.html" class="ai-float">🤖</a>

<!-- MENU -->
<div class="menu-btn" onclick="toggleMenu()">⋮</div>

<div class="dropdown" id="dropdown">
  <a href="blog.html">Blog</a>
  <a href="about.html">About</a>
  <a href="streaming.html">Streaming</a>
  <a href="affiliate.html">Shopee Partner</a>
  <a href="promo.html">Promo</a>
  <a href="blibli.html">Blibli</a>
  <a href="donasi.html">Donasi</a>
  <a href="privacy.html">Privacy</a>
  <a href="terms.html">Terms</a>
</div>

<!-- TOPBAR -->
<div class="topbar trending" id="topbar">
  <button class="cat-btn active" data-cat="trending" onclick="setCategory('trending')">🔥 Trending</button>
  <button class="cat-btn" data-cat="news" onclick="setCategory('news')">📰 News</button>
  <button class="cat-btn" data-cat="sports" onclick="setCategory('sports')">⚽ Sport</button>
  <button class="cat-btn" data-cat="music" onclick="setCategory('music')">🎵 Musik</button>
</div>

<!-- VIDEO FEED -->
<div class="container" id="feed"></div>

<!-- MUSIC SECTION -->
<div id="musicSection" style="display:none; height:100vh; background:black; color:white; text-align:center; padding-top:80px;">
  <h2>🎵 Music Player</h2>
  <div id="musicPlayer"></div>

  <div style="margin-top:15px;">
    <button onclick="prevMusic()">⏮</button>
    <button onclick="nextMusic()">⏭</button>
  </div>
</div>

<!-- MINI FLOATING MUSIC BAR -->
<div id="miniMusicBar">
  <div>🎵 <span id="musicTitle">Music Player</span></div>
  <div>
    <button onclick="prevMusic()">⏮</button>
    <button onclick="nextMusic()">⏭</button>
    <button onclick="toggleMusic()">⏯</button>
  </div>
</div>

<!-- VOLUME -->
<div class="volume-control">
  🔊 <input type="range" id="volumeSlider" min="0" max="100" value="50">
</div>

<!-- YOUTUBE API -->
<script src="https://www.youtube.com/iframe_api"></script>

<!-- APP JS -->
<script src="app.js" defer></script>

<script>
function toggleMenu(){
  document.getElementById("dropdown").classList.toggle("show");
}
</script>

</body>
</html>
