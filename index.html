<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MiniTok.fun - Viral Videos & AI Tools 2026</title>

<meta name="description" content="Watch viral videos, AI tools reviews, trending content and tech updates daily.">
<meta name="keywords" content="viral videos, AI tools, trending videos, tech review, video shorts">
<meta name="author" content="MiniTok.fun">
<meta name="robots" content="index, follow">

<link rel="icon" href="/favicon.ico">

<style>
body{
  margin:0;
  background:black;
  font-family:sans-serif;
  overflow:hidden;
}

/* FEED */
.container{
  height:100vh;
  overflow-y:scroll;
  scroll-snap-type:y mandatory;
}

.video-box{
  height:100vh;
  scroll-snap-align:start;
  position:relative;
}

/* ================= TOPBAR ================= */
.topbar{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  display:flex;
  overflow-x:auto;
  background:rgba(0,0,0,0.7);
  z-index:9999;
}

.topbar button{
  color:white;
  background:none;
  border:none;
  padding:12px;
  font-size:14px;
  cursor:pointer;
}

.topbar button.active{
  border-bottom:2px solid white;
}

/* ================= MENU ================= */
.menu-btn{
  position:fixed;
  top:10px;
  right:15px;
  font-size:28px;
  z-index:10000;
  color:white;
  cursor:pointer;
}

.dropdown{
  display:none;
  position:fixed;
  top:50px;
  right:15px;
  background:#111;
  padding:10px;
  border-radius:8px;
  z-index:10000;
}

.dropdown a{
  display:block;
  padding:8px;
  color:white;
  text-decoration:none;
}

.show{display:block}

/* ================= LOGIN ================= */
.login-center{
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  z-index:99999;
  color:white;
  text-align:center;
}

/* ================= FOLLOW ================= */
.follow-btn{
  position:fixed;
  bottom:25px;
  left:50%;
  transform:translateX(-50%);
  width:65px;
  height:65px;
  border-radius:50%;
  background:#ff0050;
  color:white;
  font-size:28px;
  z-index:99999;
  animation:pulse 1s infinite;
}

/* ================= ACTION PANEL ================= */
.action-panel{
  position:absolute;
  right:10px;
  bottom:120px;
  display:flex;
  flex-direction:column;
  gap:15px;
  color:white;
  z-index:9999;
}

.action-btn{
  font-size:22px;
}

/* ================= CART ================= */
.cart{
  position:fixed;
  bottom:100px;
  right:20px;
  font-size:30px;
  animation:blink 0.8s infinite;
}

/* ================= NOTIF ================= */
.notif{
  position:fixed;
  top:10px;
  right:60px;
  color:white;
}

/* ================= AI ================= */
.ai-btn{
  position:fixed;
  left:15px;
  bottom:180px;
  width:55px;
  height:55px;
  background:#00c3ff;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  color:white;
  font-size:24px;
  z-index:99999;
  cursor:pointer;
}

.ai-box{
  position:fixed;
  left:15px;
  bottom:250px;
  width:260px;
  height:300px;
  background:#111;
  display:none;
  flex-direction:column;
  z-index:99999;
}

.ai-header{
  background:#00c3ff;
  padding:10px;
  color:white;
}

.ai-chat{
  flex:1;
  overflow:auto;
  padding:10px;
  color:white;
  font-size:13px;
}

#aiInput{
  padding:10px;
  border:none;
}

/* ANIMATION */
@keyframes pulse{
  0%{transform:translateX(-50%) scale(1)}
  50%{transform:translateX(-50%) scale(1.1)}
  100%{transform:translateX(-50%) scale(1)}
}

@keyframes blink{
  50%{opacity:0.3}
}
</style>

</head>

<body>

<!-- MENU -->
<div class="menu-btn" onclick="toggleMenu()">⋮</div>
<div class="dropdown" id="dropdown">
  <a href="blog.html">Blog</a>
  <a href="about.html">About</a>
  <a href="streaming.html">Streaming</a>
  <a href="game.html">Game</a>
  <a href="promo.html">Promo</a>
  <a href="blibli.html">Blibli</a>
  <a href="donasi.html">Donasi</a>
  <a href="privacy.html">Privacy</a>
  <a href="terms.html">Terms</a>
</div>

<!-- TOPBAR (FIXED) -->
<div class="topbar">
  <button>🔥 Trending</button>
  <button>📰 News</button>
  <button>⚽ Sport</button>
  <button>🎵 Musik</button>
</div>

<!-- FEED -->
<div class="container" id="feed">

  <div class="video-box" data-id="video1">

    <div class="action-panel">
      <div class="action-btn" onclick="likeVideo('video1')">❤️</div>
      <div class="action-btn" onclick="commentVideo('video1')">💬</div>
      <div class="action-btn" onclick="shareVideo('video1')">📤</div>
    </div>

  </div>

</div>

<!-- CART -->
<div class="cart">🛒</div>

<!-- LOGIN -->
<div class="login-center" id="loginBox">
  <h2>Welcome to MiniTok.fun</h2>
  <button onclick="login()">Login</button>
</div>

<!-- FOLLOW -->
<button class="follow-btn" id="followBtn">+</button>

<!-- NOTIF -->
<div class="notif">🔔 <span id="notifCount">0</span></div>

<!-- AI GEMINITOK -->
<div class="ai-btn" onclick="toggleAI()">🤖</div>

<div class="ai-box" id="aiBox">
  <div class="ai-header">GeminiTok AI</div>
  <div class="ai-chat" id="aiChat"></div>
  <input id="aiInput" placeholder="Tanya AI..." />
</div>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyBFfH4ix22IIjYczrXi4EeuAzH7eykWH1A",
    authDomain: "toktube-70b00.firebaseapp.com",
    projectId: "toktube-70b00",
    storageBucket: "toktube-70b00.firebasestorage.app",
    messagingSenderId: "668818456806",
    appId: "1:668818456806:web:6452e3e606819ff72abb27",
    measurementId: "G-MN85RFYLNV"
  };

firebase.initializeApp(firebaseConfig);

const auth=firebase.auth();
const db=firebase.firestore();

let currentUser=null;
let creatorId="OWNER";

/* LOGIN */
function login(){
  auth.signInWithPopup(new firebase.auth.GoogleAuthProvider());
}

/* AUTH */
auth.onAuthStateChanged(user=>{
  if(user){
    currentUser=user;
    document.getElementById("loginBox").style.display="none";
  }
});

/* LIKE / COMMENT / SHARE */
function likeVideo(id){ console.log("like",id); }
function commentVideo(id){ prompt("Comment:"); }
function shareVideo(id){
  navigator.clipboard.writeText(location.href+"?video="+id);
}

/* FOLLOW */
document.getElementById("followBtn").onclick=async()=>{
  if(!currentUser) return alert("Login dulu!");
  document.getElementById("followBtn").innerText="✓";
};

/* ================= AI ================= */
function toggleAI(){
  let box=document.getElementById("aiBox");
  box.style.display=box.style.display==="flex"?"none":"flex";
  box.style.flexDirection="column";
}

document.getElementById("aiInput").addEventListener("keydown",e=>{
  if(e.key==="Enter"){
    let msg=e.target.value;
    let chat=document.getElementById("aiChat");

    chat.innerHTML+="👤 "+msg+"<br>";
    chat.innerHTML+="🤖 "+ai(msg)+"<br>";

    e.target.value="";
  }
});

function ai(t){
  if(t.includes("viral")) return "AI: viral = likes + share + comment";
  if(t.includes("tiktok")) return "AI: MiniTok aktif 🔥";
  return "AI siap bantu 🚀";
}

/* MENU */
function toggleMenu(){
  document.getElementById("dropdown").classList.toggle("show");
}
</script>

</body>
</html>
