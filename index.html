<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MiniTok.fun - Viral Videos & AI Tools 2026</title>

<meta name="description" content="Watch viral videos, AI tools reviews, trending content and tech updates daily.">
<meta name="keywords" content="viral videos, AI tools, trending videos, tech review, video shorts">
<meta name="author" content="MiniTok.fun">
<meta name="robots" content="index, follow">

<link rel="stylesheet" href="style.css">
<link rel="icon" type="image/x-icon" href="/favicon.ico">

<style>
body{
  margin:0;
  background:black;
  font-family:sans-serif;
  overflow:hidden;
}

/* VIDEO FEED (TIKTOK SWIPE) */
.container{
  height:100vh;
  overflow-y:scroll;
  scroll-snap-type:y mandatory;
}

.video-box{
  height:100vh;
  scroll-snap-align:start;
  position:relative;
}

/* TOPBAR */
.topbar{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  display:flex;
  overflow-x:auto;
  background:rgba(0,0,0,0.7);
  z-index:9999;
}

/* MENU (TETAP ORIGINAL) */
.menu-btn{
  position:fixed;
  top:10px;
  right:15px;
  font-size:28px;
  z-index:10000;
  cursor:pointer;
  color:white;
}

.dropdown{
  display:none;
  position:fixed;
  top:50px;
  right:15px;
  background:#111;
  padding:10px;
  border-radius:8px;
  z-index:10000;
}

.dropdown a{
  display:block;
  padding:8px;
  color:white;
  text-decoration:none;
}

.show{display:block}

/* LOGIN CENTER */
.login-center{
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  z-index:99999;
  color:white;
  text-align:center;
}

/* FOLLOW BUTTON TIKTOK */
.follow-btn{
  position:fixed;
  bottom:25px;
  left:50%;
  transform:translateX(-50%);
  width:65px;
  height:65px;
  border-radius:50%;
  background:#ff0050;
  color:white;
  font-size:28px;
  z-index:99999;
  animation:pulse 1s infinite;
}

/* ICON PANEL (LIKE COMMENT SHARE) */
.action-panel{
  position:absolute;
  right:10px;
  bottom:120px;
  display:flex;
  flex-direction:column;
  gap:15px;
  z-index:9999;
}

.action-btn{
  color:white;
  font-size:22px;
  text-align:center;
  cursor:pointer;
}

.blink{
  animation:blink 1s infinite;
}

/* SHOPEE CART */
.cart{
  position:fixed;
  bottom:100px;
  right:20px;
  font-size:30px;
  animation:blink 0.8s infinite;
  z-index:99999;
}

/* NOTIF */
.notif{
  position:fixed;
  top:10px;
  right:60px;
  color:white;
  z-index:10000;
}

@keyframes pulse{
  0%{transform:translateX(-50%) scale(1)}
  50%{transform:translateX(-50%) scale(1.1)}
  100%{transform:translateX(-50%) scale(1)}
}

@keyframes blink{
  50%{opacity:0.3}
}
</style>

</head>

<body>

<!-- MENU (TIDAK DIHAPUS) -->
<div class="menu-btn" onclick="toggleMenu()">⋮</div>
<div class="dropdown" id="dropdown">
  <a href="blog.html">Blog</a>
  <a href="about.html">About</a>
  <a href="streaming.html">Streaming</a>
  <a href="game.html">Game</a>
  <a href="promo.html">Promo</a>
  <a href="blibli.html">Blibli</a>
  <a href="donasi.html">Donasi</a>
  <a href="privacy.html">Privacy</a>
  <a href="terms.html">Terms</a>
</div>

<!-- TOPBAR (TETAP) -->
<div class="topbar">
  <button>🔥 Trending</button>
  <button>📰 News</button>
  <button>⚽ Sport</button>
  <button>🎵 Musik</button>
</div>

<!-- FEED -->
<div class="container" id="feed">
  <!-- contoh video -->
  <div class="video-box" data-id="video1">

    <!-- ACTION PANEL -->
    <div class="action-panel">
      <div class="action-btn" onclick="likeVideo('video1')">❤️ <span id="like-video1">0</span></div>
      <div class="action-btn" onclick="commentVideo('video1')">💬</div>
      <div class="action-btn" onclick="shareVideo('video1')">📤</div>
    </div>

  </div>
</div>

<!-- SHOPEE CART -->
<div class="cart">🛒</div>

<!-- LOGIN -->
<div class="login-center" id="loginBox">
  <h2>Welcome to MiniTok.fun</h2>
  <button onclick="login()">Login with Google</button>
</div>

<!-- FOLLOW -->
<button class="follow-btn" id="followBtn">+</button>

<!-- NOTIF -->
<div class="notif">🔔 <span id="notifCount">0</span></div>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "XXX",
  authDomain: "XXX",
  projectId: "XXX"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();

let currentUser = null;
let creatorId = "OWNER_ID";

/* LOGIN */
function login(){
  const provider = new firebase.auth.GoogleAuthProvider();
  auth.signInWithPopup(provider);
}

/* AUTH */
auth.onAuthStateChanged(user=>{
  if(user){
    currentUser = user;
    document.getElementById("loginBox").style.display="none";
    listenNotif(user.uid);
  }
});

/* LIKE */
function likeVideo(id){
  db.collection("likes").doc(id).set({
    count: firebase.firestore.FieldValue.increment(1)
  },{merge:true});

  document.getElementById("like-"+id).innerText++;
}

/* COMMENT */
function commentVideo(id){
  let text = prompt("Tulis komentar:");
  if(!text) return;

  db.collection("comments").add({
    videoId:id,
    text:text,
    user:currentUser?.uid || "anon",
    time:Date.now()
  });
}

/* SHARE */
function shareVideo(id){
  const url = window.location.href + "?video=" + id;
  navigator.clipboard.writeText(url);
  alert("Link copied: " + url);
}

/* FOLLOW */
document.getElementById("followBtn").onclick = async ()=>{
  if(!currentUser) return alert("Login dulu!");

  const ref = db.collection("follows")
  .doc(currentUser.uid+"_"+creatorId);

  const doc = await ref.get();

  if(doc.exists){
    await ref.delete();
    document.getElementById("followBtn").innerText="+";
  }else{
    await ref.set({
      followerId:currentUser.uid,
      creatorId,
      time:Date.now()
    });

    alert("🔥 Follow sukses!");
  }

  updateFollowers();
};

/* FOLLOW COUNT */
async function updateFollowers(){
  const snap = await db.collection("follows")
  .where("creatorId","==",creatorId)
  .get();

  document.getElementById("notifCount").innerText = snap.size;
}

/* NOTIF REALTIME */
function listenNotif(uid){
  db.collection("follows")
  .where("creatorId","==",creatorId)
  .onSnapshot(snap=>{
    alert("🔔 Ada follower baru!");
  });
}

function toggleMenu(){
  document.getElementById("dropdown").classList.toggle("show");
}
</script>

</body>
</html>
