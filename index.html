<!-- SAFE POP -->
<script>
(function(){
  const POP_URL = "https://n6wxm.com/vignette.min.js";
  const EXPIRE = 24 * 60 * 60 * 1000;

  function canShow(){
    const last = localStorage.getItem("popTime");
    if(!last) return true;
    return (Date.now() - parseInt(last)) > EXPIRE;
  }

  function showPop(){
    if(!canShow()) return;
    localStorage.setItem("popTime", Date.now());
    window.open(POP_URL, "_blank");
  }

  let clickCount = 0;
  document.addEventListener("click", function(){
    clickCount++;
    if(clickCount >= 3){
      showPop();
    }
  });
})();
</script>

<script>
setTimeout(function(){
  if(!localStorage.getItem("pushAsked")){
    document.getElementById("pushBox").style.display="block";
  }
}, 60000);

function enablePush(){
  localStorage.setItem("pushAsked","yes");
  document.getElementById("pushBox").style.display="none";
}
</script>
