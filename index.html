<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MiniTok.fun - GeminiTok AI</title>

<link rel="stylesheet" href="style.css">

<style>

/* RESET BIAR TIDAK ERROR */
body{
  margin:0;
  font-family:Arial;
  background:black;
  color:white;
  overflow-y:auto;
}

/* ===== AI BAR ===== */
.ai-bar{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:55px;
  background:#1a1a1a;
  display:flex;
  align-items:center;
  gap:8px;
  padding:6px;
  z-index:9999;
}

.menu-btn{
  font-size:26px;
  cursor:pointer;
  padding:0 10px;
  color:white;
}

.ai-bar input{
  flex:1;
  padding:8px;
  border:none;
  border-radius:6px;
}

.ai-bar button{
  background:#2b6cff;
  border:none;
  color:white;
  padding:8px 10px;
  border-radius:6px;
}

/* ===== CATEGORY BAR (FIXED) ===== */
.topbar{
  position:fixed;
  top:60px;
  left:0;
  width:100%;
  display:flex;
  overflow-x:auto;
  gap:8px;
  background:rgba(0,0,0,0.95);
  padding:8px;
  z-index:9000;
  white-space:nowrap;
}

.topbar button{
  background:#222;
  color:white;
  border:none;
  padding:6px 10px;
  border-radius:20px;
  font-size:12px;
}

/* ===== VIDEO CONTAINER (IMPORTANT FIX) ===== */
.container{
  margin-top:120px;
  padding-bottom:120px;
  height:auto;
  overflow-y:visible;
}

/* ===== DROPDOWN ===== */
.dropdown{
  position:fixed;
  top:60px;
  left:10px;
  background:#111;
  padding:10px;
  border-radius:10px;
  display:none;
  z-index:10000;
}

.dropdown a{
  display:block;
  color:white;
  margin:6px 0;
  text-decoration:none;
}

/* ===== CHAT PANEL ===== */
.chat-panel{
  position:fixed;
  right:-100%;
  top:0;
  width:320px;
  height:100%;
  background:#0f0f0f;
  z-index:99999;
  transition:0.3s;
  display:flex;
  flex-direction:column;
}

.chat-box{
  flex:1;
  overflow-y:auto;
  padding:10px;
}

.msg{
  margin:5px 0;
  padding:8px;
  border-radius:8px;
}

.user{background:#2b6cff;}
.ai{background:#222;}

.chat-input{
  display:flex;
  padding:8px;
  gap:5px;
}

.chat-input input{
  flex:1;
  padding:8px;
}

.chat-input button{
  background:#2b6cff;
  border:none;
  color:white;
}

/* ===== FIX OVERLAY SAFETY ===== */
button, .menu-btn{
  cursor:pointer;
}

</style>
</head>

<body>

<!-- AI BAR -->
<div class="ai-bar">

  <div class="menu-btn" onclick="toggleMenu()">☰</div>

  <input id="aiInput" placeholder="GeminiTok AI...">

  <button onclick="startVoice()">🎤</button>

  <button onclick="askAI()">AI</button>

  <button onclick="toggleChat()">💬</button>
<button onclick="backToVideo()" style="
width:100%;
padding:10px;
background:red;
color:white;
border:none;
">
⬅ Kembali Nonton Video
</button>
</div>

<!-- CATEGORY BAR (NOW FIXED) -->
<div class="topbar">
  <button>🔥 Trending</button>
  <button>😂 Comedy</button>
  <button>🎌 Anime</button>
  <button>📰 News</button>
  <button>⚽ Sports</button>
  <button>🛒 Products</button>
</div>

<!-- VIDEO APP.JS -->
<div class="container" id="feed"></div>

<!-- MENU -->
<div class="dropdown" id="dropdown">
  <a href="blog.html">Blog</a>
  <a href="about.html">About</a>
  <a href="streaming.html">Streaming</a>
  <a href="affiliate.html">Shopee Partner</a>
  <a href="promo.html">Promo</a>
  <a href="blibli.html">Blibli</a>
  <a href="donasi.html">Donasi</a>
  <a href="disclaimer.html">Disclaimer</a>
  <a href="privacy.html">Privacy</a>
  <a href="terms.html">Terms</a>
</div>

<!-- CHAT PANEL -->
<div class="chat-panel" id="chatPanel">

  <div class="chat-box" id="chatBox"></div>

  <div class="chat-input">
    <input id="chatInput" placeholder="Tulis pesan...">
    <button onclick="sendChat()">Send</button>
  </div>

</div>

<!-- SCRIPT -->
<script>

let API_KEY = "AIzaSyAyl3fLVXYtFfiUJZ-fglGKDoIpEjQFuV8"; // WAJIB DIISI

/* ===== MENU ===== */
function toggleMenu(){
  const d=document.getElementById("dropdown");
  d.style.display = (d.style.display==="block")?"none":"block";
}

/* ===== CHAT PANEL ===== */
function toggleChat(){
  const p=document.getElementById("chatPanel");
  p.style.right = (p.style.right==="0px")?"-100%":"0px";
}

/* ===== ADD CHAT ===== */
function addMsg(text,type){
  const box=document.getElementById("chatBox");
  const div=document.createElement("div");
  div.className="msg "+type;
  div.innerText=text;
  box.appendChild(div);
  box.scrollTop=box.scrollHeight;
}

/* ===== GEMINI CHAT ===== */
async function sendChat(){
  const input=document.getElementById("chatInput");
  const text=input.value;
  if(!text) return;

  addMsg(text,"user");
  input.value="";

  try{
    const res=await fetch(
      `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`,
      {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({contents:[{parts:[{text}]}]})
      }
    );

    const data=await res.json();

    const reply =
      data?.candidates?.[0]?.content?.parts?.[0]?.text ||
      "No response";

    addMsg(reply,"ai");

  }catch(e){
    addMsg("Error AI / API salah","ai");
  }
}

/* ===== VOICE ===== */
function startVoice(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

  if(!SR){
    alert("Voice tidak support");
    return;
  }

  const rec = new SR();
  rec.lang="id-ID";
  rec.start();

  rec.onresult = (e)=>{
    document.getElementById("aiInput").value =
    e.results[0][0].transcript;
  };
}

/* ===== SIMPLE AI BUTTON ===== */
function askAI(){
  const text=document.getElementById("aiInput").value;
  if(!text) return;
  alert("AI: "+text);
}
function toggleChat(){
  const panel=document.getElementById("chatPanel");

  if(panel.style.right==="0px"){
    panel.style.right="-100%";
    document.getElementById("videoOverlay").style.display="none";
  }else{
    panel.style.right="0px";
    document.getElementById("videoOverlay").style.display="block";
  }
}
</script>

<!-- APP.JS -->
<script src="app.js" defer></script>

</body>
</html>
