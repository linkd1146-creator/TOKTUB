<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MiniTok Creator Platform</title>

<style>
body{
  margin:0;
  font-family:Arial, Helvetica, sans-serif;
  background:#0f0f0f;
  color:white;
}

header{
  text-align:center;
  padding:20px;
  font-size:24px;
  font-weight:bold;
  border-bottom:1px solid #222;
}

nav{
  display:flex;
  justify-content:center;
  gap:10px;
  padding:15px;
  flex-wrap:wrap;
}

button{
  padding:8px 14px;
  border:none;
  border-radius:8px;
  background:#222;
  color:white;
  cursor:pointer;
}

button:hover{background:#333;}

.active{
  background:#ffcc00;
  color:black;
  font-weight:bold;
}

.section{display:none;}
.section.active{display:block;}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:20px;
  padding:20px;
}

.card{
  background:#1a1a1a;
  padding:15px;
  border-radius:12px;
  box-shadow:0 0 10px rgba(0,0,0,0.4);
}

.meta{
  font-size:12px;
  color:#aaa;
}

.file-link{
  display:block;
  margin-top:10px;
  color:#ffcc00;
  font-weight:bold;
}

.premium{
  color:#ff4444;
  font-weight:bold;
}

.free{
  color:#00ff99;
  font-weight:bold;
}

.form-section{
  border-top:1px solid #222;
  padding:20px;
  max-width:800px;
  margin:auto;
}

input, textarea, select{
  width:100%;
  padding:10px;
  margin:10px 0;
  border-radius:8px;
  border:none;
  background:#1a1a1a;
  color:white;
}

textarea{min-height:100px;}

.post-btn{
  background:#ffcc00;
  color:black;
  font-weight:bold;
}

.viewer{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:#000;
  display:none;
  flex-direction:column;
}

.viewer iframe{
  flex:1;
  border:none;
}

.close-btn{
  background:red;
  padding:10px;
}
</style>
</head>
<body>

<header>
🚀 MiniTok Creator Platform
</header>

<nav>
  <button onclick="showSection('artikel')" class="active" id="btnArtikel">Artikel</button>
  <button onclick="showSection('komik')" id="btnKomik">Komik</button>
  <button onclick="showSection('ebook')" id="btnEbook">E-Book</button>
</nav>

<!-- ================= VIEWER ================= -->
<div class="viewer" id="viewer">
  <button class="close-btn" onclick="closeViewer()">Tutup</button>
  <iframe id="fileFrame"></iframe>
</div>

<!-- ================= SECTION TEMPLATE ================= -->
<div id="artikel" class="section active">
  <div class="grid" id="artikelContainer"></div>
  <div class="form-section">
    <h2>Upload Artikel</h2>
    <input type="text" id="artikelTitle" placeholder="Judul Artikel">
    <textarea id="artikelDesc" placeholder="Deskripsi"></textarea>
    <select id="artikelAccess">
      <option value="free">Free</option>
      <option value="premium">Premium</option>
    </select>
    <input type="file" id="artikelFile" accept=".pdf,.doc,.docx">
    <button class="post-btn" onclick="addContent('artikel')">Publish</button>
  </div>
</div>

<div id="komik" class="section">
  <div class="grid" id="komikContainer"></div>
  <div class="form-section">
    <h2>Upload Komik</h2>
    <input type="text" id="komikTitle" placeholder="Judul Komik">
    <textarea id="komikDesc" placeholder="Deskripsi"></textarea>
    <select id="komikAccess">
      <option value="free">Free</option>
      <option value="premium">Premium</option>
    </select>
    <input type="file" id="komikFile" accept=".pdf,.doc,.docx">
    <button class="post-btn" onclick="addContent('komik')">Publish</button>
  </div>
</div>

<div id="ebook" class="section">
  <div class="grid" id="ebookContainer"></div>
  <div class="form-section">
    <h2>Upload E-Book</h2>
    <input type="text" id="ebookTitle" placeholder="Judul E-Book">
    <textarea id="ebookDesc" placeholder="Deskripsi"></textarea>
    <select id="ebookAccess">
      <option value="free">Free</option>
      <option value="premium">Premium</option>
    </select>
    <input type="file" id="ebookFile" accept=".pdf,.doc,.docx">
    <button class="post-btn" onclick="addContent('ebook')">Publish</button>
  </div>
</div>

<script>

let database = JSON.parse(localStorage.getItem("creatorDB")) || {
  artikel:[],
  komik:[],
  ebook:[]
};

let uploadedFiles = {};

function showSection(sec){
  document.querySelectorAll(".section").forEach(s=>s.classList.remove("active"));
  document.querySelectorAll("nav button").forEach(b=>b.classList.remove("active"));
  document.getElementById(sec).classList.add("active");
  document.getElementById("btn"+capitalize(sec)).classList.add("active");
}

function capitalize(str){
  return str.charAt(0).toUpperCase()+str.slice(1);
}

["artikel","komik","ebook"].forEach(type=>{
  document.getElementById(type+"File").addEventListener("change", function(e){
    const file = e.target.files[0];
    const reader = new FileReader();
    reader.onload = ()=> uploadedFiles[type] = reader.result;
    if(file) reader.readAsDataURL(file);
  });
});

function addContent(type){
  const title = document.getElementById(type+"Title").value;
  const desc = document.getElementById(type+"Desc").value;
  const access = document.getElementById(type+"Access").value;
  const file = uploadedFiles[type];

  if(title===""){alert("Judul wajib diisi"); return;}

  database[type].unshift({title, desc, access, file});
  localStorage.setItem("creatorDB", JSON.stringify(database));

  displayAll();
}

function displayAll(){
  ["artikel","komik","ebook"].forEach(type=>{
    const container = document.getElementById(type+"Container");
    container.innerHTML="";
    database[type].forEach(item=>{
      container.innerHTML += `
        <div class="card">
          <h3>${item.title}</h3>
          <p>${item.desc}</p>
          <div class="meta ${item.access}">
            ${item.access==="free"?"🟢 FREE":"🔒 PREMIUM"}
          </div>
          <button onclick="openContent('${type}','${item.title}')">Buka</button>
        </div>
      `;
    });
  });
}

function openContent(type,title){
  const item = database[type].find(i=>i.title===title);

  if(item.access==="premium"){
    const pass = prompt("Konten Premium. Masukkan kode akses:");
    if(pass!=="12345"){
      alert("Akses ditolak!");
      return;
    }
  }

  document.getElementById("fileFrame").src = item.file;
  document.getElementById("viewer").style.display="flex";
}

function closeViewer(){
  document.getElementById("viewer").style.display="none";
  document.getElementById("fileFrame").src="";
}

displayAll();

</script>

</body>
</html>
