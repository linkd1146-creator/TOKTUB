<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MiniTok Creator PRO</title>

<style>
body{
margin:0;
font-family: 'Segoe UI', sans-serif;
background:#0f0f0f;
color:white;
}

header{
background:#141414;
padding:15px 30px;
display:flex;
justify-content:space-between;
align-items:center;
border-bottom:1px solid #222;
}

.logo{
font-size:20px;
font-weight:bold;
color:#00f2ff;
}

nav button{
background:none;
border:none;
color:white;
margin:0 10px;
cursor:pointer;
font-weight:600;
}

nav button:hover{
color:#00f2ff;
}

.container{
padding:30px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
gap:20px;
}

.card{
background:#1c1c1c;
border-radius:12px;
padding:15px;
border:1px solid #222;
transition:0.3s;
}

.card:hover{
transform:scale(1.05);
border-color:#00f2ff;
}

button{
padding:8px 12px;
border:none;
border-radius:6px;
cursor:pointer;
font-weight:bold;
}

.btn-primary{
background:#00f2ff;
color:black;
}

.btn-gold{
background:gold;
color:black;
}

input, select{
width:100%;
padding:10px;
margin:5px 0;
background:#111;
border:1px solid #333;
color:white;
border-radius:6px;
}

.viewer{
margin-top:20px;
height:500px;
border:1px solid #333;
border-radius:10px;
overflow:hidden;
}

iframe{
width:100%;
height:100%;
border:none;
}

.hidden{
display:none;
}

.premium-badge{
color:gold;
font-weight:bold;
}
</style>
</head>

<body>

<header>
<div class="logo">MiniTok Creator PRO</div>
<nav>
<button onclick="showPage('artikel')">Artikel</button>
<button onclick="showPage('komik')">Komik</button>
<button onclick="showPage('ebook')">E-Book</button>
<button onclick="showPage('upload')">Upload</button>
<button onclick="activatePremium()">Upgrade Premium</button>
</nav>
</header>

<div class="container">

<!-- LOGIN -->
<div id="loginPage">
<h2>Login User</h2>
<input type="text" id="username" placeholder="Masukkan Nama">
<button class="btn-primary" onclick="login()">Login</button>
</div>

<!-- UPLOAD -->
<div id="uploadPage" class="hidden">
<h2>Upload Konten</h2>
<input type="text" id="judul" placeholder="Judul">
<select id="kategori">
<option value="artikel">Artikel</option>
<option value="komik">Komik</option>
<option value="ebook">E-Book</option>
</select>
<select id="akses">
<option value="free">Free</option>
<option value="premium">Premium</option>
</select>
<input type="file" id="fileUpload" accept=".pdf,.doc,.docx">
<button class="btn-primary" onclick="uploadContent()">Upload</button>
</div>

<!-- KONTEN -->
<div id="artikelPage" class="hidden">
<h2>Artikel</h2>
<div id="artikelList" class="grid"></div>
</div>

<div id="komikPage" class="hidden">
<h2>Komik</h2>
<div id="komikList" class="grid"></div>
</div>

<div id="ebookPage" class="hidden">
<h2>E-Book</h2>
<div id="ebookList" class="grid"></div>
</div>

<div id="viewerContainer" class="hidden">
<h2 id="viewerTitle"></h2>
<div class="viewer">
<iframe id="viewerFrame"></iframe>
</div>
<button id="downloadBtn" class="btn-primary hidden">Download File</button>
</div>

</div>

<script>

let database=[];
let currentUser=null;
let isPremium=false;

function login(){
let name=document.getElementById("username").value;
if(!name){
alert("Masukkan nama dulu!");
return;
}
currentUser=name;
document.getElementById("loginPage").style.display="none";
showPage("artikel");
}

function showPage(page){
["upload","artikel","komik","ebook"].forEach(p=>{
document.getElementById(p+"Page").classList.add("hidden");
});
document.getElementById(page+"Page").classList.remove("hidden");
document.getElementById("viewerContainer").classList.add("hidden");
}

function activatePremium(){
alert("Untuk akses Premium silakan donasi seikhlasnya 🙏");
window.location.href="https://minitok.fun/donasi.html";
}

function uploadContent(){
let judul=document.getElementById("judul").value;
let kategori=document.getElementById("kategori").value;
let akses=document.getElementById("akses").value;
let file=document.getElementById("fileUpload").files[0];

if(!judul || !file){
alert("Isi semua data!");
return;
}

let fileURL=URL.createObjectURL(file);

database.push({judul,kategori,akses,fileURL,file});

renderContent();
alert("Upload berhasil!");
}

function renderContent(){
document.getElementById("artikelList").innerHTML="";
document.getElementById("komikList").innerHTML="";
document.getElementById("ebookList").innerHTML="";

database.forEach((item,index)=>{
let card=document.createElement("div");
card.className="card";
card.innerHTML=`
<h3>${item.judul}</h3>
<p>${item.akses=="premium"?"<span class='premium-badge'>Premium</span>":"Free"}</p>
<button class="btn-primary" onclick="openContent(${index})">Buka</button>
`;
document.getElementById(item.kategori+"List").appendChild(card);
});
}

function openContent(index){
let item=database[index];

if(item.akses=="premium" && !isPremium){
window.location.href="https://minitok.fun/donasi.html";
return;
}

document.getElementById("viewerContainer").classList.remove("hidden");
document.getElementById("viewerTitle").innerText=item.judul;
document.getElementById("viewerFrame").src=item.fileURL;

let downloadBtn=document.getElementById("downloadBtn");
downloadBtn.classList.remove("hidden");
downloadBtn.onclick=function(){
let a=document.createElement("a");
a.href=item.fileURL;
a.download=item.judul;
a.click();
};

window.scrollTo(0,document.body.scrollHeight);
}

</script>

</body>
</html>
