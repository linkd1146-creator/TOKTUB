<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MiniTok Creator Blog</title>

<style>
body{
margin:0;
font-family:'Segoe UI',sans-serif;
background:#0f0f0f;
color:white;
}

header{
background:linear-gradient(90deg,#ff0050,#ff7a00);
padding:18px;
text-align:center;
font-size:22px;
font-weight:bold;
}

nav{
display:flex;
justify-content:center;
gap:10px;
background:#141414;
padding:10px;
flex-wrap:wrap;
}

nav button{
background:#1c1c1c;
border:none;
color:white;
padding:8px 15px;
border-radius:20px;
cursor:pointer;
}

nav button:hover{
background:#ff0050;
}

.section{
display:none;
padding:20px;
max-width:900px;
margin:auto;
}

.card{
background:#1c1c1c;
padding:15px;
margin-bottom:15px;
border-radius:12px;
}

.card button{
margin:5px 5px 0 0;
padding:6px 12px;
border:none;
border-radius:8px;
cursor:pointer;
background:#ff0050;
color:white;
}

input,textarea,select{
width:100%;
padding:10px;
margin-bottom:10px;
border-radius:8px;
border:none;
background:#111;
color:white;
}

.viewer{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:black;
overflow:auto;
padding:20px;
z-index:999;
}

.viewer iframe{
width:100%;
height:90vh;
border:none;
background:white;
}

.webtoon img{
width:100%;
margin-bottom:10px;
border-radius:10px;
}

.closeBtn{
position:absolute;
top:15px;
right:25px;
font-size:26px;
cursor:pointer;
}
</style>
</head>

<body>

<header>MiniTok Creator Blog</header>

<nav>
<button onclick="showSection('artikel')">Artikel</button>
<button onclick="showSection('komik')">Komik</button>
<button onclick="showSection('ebook')">E-Book</button>
<button onclick="showSection('creator')">Creator</button>
</nav>

<div id="artikel" class="section"></div>
<div id="komik" class="section"></div>
<div id="ebook" class="section"></div>

<div id="creator" class="section">

<h3>Upload Konten</h3>

<select id="type">
<option value="artikel">Artikel</option>
<option value="komik">Komik</option>
<option value="ebook">E-Book</option>
</select>

<input type="text" id="title" placeholder="Judul">

<textarea id="articleText" placeholder="Tulis isi artikel di sini..."></textarea>

<input type="file" id="fileInput" multiple>

<button onclick="upload()">Publish</button>

<hr>
<h3>Konten Saya</h3>
<div id="list"></div>

</div>

<div id="viewer" class="viewer">
<span class="closeBtn" onclick="closeViewer()">✖</span>
<div id="viewerContent"></div>
</div>

<script>

let data = JSON.parse(localStorage.getItem("blogData")) || {
artikel:[],
komik:[],
ebook:[]
};

function showSection(type){
document.querySelectorAll(".section").forEach(s=>s.style.display="none");
document.getElementById(type).style.display="block";
if(type!=="creator") render(type);
if(type==="creator") renderCreator();
}

function upload(){
let type=document.getElementById("type").value;
let title=document.getElementById("title").value;
let articleText=document.getElementById("articleText").value;
let files=document.getElementById("fileInput").files;

if(!title){
alert("Judul wajib diisi!");
return;
}

if(type==="artikel"){
if(!articleText){
alert("Isi artikel wajib diisi!");
return;
}
data.artikel.push({title,content:articleText});
save();
return;
}

if(type==="komik"){
if(files.length===0){
alert("Upload gambar komik!");
return;
}
let images=[];
let loaded=0;
for(let file of files){
let reader=new FileReader();
reader.onload=function(e){
images.push(e.target.result);
loaded++;
if(loaded===files.length){
data.komik.push({title,images});
save();
}
}
reader.readAsDataURL(file);
}
return;
}

if(type==="ebook"){
if(files.length===0){
alert("Upload file PDF atau Word!");
return;
}
let file=files[0];
let reader=new FileReader();
reader.onload=function(e){
data.ebook.push({
title,
file:e.target.result,
fileType:file.type
});
save();
}
reader.readAsDataURL(file);
}
}

function render(type){
let container=document.getElementById(type);
container.innerHTML="";
data[type].forEach((item,index)=>{
container.innerHTML+=`
<div class="card">
<h3>${item.title}</h3>
<button onclick="openContent('${type}',${index})">Baca</button>
<button onclick="hapus('${type}',${index})">Hapus</button>
</div>
`;
});
}

function openContent(type,index){
let item=data[type][index];
let viewer=document.getElementById("viewer");
let content=document.getElementById("viewerContent");

if(type==="artikel"){
content.innerHTML=`<div style="max-width:800px;margin:auto;">
<h2>${item.title}</h2>
<p style="white-space:pre-line;">${item.content}</p>
</div>`;
}

if(type==="komik"){
content.innerHTML="<div class='webtoon'>"+
item.images.map(img=>`<img src="${img}">`).join("")+
"</div>";
}

if(type==="ebook"){
if(item.fileType.includes("pdf")){
content.innerHTML=`<iframe src="${item.file}"></iframe>`;
}else{
content.innerHTML=`
<div style="text-align:center;margin-top:100px;">
<h2>${item.title}</h2>
<p>File Word tidak bisa dibaca langsung di browser.</p>
<button onclick="downloadFile(${index})" style="padding:10px 20px;background:#ff0050;border:none;border-radius:10px;color:white;">
Download File
</button>
</div>`;
}
}

viewer.style.display="block";
}

function downloadFile(index){
let item=data.ebook[index];
let a=document.createElement("a");
a.href=item.file;
a.download=item.title;
a.click();
}

function hapus(type,index){
if(confirm("Yakin hapus?")){
data[type].splice(index,1);
save();
}
}

function renderCreator(){
let html="";
Object.keys(data).forEach(type=>{
data[type].forEach((item,index)=>{
html+=`
<div class="card">
<b>${item.title}</b>
<button onclick="hapus('${type}',${index})">Hapus</button>
</div>
`;
});
});
document.getElementById("list").innerHTML=html;
}

function save(){
localStorage.setItem("blogData",JSON.stringify(data));
alert("Berhasil Publish!");
location.reload();
}

function closeViewer(){
document.getElementById("viewer").style.display="none";
}

showSection("artikel");

</script>

</body>
</html>
