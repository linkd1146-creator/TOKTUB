<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MiniTok Creator PRO</title>

<style>
body{
margin:0;
font-family: 'Segoe UI', sans-serif;
background:#0f0f0f;
color:white;
}

header{
background:#141414;
padding:15px 30px;
display:flex;
justify-content:space-between;
align-items:center;
border-bottom:1px solid #222;
}

.logo{
font-size:20px;
font-weight:bold;
color:#00f2ff;
}

nav button{
background:none;
border:none;
color:white;
margin:0 10px;
cursor:pointer;
font-weight:600;
cursor:pointer;
}

nav button:hover{color:#00f2ff;}

.container{padding:30px;}

.grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
gap:20px;
}

.card{
background:#1c1c1c;
border-radius:12px;
padding:15px;
border:1px solid #222;
transition:0.3s;
}

.card:hover{
transform:scale(1.03);
border-color:#00f2ff;
}

button{
padding:8px 12px;
border:none;
border-radius:6px;
cursor:pointer;
font-weight:bold;
}

.btn-primary{background:#00f2ff;color:black;}
.btn-gold{background:gold;color:black;}

input, select, textarea{
width:100%;
padding:10px;
margin:5px 0;
background:#111;
border:1px solid #333;
color:white;
border-radius:6px;
}

.viewer{
margin-top:20px;
max-height:600px;
overflow:auto;
border:1px solid #333;
border-radius:10px;
padding:15px;
background:black;
}

.viewer img{
width:100%;
margin-bottom:10px;
}

.hidden{display:none;}
.premium-badge{color:gold;font-weight:bold;}
</style>
</head>

<body>

<header>
<div class="logo">MiniTok Creator PRO</div>
<nav>
<button onclick="showPage('artikel')">Artikel</button>
<button onclick="showPage('komik')">Komik</button>
<button onclick="showPage('ebook')">E-Book</button>
<button onclick="showPage('upload')">Upload</button>
<button onclick="goPremium()">Premium</button>
</nav>
</header>

<div class="container">

<!-- LOGIN -->
<div id="loginPage">
<h2>Login User</h2>
<input type="text" id="username" placeholder="Masukkan Nama">
<button class="btn-primary" onclick="login()">Login</button>
</div>

<!-- UPLOAD -->
<div id="uploadPage" class="hidden">
<h2>Upload Konten</h2>

<input type="text" id="judul" placeholder="Judul">

<select id="kategori" onchange="toggleUpload()">
<option value="artikel">Artikel</option>
<option value="komik">Komik</option>
<option value="ebook">E-Book</option>
</select>

<select id="akses">
<option value="free">Free</option>
<option value="premium">Premium</option>
</select>

<div id="artikelInput">
<textarea id="artikelText" placeholder="Tulis artikel di sini..."></textarea>
</div>

<div id="komikInput" class="hidden">
<input type="file" id="komikImages" accept="image/*" multiple>
</div>

<div id="ebookInput" class="hidden">
<input type="file" id="ebookFile" accept=".pdf,.doc,.docx">
</div>

<button class="btn-primary" onclick="uploadContent()">Publish</button>
</div>

<!-- LIST PAGE -->
<div id="artikelPage" class="hidden">
<h2>Artikel</h2>
<div id="artikelList" class="grid"></div>
</div>

<div id="komikPage" class="hidden">
<h2>Komik</h2>
<div id="komikList" class="grid"></div>
</div>

<div id="ebookPage" class="hidden">
<h2>E-Book</h2>
<div id="ebookList" class="grid"></div>
</div>

<!-- VIEWER -->
<div id="viewerContainer" class="hidden">
<h2 id="viewerTitle"></h2>
<div class="viewer" id="viewerContent"></div>
</div>

</div>

<script>

let database = JSON.parse(localStorage.getItem("miniTokDB")) || [];
let currentUser = null;

function saveDB(){
localStorage.setItem("miniTokDB", JSON.stringify(database));
}

function login(){
let name=document.getElementById("username").value;
if(!name){alert("Masukkan nama!");return;}
currentUser=name;
document.getElementById("loginPage").style.display="none";
showPage("artikel");
}

function showPage(page){
["upload","artikel","komik","ebook"].forEach(p=>{
document.getElementById(p+"Page").classList.add("hidden");
});
document.getElementById(page+"Page").classList.remove("hidden");
document.getElementById("viewerContainer").classList.add("hidden");
renderContent();
}

function goPremium(){
window.location.href="https://minitok.fun/donasi.html";
}

function toggleUpload(){
let kategori=document.getElementById("kategori").value;
document.getElementById("artikelInput").classList.add("hidden");
document.getElementById("komikInput").classList.add("hidden");
document.getElementById("ebookInput").classList.add("hidden");

if(kategori=="artikel")
document.getElementById("artikelInput").classList.remove("hidden");
if(kategori=="komik")
document.getElementById("komikInput").classList.remove("hidden");
if(kategori=="ebook")
document.getElementById("ebookInput").classList.remove("hidden");
}

function uploadContent(){
let judul=document.getElementById("judul").value;
let kategori=document.getElementById("kategori").value;
let akses=document.getElementById("akses").value;

if(!judul){alert("Judul wajib!");return;}

if(kategori=="artikel"){
let text=document.getElementById("artikelText").value;
database.unshift({judul,kategori,akses,text});
}

if(kategori=="komik"){
let files=document.getElementById("komikImages").files;
let images=[];
for(let file of files){
let reader=new FileReader();
reader.onload=function(){
images.push(reader.result);
if(images.length===files.length){
database.unshift({judul,kategori,akses,images});
saveDB();
renderContent();
}
}
reader.readAsDataURL(file);
}
return;
}

if(kategori=="ebook"){
let file=document.getElementById("ebookFile").files[0];
let reader=new FileReader();
reader.onload=function(){
database.unshift({judul,kategori,akses,file:reader.result});
saveDB();
renderContent();
}
reader.readAsDataURL(file);
return;
}

saveDB();
renderContent();
alert("Berhasil publish!");
}

function renderContent(){
["artikel","komik","ebook"].forEach(type=>{
let list=document.getElementById(type+"List");
list.innerHTML="";
database.filter(x=>x.kategori==type).forEach((item,index)=>{
let card=document.createElement("div");
card.className="card";
card.innerHTML=`
<h3>${item.judul}</h3>
<p>${item.akses=="premium"?"<span class='premium-badge'>Premium</span>":"Free"}</p>
<button class="btn-primary" onclick="openContent(${database.indexOf(item)})">Baca</button>
`;
list.appendChild(card);
});
});
}

function openContent(index){
let item=database[index];

if(item.akses=="premium"){
window.location.href="https://minitok.fun/donasi.html";
return;
}

let viewer=document.getElementById("viewerContent");
viewer.innerHTML="";
document.getElementById("viewerContainer").classList.remove("hidden");
document.getElementById("viewerTitle").innerText=item.judul;

if(item.kategori=="artikel"){
viewer.innerHTML=`<p>${item.text.replace(/\n/g,"<br>")}</p>`;
}

if(item.kategori=="komik"){
item.images.forEach(img=>{
viewer.innerHTML+=`<img src="${img}">`;
});
}

if(item.kategori=="ebook"){
if(item.file.startsWith("data:application/pdf")){
viewer.innerHTML=`<iframe src="${item.file}" style="width:100%;height:600px;border:none;"></iframe>`;
}else{
viewer.innerHTML=`<p>File Word tidak bisa ditampilkan langsung.<br>
<a href="${item.file}" download style="color:#00f2ff;">Download untuk membaca</a></p>`;
}
}
}

renderContent();

</script>
</body>
</html>
