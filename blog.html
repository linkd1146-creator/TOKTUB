<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MiniTok Creator Premium</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:'Poppins',sans-serif;
  background:#111;
  color:white;
}

header{
  padding:20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:#000;
}

.logo{
  font-weight:700;
  font-size:22px;
  color:#ffcc00;
}

nav button{
  margin-left:10px;
}

button{
  padding:8px 14px;
  border:none;
  border-radius:20px;
  background:#ffcc00;
  font-weight:bold;
  cursor:pointer;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(200px,1fr));
  gap:20px;
  padding:20px;
}

.card{
  background:#1c1c1c;
  border-radius:15px;
  padding:15px;
  transition:0.3s;
}

.card:hover{
  transform:scale(1.05);
}

.badge{
  font-size:12px;
  padding:4px 8px;
  border-radius:20px;
  display:inline-block;
}

.free{background:#00c853;}
.premium{background:#d50000;}

.viewer{
  position:fixed;
  inset:0;
  background:#000;
  display:none;
  flex-direction:column;
}

.viewer iframe{
  flex:1;
  border:none;
}
</style>
</head>
<body>

<header>
  <div class="logo">MiniTok Creator</div>
  <div>
    <span id="userEmail"></span>
    <button onclick="logout()">Logout</button>
  </div>
</header>

<div class="grid" id="contentGrid"></div>

<!-- VIEWER -->
<div class="viewer" id="viewer">
  <button onclick="closeViewer()">Tutup</button>
  <iframe id="fileFrame"></iframe>
</div>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>

<script>

// 🔥 GANTI DENGAN CONFIG FIREBASE KAMU
const firebaseConfig = {
    apiKey: "AIzaSyBFfH4ix22IIjYczrXi4EeuAzH7eykWH1A",
    authDomain: "toktube-70b00.firebaseapp.com",
    projectId: "toktube-70b00",
    storageBucket: "toktube-70b00.firebasestorage.app",
    messagingSenderId: "668818456806",
    appId: "1:668818456806:web:6452e3e606819ff72abb27",
    measurementId: "G-MN85RFYLNV"
  };


firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();
const storage = firebase.storage();

auth.onAuthStateChanged(user=>{
  if(!user){
    window.location.href="login.html";
  }else{
    document.getElementById("userEmail").innerText=user.email;
    loadContent();
  }
});

function logout(){
  auth.signOut();
}

async function loadContent(){
  const snap = await db.collection("contents").get();
  const grid = document.getElementById("contentGrid");
  grid.innerHTML="";

  snap.forEach(doc=>{
    const data = doc.data();
    grid.innerHTML += `
      <div class="card">
        <h3>${data.title}</h3>
        <span class="badge ${data.access}">
          ${data.access==="free"?"FREE":"PREMIUM"}
        </span>
        <p>${data.desc}</p>
        <button onclick="openContent('${data.fileURL}','${data.access}')">Buka</button>
      </div>
    `;
  });
}

function openContent(url,access){
  if(access==="premium"){
    window.location.href="https://minitok.fun/donasi.html";
    return;
  }

  document.getElementById("viewer").style.display="flex";
  document.getElementById("fileFrame").src=url;
}

function closeViewer(){
  document.getElementById("viewer").style.display="none";
}

</script>
</body>
</html>
