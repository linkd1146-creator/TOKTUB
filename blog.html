<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MiniTok Creator Blog</title>

<style>
body{
margin:0;
font-family:Arial, sans-serif;
background:#0f0f0f;
color:white;
}

header{
background:linear-gradient(90deg,#ff004f,#ff7a00);
padding:15px;
text-align:center;
font-size:20px;
font-weight:bold;
}

nav{
display:flex;
justify-content:center;
gap:15px;
background:#111;
padding:10px;
flex-wrap:wrap;
}

nav button{
background:#1c1c1c;
border:none;
color:white;
padding:8px 14px;
border-radius:20px;
cursor:pointer;
}

nav button:hover{
background:#ff004f;
}

.section{
display:none;
padding:20px;
max-width:900px;
margin:auto;
}

.card{
background:#1c1c1c;
padding:15px;
margin-bottom:15px;
border-radius:15px;
box-shadow:0 0 10px rgba(0,0,0,0.5);
}

.card button{
margin:5px 5px 0 0;
padding:7px 12px;
border:none;
border-radius:8px;
cursor:pointer;
background:#ff004f;
color:white;
}

.viewer{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:black;
overflow:auto;
padding:20px;
z-index:999;
}

.viewer iframe{
width:100%;
height:80vh;
border:none;
background:white;
}

.closeBtn{
position:absolute;
top:10px;
right:20px;
font-size:22px;
cursor:pointer;
}

.webtoon img{
width:100%;
margin-bottom:10px;
border-radius:10px;
}

input, textarea, select{
width:100%;
padding:10px;
margin-bottom:10px;
border-radius:8px;
border:none;
}

.uploadBox{
background:#1c1c1c;
padding:15px;
border-radius:15px;
margin-bottom:20px;
}
</style>
</head>

<body>

<header>MiniTok Creator Blog</header>

<nav>
<button onclick="showSection('artikel')">Artikel</button>
<button onclick="showSection('komik')">Komik</button>
<button onclick="showSection('ebook')">E-Book</button>
<button onclick="showSection('creator')">Creator</button>
</nav>

<div id="artikel" class="section"></div>
<div id="komik" class="section"></div>
<div id="ebook" class="section"></div>

<div id="creator" class="section">

<div class="uploadBox">
<h3>Upload Konten</h3>

<select id="type">
<option value="artikel">Artikel</option>
<option value="komik">Komik</option>
<option value="ebook">E-Book</option>
</select>

<input type="text" id="title" placeholder="Judul">
<textarea id="desc" placeholder="Deskripsi"></textarea>
<input type="file" id="fileInput" multiple>

<button onclick="upload()">Publish</button>
</div>

<h3>Konten Saya</h3>
<div id="list"></div>

</div>

<div id="viewer" class="viewer">
<span class="closeBtn" onclick="closeViewer()">✖</span>
<div id="viewerContent"></div>
</div>

<script>
let data = JSON.parse(localStorage.getItem("blogData")) || {
artikel:[],
komik:[],
ebook:[]
};

function showSection(type){
document.querySelectorAll(".section").forEach(s=>s.style.display="none");
document.getElementById(type).style.display="block";
if(type!=="creator") render(type);
if(type==="creator") renderCreator();
}

function render(type){
let container = document.getElementById(type);
container.innerHTML="";
data[type].forEach((item,index)=>{
container.innerHTML+=`
<div class="card">
<h3>${item.title}</h3>
<p>${item.desc}</p>

<button onclick="openContent('${type}',${index})">Buka</button>

<button onclick="shareContent('${item.title}')">Share</button>

${type==="ebook" ? 
`<button onclick="window.location.href='https://minitok.fun/donasi.html'">
Download Premium
</button>` : ""}
</div>
`;
});
}

function openContent(type,index){
let item = data[type][index];
let viewer = document.getElementById("viewer");
let content = document.getElementById("viewerContent");

if(type==="komik"){
content.innerHTML="<div class='webtoon'>"+
item.images.map(img=>`<img src="${img}">`).join("")+
"</div>";
}else{
content.innerHTML=`<iframe src="${item.file}"></iframe>`;
}

viewer.style.display="block";
}

function closeViewer(){
document.getElementById("viewer").style.display="none";
}

function shareContent(title){
let url = encodeURIComponent(window.location.href);
let text = encodeURIComponent("Baca di MiniTok: "+title);
window.open(`https://wa.me/?text=${text}%20${url}`,'_blank');
}

function upload(){
let type = document.getElementById("type").value;
let title = document.getElementById("title").value;
let desc = document.getElementById("desc").value;
let files = document.getElementById("fileInput").files;

if(!title || files.length===0){
alert("Judul dan file wajib diisi");
return;
}

if(type==="komik"){
let images=[];
for(let file of files){
let reader=new FileReader();
reader.onload=function(e){
images.push(e.target.result);
if(images.length===files.length){
data[type].push({title,desc,images});
save();
}
}
reader.readAsDataURL(file);
}
}else{
let file = files[0];
let reader=new FileReader();
reader.onload=function(e){
data[type].push({
title,
desc,
file:e.target.result,
fileType:file.type
});
save();
}
reader.readAsDataURL(file);
}
}

function save(){
localStorage.setItem("blogData",JSON.stringify(data));
alert("Berhasil Publish!");
location.reload();
}

function renderCreator(){
let html="";
Object.keys(data).forEach(type=>{
data[type].forEach((item,index)=>{
html+=`
<div class="card">
<b>${item.title}</b>
<br>
<button onclick="edit('${type}',${index})">Edit</button>
<button onclick="hapus('${type}',${index})">Hapus</button>
</div>
`;
});
});
document.getElementById("list").innerHTML=html;
}

function hapus(type,index){
data[type].splice(index,1);
save();
}

function edit(type,index){
let item=data[type][index];
document.getElementById("type").value=type;
document.getElementById("title").value=item.title;
document.getElementById("desc").value=item.desc;
data[type].splice(index,1);
save();
}

showSection("artikel");
</script>

</body>
</html>
