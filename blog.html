<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MiniTok Creator PRO</title>

<style>
body{
margin:0;
font-family:'Segoe UI',sans-serif;
background:#0f0f0f;
color:white;
}

header{
background:linear-gradient(90deg,#ff0050,#ff7a00);
padding:18px;
text-align:center;
font-size:22px;
font-weight:bold;
}

nav{
display:flex;
justify-content:center;
gap:10px;
background:#141414;
padding:10px;
flex-wrap:wrap;
}

nav button{
background:#1c1c1c;
border:none;
color:white;
padding:8px 15px;
border-radius:20px;
cursor:pointer;
}

nav button:hover{
background:#ff0050;
}

.section{
display:none;
padding:25px;
max-width:1000px;
margin:auto;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
gap:20px;
}

.card{
background:#1c1c1c;
padding:15px;
border-radius:12px;
border:1px solid #222;
}

.card h3{margin-top:0}

button{
padding:6px 12px;
border:none;
border-radius:8px;
cursor:pointer;
margin:5px 3px;
}

.btn-primary{background:#ff0050;color:white;}
.btn-edit{background:#00c853;color:white;}
.btn-delete{background:#d50000;color:white;}
.btn-share{background:#00acee;color:white;}

textarea,input,select{
width:100%;
padding:10px;
margin:8px 0;
border-radius:8px;
border:none;
background:#111;
color:white;
}

.viewer{
position:fixed;
inset:0;
background:black;
overflow:auto;
padding:20px;
display:none;
z-index:999;
}

.viewer iframe{
width:100%;
height:90vh;
border:none;
background:white;
}

.webtoon img{
width:100%;
margin-bottom:10px;
border-radius:12px;
}

.closeBtn{
position:absolute;
top:15px;
right:25px;
font-size:26px;
cursor:pointer;
}
</style>
</head>

<body>

<header>MiniTok Creator PRO</header>

<nav>
<button onclick="show('artikel')">Artikel</button>
<button onclick="show('komik')">Komik</button>
<button onclick="show('ebook')">E-Book</button>
<button onclick="show('upload')">Upload</button>
</nav>

<div id="artikel" class="section"></div>
<div id="komik" class="section"></div>
<div id="ebook" class="section"></div>

<div id="upload" class="section">

<h3>Upload Konten</h3>

<select id="type">
<option value="artikel">Artikel</option>
<option value="komik">Komik</option>
<option value="ebook">E-Book</option>
</select>

<select id="access">
<option value="free">Free</option>
<option value="premium">Premium</option>
</select>

<input type="text" id="title" placeholder="Judul">

<textarea id="articleText" placeholder="Isi artikel (khusus artikel)"></textarea>

<input type="file" id="fileInput" multiple>

<button class="btn-primary" onclick="upload()">Publish</button>

</div>

<div id="viewer" class="viewer">
<span class="closeBtn" onclick="closeViewer()">✖</span>
<div id="viewerContent"></div>
</div>

<script>

let db = JSON.parse(localStorage.getItem("minitokDB")) || {
artikel:[],
komik:[],
ebook:[]
};

function save(){
localStorage.setItem("minitokDB",JSON.stringify(db));
}

function show(type){
document.querySelectorAll(".section").forEach(s=>s.style.display="none");
document.getElementById(type).style.display="block";
if(type!=="upload") render(type);
}

function upload(){
let type=document.getElementById("type").value;
let title=document.getElementById("title").value;
let access=document.getElementById("access").value;
let articleText=document.getElementById("articleText").value;
let files=document.getElementById("fileInput").files;

if(!title){alert("Judul wajib diisi");return;}

if(type==="artikel"){
if(!articleText){alert("Isi artikel wajib");return;}
db.artikel.push({title,content:articleText,access});
save();
alert("Artikel publish!");
}

if(type==="komik"){
if(files.length===0){alert("Upload gambar komik!");return;}
let images=[];
let loaded=0;
for(let file of files){
let reader=new FileReader();
reader.onload=e=>{
images.push(e.target.result);
loaded++;
if(loaded===files.length){
db.komik.push({title,images,access});
save();
alert("Komik publish!");
}
}
reader.readAsDataURL(file);
}
}

if(type==="ebook"){
if(files.length===0){alert("Upload file PDF/Word");return;}
let file=files[0];
let reader=new FileReader();
reader.onload=e=>{
db.ebook.push({
title,
file:e.target.result,
fileType:file.type,
access
});
save();
alert("E-book publish!");
}
reader.readAsDataURL(file);
}
}

function render(type){
let container=document.getElementById(type);
container.innerHTML="<div class='grid'></div>";
let grid=container.querySelector(".grid");

db[type].forEach((item,i)=>{
grid.innerHTML+=`
<div class="card">
<h3>${item.title}</h3>
<p>${item.access==="premium"?"⭐ Premium":"Free"}</p>
<button class="btn-primary" onclick="openContent('${type}',${i})">Baca</button>
<button class="btn-edit" onclick="editContent('${type}',${i})">Edit</button>
<button class="btn-delete" onclick="deleteContent('${type}',${i})">Hapus</button>
<button class="btn-share" onclick="shareContent('${type}',${i})">Share</button>
</div>`;
});
}

function openContent(type,i){
let item=db[type][i];

if(item.access==="premium"){
window.location.href="https://minitok.fun/donasi.html";
return;
}

let viewer=document.getElementById("viewer");
let content=document.getElementById("viewerContent");

if(type==="artikel"){
content.innerHTML=`<h2>${item.title}</h2><p style="white-space:pre-line;">${item.content}</p>`;
}

if(type==="komik"){
content.innerHTML="<div class='webtoon'>"+
item.images.map(img=>`<img src="${img}">`).join("")+
"</div>";
}

if(type==="ebook"){
if(item.fileType.includes("pdf")){
content.innerHTML=`<iframe src="${item.file}"></iframe>`;
}else{
content.innerHTML=`<h2>${item.title}</h2>
<p>File Word tidak bisa dibaca langsung.</p>
<a href="${item.file}" download style="background:#ff0050;padding:10px 20px;border-radius:10px;color:white;text-decoration:none;">Download File</a>`;
}
}

viewer.style.display="block";
}

function closeViewer(){
document.getElementById("viewer").style.display="none";
}

function deleteContent(type,i){
if(confirm("Yakin hapus?")){
db[type].splice(i,1);
save();
render(type);
}
}

function editContent(type,i){
let item=db[type][i];
let newTitle=prompt("Edit Judul:",item.title);
if(newTitle){
item.title=newTitle;
save();
render(type);
}
}

function shareContent(type,i){
let item=db[type][i];
let text=encodeURIComponent("Baca "+item.title+" di MiniTok!");
window.open("https://wa.me/?text="+text);
}

show("artikel");

</script>

</body>
</html>
