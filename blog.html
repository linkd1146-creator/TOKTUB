<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MiniTok Blog Upload</title>

<style>
body{
  margin:0;
  font-family:Arial, Helvetica, sans-serif;
  background:#0f0f0f;
  color:white;
}

header{
  text-align:center;
  padding:20px;
  font-size:24px;
  font-weight:bold;
  border-bottom:1px solid #222;
}

.topbar{
  display:flex;
  justify-content:center;
  gap:10px;
  padding:15px;
  flex-wrap:wrap;
}

button{
  padding:8px 14px;
  border:none;
  border-radius:8px;
  background:#222;
  color:white;
  cursor:pointer;
}

button:hover{background:#333;}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:20px;
  padding:20px;
}

.card{
  background:#1a1a1a;
  padding:15px;
  border-radius:12px;
  transition:0.3s;
}

.card:hover{
  background:#222;
  transform:translateY(-5px);
}

.meta{
  font-size:12px;
  color:#aaa;
}

.card img{
  width:100%;
  border-radius:8px;
  margin-bottom:10px;
}

.form-section{
  border-top:1px solid #222;
  padding:20px;
  max-width:800px;
  margin:auto;
}

input, textarea, select{
  width:100%;
  padding:10px;
  margin:10px 0;
  border-radius:8px;
  border:none;
  background:#1a1a1a;
  color:white;
}

textarea{min-height:120px;}

.post-btn{
  background:#ffcc00;
  color:black;
  font-weight:bold;
}

.preview-img{
  width:150px;
  margin-top:10px;
  border-radius:8px;
}
</style>
</head>

<body>

<header>
🚀 MiniTok Blog (Artikel & Komik + Upload)
</header>

<div class="topbar">
  <button onclick="filterCategory('all')">Semua</button>
  <button onclick="filterCategory('artikel')">Artikel</button>
  <button onclick="filterCategory('komik')">Komik</button>
</div>

<div class="grid" id="postContainer"></div>

<!-- FORM TAMBAH POST -->
<div class="form-section">
  <h2>📝 Tambah Post</h2>

  <select id="category">
    <option value="artikel">Artikel</option>
    <option value="komik">Komik</option>
  </select>

  <input type="text" id="title" placeholder="Judul">

  <textarea id="content" placeholder="Isi konten"></textarea>

  <label>Upload Gambar:</label>
  <input type="file" id="imageUpload" accept="image/*">
  <img id="preview" class="preview-img" style="display:none;">

  <button class="post-btn" onclick="addPost()">Publish</button>
</div>

<script>

let posts = JSON.parse(localStorage.getItem("blogPosts")) || [];
let uploadedImage = "";

function displayPosts(data){
  const container = document.getElementById("postContainer");
  container.innerHTML = "";

  data.forEach(post=>{
    container.innerHTML += `
      <div class="card">
        ${post.image ? `<img src="${post.image}">` : ""}
        <h3>${post.title}</h3>
        <div class="meta">📂 ${post.category}</div>
        <p>${post.content.substring(0,100)}...</p>
      </div>
    `;
  });
}

function addPost(){
  const title = document.getElementById("title").value;
  const content = document.getElementById("content").value;
  const category = document.getElementById("category").value;

  if(title === "" || content === ""){
    alert("Isi semua kolom!");
    return;
  }

  posts.unshift({
    title,
    content,
    category,
    image: uploadedImage
  });

  localStorage.setItem("blogPosts", JSON.stringify(posts));

  document.getElementById("title").value="";
  document.getElementById("content").value="";
  document.getElementById("preview").style.display="none";
  uploadedImage="";

  displayPosts(posts);
}

function filterCategory(cat){
  if(cat === "all"){
    displayPosts(posts);
  }else{
    displayPosts(posts.filter(p=>p.category===cat));
  }
}

document.getElementById("imageUpload").addEventListener("change", function(e){
  const file = e.target.files[0];
  const reader = new FileReader();
  reader.onload = function(){
    uploadedImage = reader.result;
    const preview = document.getElementById("preview");
    preview.src = uploadedImage;
    preview.style.display="block";
  }
  if(file){
    reader.readAsDataURL(file);
  }
});

displayPosts(posts);

</script>

</body>
</html>
