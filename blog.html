<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MiniTok Blog & E-Book</title>

<style>
body{
  margin:0;
  font-family:Arial, Helvetica, sans-serif;
  background:#0f0f0f;
  color:white;
}

header{
  text-align:center;
  padding:20px;
  font-size:24px;
  font-weight:bold;
  border-bottom:1px solid #222;
}

nav{
  display:flex;
  justify-content:center;
  gap:10px;
  padding:15px;
  flex-wrap:wrap;
}

button{
  padding:8px 14px;
  border:none;
  border-radius:8px;
  background:#222;
  color:white;
  cursor:pointer;
}

button:hover{background:#333;}

.active{
  background:#ffcc00;
  color:black;
  font-weight:bold;
}

.section{
  display:none;
}

.section.active{
  display:block;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:20px;
  padding:20px;
}

.card{
  background:#1a1a1a;
  padding:15px;
  border-radius:12px;
  box-shadow:0 0 10px rgba(0,0,0,0.4);
}

.meta{
  font-size:12px;
  color:#aaa;
}

.file-link{
  display:block;
  margin-top:10px;
  color:#ffcc00;
}

.form-section{
  border-top:1px solid #222;
  padding:20px;
  max-width:800px;
  margin:auto;
}

input, textarea, select{
  width:100%;
  padding:10px;
  margin:10px 0;
  border-radius:8px;
  border:none;
  background:#1a1a1a;
  color:white;
}

textarea{min-height:120px;}

.post-btn{
  background:#ffcc00;
  color:black;
  font-weight:bold;
}
</style>
</head>

<body>

<header>
🚀 MiniTok Blog & E-Book Platform
</header>

<nav>
  <button onclick="showSection('blog')" class="active" id="btnBlog">Blog</button>
  <button onclick="showSection('ebook')" id="btnEbook">E-Book</button>
</nav>

<!-- ================= BLOG ================= -->
<div id="blog" class="section active">

<div style="text-align:center; padding-top:10px;">
  <button onclick="filterCategory('all')">Semua</button>
  <button onclick="filterCategory('artikel')">Artikel</button>
  <button onclick="filterCategory('komik')">Komik</button>
</div>

<div class="grid" id="postContainer"></div>

<div class="form-section">
  <h2>📝 Tambah Post</h2>

  <select id="category">
    <option value="artikel">Artikel</option>
    <option value="komik">Komik</option>
  </select>

  <input type="text" id="title" placeholder="Judul">

  <textarea id="content" placeholder="Isi deskripsi konten"></textarea>

  <label>Upload File (Word / PDF):</label>
  <input type="file" id="fileUpload" accept=".pdf,.doc,.docx">

  <button class="post-btn" onclick="addPost()">Publish</button>
</div>

</div>

<!-- ================= EBOOK ================= -->
<div id="ebook" class="section">

<div class="grid" id="ebookContainer"></div>

<div class="form-section">
  <h2>📚 Tambah E-Book</h2>

  <input type="text" id="ebookTitle" placeholder="Judul E-Book">

  <textarea id="ebookDesc" placeholder="Deskripsi singkat"></textarea>

  <label>Upload File E-Book (PDF / Word):</label>
  <input type="file" id="ebookUpload" accept=".pdf,.doc,.docx">

  <button class="post-btn" onclick="addEbook()">Publish E-Book</button>
</div>

</div>

<script>

let posts = JSON.parse(localStorage.getItem("blogPosts")) || [];
let ebooks = JSON.parse(localStorage.getItem("ebooks")) || [];
let uploadedFile = null;
let uploadedEbook = null;

/* ================= NAVIGATION ================= */

function showSection(section){
  document.querySelectorAll(".section").forEach(s=>s.classList.remove("active"));
  document.querySelectorAll("nav button").forEach(b=>b.classList.remove("active"));
  
  document.getElementById(section).classList.add("active");
  document.getElementById("btn"+capitalize(section)).classList.add("active");
}

function capitalize(str){
  return str.charAt(0).toUpperCase() + str.slice(1);
}

/* ================= BLOG ================= */

function displayPosts(data){
  const container = document.getElementById("postContainer");
  container.innerHTML = "";

  data.forEach(post=>{
    container.innerHTML += `
      <div class="card">
        <h3>${post.title}</h3>
        <div class="meta">📂 ${post.category}</div>
        <p>${post.content}</p>
        ${post.file ? `<a class="file-link" href="${post.file}" target="_blank">📄 Buka File</a>` : ""}
      </div>
    `;
  });
}

function addPost(){
  const title = document.getElementById("title").value;
  const content = document.getElementById("content").value;
  const category = document.getElementById("category").value;

  if(title===""){
    alert("Judul wajib diisi!");
    return;
  }

  posts.unshift({title, content, category, file: uploadedFile});
  localStorage.setItem("blogPosts", JSON.stringify(posts));

  document.getElementById("title").value="";
  document.getElementById("content").value="";
  document.getElementById("fileUpload").value="";
  uploadedFile=null;

  displayPosts(posts);
}

document.getElementById("fileUpload").addEventListener("change", function(e){
  const file = e.target.files[0];
  const reader = new FileReader();
  reader.onload = ()=> uploadedFile = reader.result;
  if(file) reader.readAsDataURL(file);
});

function filterCategory(cat){
  if(cat==="all"){
    displayPosts(posts);
  }else{
    displayPosts(posts.filter(p=>p.category===cat));
  }
}

/* ================= EBOOK ================= */

function displayEbooks(){
  const container = document.getElementById("ebookContainer");
  container.innerHTML = "";

  ebooks.forEach(book=>{
    container.innerHTML += `
      <div class="card">
        <h3>${book.title}</h3>
        <p>${book.desc}</p>
        ${book.file ? `<a class="file-link" href="${book.file}" target="_blank">📖 Buka E-Book</a>` : ""}
      </div>
    `;
  });
}

function addEbook(){
  const title = document.getElementById("ebookTitle").value;
  const desc = document.getElementById("ebookDesc").value;

  if(title===""){
    alert("Judul wajib diisi!");
    return;
  }

  ebooks.unshift({title, desc, file: uploadedEbook});
  localStorage.setItem("ebooks", JSON.stringify(ebooks));

  document.getElementById("ebookTitle").value="";
  document.getElementById("ebookDesc").value="";
  document.getElementById("ebookUpload").value="";
  uploadedEbook=null;

  displayEbooks();
}

document.getElementById("ebookUpload").addEventListener("change", function(e){
  const file = e.target.files[0];
  const reader = new FileReader();
  reader.onload = ()=> uploadedEbook = reader.result;
  if(file) reader.readAsDataURL(file);
});

/* ================= INIT ================= */

displayPosts(posts);
displayEbooks();

</script>

</body>
</html>
