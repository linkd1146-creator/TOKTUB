/* ================== STRUKTUR ================== */

function generateStructuredAnswer(topic){

const base = masterTopics[topic];

return `
DEFINISI:
${base}

PENJELASAN:
Topik ini memiliki peran besar dalam kehidupan manusia modern.

CONTOH:
Contoh penerapannya dapat dilihat dalam kehidupan sehari-hari.

MANFAAT:
Memberikan pemahaman dan meningkatkan kualitas hidup.

TANTANGAN:
Perubahan zaman dan perbedaan pandangan.

KESIMPULAN:
Topik ini penting dalam membentuk masa depan individu dan masyarakat.
`;
}

/* ================== AI ================== */

function fakeAI(text){

const msg = text.toLowerCase();

if(msg.includes("halo")){
return "Halo 👋 Saya GeminiTok AI PRO.";
}

if(msg.includes("kamu siapa")){
return "Saya GeminiTok AI PRO 🤖 Asisten pintar.";
}

for(let key in masterTopics){
if(msg.includes(key)){
return generateStructuredAnswer(key);
}
}

return "Silakan sebutkan topik seperti: kehidupan, bisnis, AI, ekonomi, politik, agama.";
}

/* ================== CHAT ================== */

window.kirim = function(){
const input=document.getElementById("input");
const teks=input.value.trim();
if(!teks) return;

tambahPesan(teks,"user");
input.value="";

setTimeout(()=>{
const reply=fakeAI(teks);
tambahPesan(reply,"bot");
},600);
}

function tambahPesan(text,type){
const div=document.createElement("div");
div.className="message "+type;
div.innerText=text;
chat.appendChild(div);
chat.scrollTop=chat.scrollHeight;
}

};
