<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Chat Gratis</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.3.136/pdf.min.js"></script>

<style>
body{
font-family:Arial,sans-serif;
background:#111;
color:#fff;
margin:0;
display:flex;
flex-direction:column;
height:100vh;
}
header{
padding:15px;
background:#1a1a1a;
font-weight:bold;
}
#chat{
flex:1;
overflow:auto;
padding:15px;
}
.msg{
padding:12px;
margin:10px 0;
border-radius:10px;
white-space:pre-wrap;
}
.user{
background:#2563eb;
}
.bot{
background:#222;
}
footer{
display:flex;
padding:10px;
background:#1a1a1a;
gap:10px;
}
input{
flex:1;
padding:12px;
border:none;
border-radius:8px;
}
button{
padding:12px;
cursor:pointer;
}
</style>
</head>
<body>

<header>
🤖 AI Gratis
<button onclick="voiceInput()">🎤</button>
<button onclick="toggleVoice()">🔊</button>
<button onclick="pdfInput.click()">📄 PDF</button>
</header>

<input type="file" id="pdfInput" accept=".pdf" style="display:none">

<div id="chat"></div>

<footer>
<input id="q" placeholder="Tulis pertanyaan...">
<button onclick="send()">Kirim</button>
</footer>

<script>

const GEMINI_API_KEY="";

let pdfText="";
let voice=true;

const chat=document.getElementById("chat");
const q=document.getElementById("q");
const pdfInput=document.getElementById("pdfInput");

function add(text,type){

const d=document.createElement("div");

d.className="msg "+type;
d.textContent=text;

chat.appendChild(d);

chat.scrollTop=chat.scrollHeight;

if(type==="bot" && voice){
speak(text);
}

}

function speak(text){

speechSynthesis.cancel();

const u=new SpeechSynthesisUtterance(text);

u.lang="id-ID";

speechSynthesis.speak(u);

}

function toggleVoice(){

voice=!voice;

alert(
voice?
"Suara aktif":
"Suara nonaktif"
);

}

function voiceInput(){

const SR=
window.SpeechRecognition||
window.webkitSpeechRecognition;

if(!SR){
alert("Browser tidak mendukung");
return;
}

const rec=new SR();

rec.lang="id-ID";

rec.start();

rec.onresult=e=>{
q.value=e.results[0][0].transcript;
};

}

async function askGemini(prompt){

const body={
contents:[
{
parts:[
{
text:
(pdfText?
"ISI PDF:\n"+pdfText+"\n\n":"")
+prompt
}
]
}
]
};

const res=await fetch(
"https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key="+GEMINI_API_KEY,
{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify(body)
}
);

const data=await res.json();

return data?.candidates?.[0]?.content?.parts?.[0]?.text
|| "Tidak ada jawaban";
}

async function wiki(query){

try{

const r=await fetch(
"https://id.wikipedia.org/api/rest_v1/page/summary/"
+encodeURIComponent(query)
);

const d=await r.json();

return d.extract;

}catch{

return "";

}

}

async function duck(query){

try{

const r=await fetch(
"https://api.duckduckgo.com/?q="
+encodeURIComponent(query)
+"&format=json"
);

const d=await r.json();

return d.AbstractText;

}catch{

return "";

}

}

async function send(){

const text=q.value.trim();

if(!text) return;

add(text,"user");

q.value="";

add("Sedang berpikir...","bot");

const loading=
chat.lastElementChild;

let answer="";

try{

answer=await askGemini(text);

}catch{

answer="";
}

if(!answer){

answer=await wiki(text);

}

if(!answer){

answer=await duck(text);

}

loading.remove();

add(answer||"coba tanyakan dengan satu kata","bot");

}

pdfInput.onchange=async e=>{

const file=e.target.files[0];

if(!file) return;

const buf=
await file.arrayBuffer();

const pdf=
await pdfjsLib
.getDocument(new Uint8Array(buf))
.promise;

pdfText="";

for(let i=1;i<=pdf.numPages;i++){

const page=
await pdf.getPage(i);

const txt=
await page.getTextContent();

pdfText+=txt.items
.map(x=>x.str)
.join(" ");

}

alert(
"PDF berhasil dimuat"
);

};

add(
"Halo! Selamat Datang Di Geminitok AI ada yang mau ditanyakan.",
"bot"
);

</script>

</body>
</html>
