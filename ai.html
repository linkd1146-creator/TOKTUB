<script>

let history = JSON.parse(localStorage.getItem("geminitokHistory")) || [];

/* ================== STRUKTUR JAWABAN ================== */

function generateStructuredAnswer(topic){

const base = masterTopics[topic];

return `
DEFINISI:
${base}

PENJELASAN:
Topik ini memiliki peran besar dalam kehidupan manusia modern dan mempengaruhi berbagai aspek sosial, ekonomi, dan pribadi.

CONTOH:
Contoh nyata penerapannya dapat dilihat dalam kehidupan sehari-hari, baik dalam keluarga, pekerjaan, maupun masyarakat luas.

MANFAAT:
Memberikan pemahaman lebih luas, meningkatkan kualitas hidup, dan membantu pengambilan keputusan yang lebih baik.

TANTANGAN:
Perubahan zaman, kurangnya edukasi, serta perbedaan pandangan sering menjadi hambatan.

DAMPAK POSITIF:
Mendorong kemajuan, inovasi, dan peningkatan kualitas kehidupan.

DAMPAK NEGATIF:
Jika disalahgunakan dapat menyebabkan konflik, kesenjangan, atau kerugian sosial.

KELEBIHAN:
Membantu perkembangan individu dan masyarakat.

KEKURANGAN:
Tidak semua orang memiliki akses atau pemahaman yang cukup.

KRITIK:
Sebagian pihak menilai implementasinya belum merata atau kurang adil.

SARAN:
Perlu edukasi, kolaborasi, dan pengembangan berkelanjutan.

MASUKAN:
Masyarakat perlu terbuka terhadap pembelajaran dan perubahan.

TURUNAN TOPIK:
- Analisis mendalam
- Studi kasus
- Strategi penerapan
- Dampak jangka panjang
- Perbandingan global

KESIMPULAN:
Topik ini sangat penting dalam membentuk masa depan individu dan peradaban dunia.
`;
}

/* ================== AI ENGINE ================== */

function fakeAI(text){

const msg = text.toLowerCase();

if(msg.includes("halo") || msg.includes("hello")){
return "Halo 👋 Saya GeminiTok AI PRO.\nTanyakan topik apa saja: kehidupan, bisnis, AI, ekonomi, politik, agama, globalisasi, dan lainnya.";
}

if(msg.includes("kamu siapa")){
return "Saya GeminiTok AI PRO 🤖 Asisten pintar berbasis sistem pengetahuan terstruktur.";
}

for(let key in masterTopics){
if(msg.includes(key)){
return generateStructuredAnswer(key);
}
}

return "Topik belum spesifik.\nSilakan sebutkan kata kunci seperti: kehidupan, bisnis, AI, ekonomi, sejarah, politik, agama, kesehatan, dan lainnya.";
}

/* ================== CHAT SYSTEM ================== */

function tambahPesan(text,type){
const div=document.createElement("div");
div.className="message "+type;
div.innerText=text;
chat.appendChild(div);
chat.scrollTop=chat.scrollHeight;
}

function kirim(){
const input=document.getElementById("input");
const teks=input.value.trim();
if(!teks) return;

tambahPesan(teks,"user");
input.value="";

setTimeout(()=>{
const reply=fakeAI(teks);
tambahPesan(reply,"bot");
},600);
}

/* ================== VOICE ================== */

function toggleVoice(){
voiceEnabled=!voiceEnabled;
alert("Voice "+(voiceEnabled?"ON 🔊":"OFF 🔇"));
}

function startVoice(){
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(!SR){ alert("Voice not supported"); return; }

const rec=new SR();
rec.lang="id-ID";
rec.start();
rec.onresult=(e)=>{
document.getElementById("input").value=e.results[0][0].transcript;
};
}

function resetChat(){
localStorage.clear();
location.reload();
}

</script>
