<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GeminiTok AI</title>
<div class="menu-btn" onclick="toggleMenu()">☰</div>

<a href="ai.html" style="
margin-left:10px;
font-size:20px;
text-decoration:none;
color:white;
">
🤖
</a>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#000;
  color:white;
}

/* HEADER */
.header{
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px;
  background:#111;
}

.back{
  font-size:22px;
  cursor:pointer;
}

/* CHAT AREA */
.chat-box{
  height:calc(100vh - 140px);
  overflow-y:auto;
  padding:10px;
}

.msg{
  padding:8px;
  margin:5px 0;
  border-radius:8px;
}

.user{background:#2b6cff;}
.ai{background:#222;}

/* INPUT */
.input-bar{
  display:flex;
  gap:5px;
  padding:10px;
  background:#111;
}

input{
  flex:1;
  padding:10px;
}

button{
  padding:10px;
  background:#2b6cff;
  color:white;
  border:none;
}

/* MODE */
.mode{
  display:flex;
  gap:10px;
  padding:10px;
}
</style>
</head>

<body>

<!-- HEADER -->
<div class="header">
  <div class="back" onclick="history.back()">⬅</div>
  🤖 GeminiTok AI
</div>

<!-- MODE -->
<div class="mode">
  <button onclick="mode='chat'">💬 Chat</button>
  <button onclick="startVoice()">🎤 Voice</button>
</div>

<!-- CHAT -->
<div class="chat-box" id="chatBox"></div>

<!-- INPUT -->
<div class="input-bar">
  <input id="input" placeholder="Tulis pesan...">
  <button onclick="send()">Send</button>
</div>

<script>

let API_KEY="AIzaSyAyl3fLVXYtFfiUJZ-fglGKDoIpEjQFuV8";
let mode="chat";

/* ADD MSG */
function addMsg(text,type){
  const box=document.getElementById("chatBox");
  const div=document.createElement("div");
  div.className="msg "+type;
  div.innerText=text;
  box.appendChild(div);
  box.scrollTop=box.scrollHeight;
}

/* CHAT AI */
async function send(){
  const input=document.getElementById("input");
  const text=input.value;
  if(!text) return;

  addMsg(text,"user");
  input.value="";

  const res=await fetch(
    "https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key="+API_KEY,
    {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({contents:[{parts:[{text}]}]})
    }
  );

  const data=await res.json();

  const reply=
    data?.candidates?.[0]?.content?.parts?.[0]?.text ||
    "No response";

  addMsg(reply,"ai");
}

/* VOICE AI */
function startVoice(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){alert("Tidak support");return;}

  const rec=new SR();
  rec.lang="id-ID";
  rec.start();

  rec.onresult=(e)=>{
    const text=e.results[0][0].transcript;
    document.getElementById("input").value=text;
  };
}

</script>

</body>
</html>
