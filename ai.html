<script>
const chat=document.getElementById("chat");

let history=JSON.parse(localStorage.getItem("ultraHistory"))||[];
let memoryContext=JSON.parse(localStorage.getItem("aiContext"))||{};
let voiceEnabled=true;
let aiMode="genius";
let currentLang=localStorage.getItem("aiLang")||"auto";

/* ================= SAVE ================= */
function saveAll(){
  localStorage.setItem("ultraHistory",JSON.stringify(history));
  localStorage.setItem("aiContext",JSON.stringify(memoryContext));
  localStorage.setItem("aiLang",currentLang);
}

/* ================= LANGUAGE ================= */
function detectLanguage(text){
  if(/[ء-ي]/.test(text)) return "ar";
  if(/[ぁ-んァ-ン]/.test(text)) return "jp";
  if(text.match(/[a-zA-Z]/)){
    if(text.toLowerCase().includes("the")||text.toLowerCase().includes("what")) return "en";
  }
  return "id";
}

function setLanguage(lang){
  currentLang=lang;
  saveAll();
}

function applyRTL(lang){
  if(lang==="ar") document.body.classList.add("rtl");
  else document.body.classList.remove("rtl");
}

/* ================= MESSAGE ================= */
function tambahPesan(text,type){
  const div=document.createElement("div");
  div.className="message "+type;
  div.innerText=text;
  chat.appendChild(div);
  chat.scrollTop=chat.scrollHeight;
  if(type==="bot") speak(text);
}

/* ================= VOICE ================= */
function toggleVoice(){voiceEnabled=!voiceEnabled;}

function speak(text){
  if(!voiceEnabled||!window.speechSynthesis) return;
  const u=new SpeechSynthesisUtterance(text);
  u.lang=currentLang==="en"?"en-US":
        currentLang==="ar"?"ar-SA":
        currentLang==="jp"?"ja-JP":"id-ID";
  speechSynthesis.speak(u);
}

/* ================= MODE ================= */
function setMode(mode){
  aiMode=mode;
  alert("Mode: "+mode.toUpperCase());
}

/* ================= INTENT ================= */
function analyze(text){
  const lower=text.toLowerCase();

  if(["halo","hai","hi","hello","assalamualaikum"].includes(lower))
    return "greeting";

  if(lower.includes("sedih")||lower.includes("capek")||lower.includes("lelah"))
    return "emotion";

  if(lower.includes("cara")||lower.includes("bagaimana"))
    return "how";

  if(lower.includes("kenapa"))
    return "why";

  if(text.trim().split(" ").length===1)
    return "single";

  if(lower.includes("?"))
    return "question";

  return "general";
}

/* ================= KNOWLEDGE ================= */
const knowledgeDB={
  politik:"Politik adalah sistem pengelolaan kekuasaan dalam negara yang menentukan arah kebijakan publik.",
  ekonomi:"Ekonomi mempelajari produksi, distribusi, dan konsumsi sumber daya.",
  bisnis:"Bisnis adalah proses menciptakan nilai melalui produk atau jasa untuk memperoleh keuntungan.",
  ai:"Artificial Intelligence adalah teknologi yang memungkinkan mesin belajar dan mengambil keputusan otomatis.",
  cinta:"Cinta adalah kombinasi emosi, komitmen, dan kepercayaan.",
  teknologi:"Teknologi adalah penerapan ilmu untuk memecahkan masalah dan meningkatkan efisiensi.",
  kesehatan:"Kesehatan adalah kondisi fisik dan mental yang seimbang."
};

function searchKnowledge(text){
  for(const key in knowledgeDB){
    if(text.toLowerCase().includes(key)){
      memoryContext.lastTopic=key;
      return knowledgeDB[key];
    }
  }
  return null;
}

/* ================= REASONING ================= */
function reasoningAnswer(text,intent){

  let base=searchKnowledge(text);

  if(!base && memoryContext.lastTopic){
    base="Melanjutkan tentang "+memoryContext.lastTopic+
         ", topik ini berkaitan dengan perkembangan sosial dan zaman.";
  }

  if(!base){
    base="Topik ini dapat dijelaskan dari berbagai sudut pandang tergantung konteksnya.";
  }

  if(intent==="how"){
    return "Langkah-langkahnya:\n1. Pahami konsep dasar.\n2. Tentukan tujuan.\n3. Susun strategi.\n4. Evaluasi hasil.\n\n"+base;
  }

  if(intent==="why"){
    return "Hal tersebut biasanya dipengaruhi oleh faktor internal dan eksternal.\n\n"+base;
  }

  if(intent==="single"){
    return base;
  }

  if(intent==="question"){
    return base+"\n\nJika ingin, aku bisa jelaskan lebih detail bagian tertentu.";
  }

  return base;
}

/* ================= FORMAT MODE ================= */
function formatAnswer(text){

  if(aiMode==="pelajar")
    return "📘 Penjelasan:\n\n"+text;

  if(aiMode==="ceo")
    return "💼 Insight Strategis:\n\n"+text+"\n\n👉 Fokus pada eksekusi dan peluang.";

  if(aiMode==="debat")
    return "⚔️ Argumen:\n"+text+
           "\n\n⚖️ Perspektif Lain:\nPandangan bisa berbeda tergantung nilai dan konteks.";

  if(aiMode==="opini")
    return "💡 Opini:\n"+text+
           "\n\nPandangan ini bisa berkembang sesuai situasi.";

  return text;
}

/* ================= SMART REPLY ================= */
async function smartReply(text){

  let lang=currentLang==="auto"?detectLanguage(text):currentLang;
  currentLang=lang;
  applyRTL(lang);

  const intent=analyze(text);

  if(intent==="greeting"){
    if(text.toLowerCase()==="assalamualaikum")
      return "Waalaikumsalam 🤍 Semoga harimu penuh kebaikan.";
    return lang==="en"?"Hello 👋 What would you like to discuss?"
         :"Halo 👋 Ada yang ingin kamu bahas?";
  }

  if(intent==="emotion"){
    return "Kedengarannya berat ya 😔 Kamu boleh cerita lebih detail, aku siap dengar.";
  }

  let result=reasoningAnswer(text,intent);

  return formatAnswer(result);
}

/* ================= SEND ================= */
async function kirim(){
  const input=document.getElementById("input");
  const teks=input.value.trim();
  if(!teks)return;

  tambahPesan(teks,"user");
  history.push({role:"user",text:teks});
  saveAll();
  input.value="";

  const typing=document.createElement("div");
  typing.className="message bot typing";
  typing.innerText="GeminiTok AI menganalisis...";
  chat.appendChild(typing);

  setTimeout(async()=>{
    typing.remove();
    let final=await smartReply(teks);
    history.push({role:"bot",text:final});
    saveAll();
    tambahPesan(final,"bot");
  },800);
}

/* ================= RESET ================= */
function resetChat(){
  localStorage.clear();
  location.reload();
}

/* ================= LOAD ================= */
window.onload=function(){
  if(history.length>0){
    history.forEach(h=>tambahPesan(h.text,h.role==="user"?"user":"bot"));
  }else{
    tambahPesan("Halo 👋 Aku GeminiTok AI Ultra.\nTanya apa saja, aku jawab dengan analisis & konteks.","bot");
  }
};
</script>
