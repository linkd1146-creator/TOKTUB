<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GeminiTok AI Ultra</title>

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css"
/>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:#0b0f19;
  color:white;
  font-family:Arial,sans-serif;
  height:100vh;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

.header{
  background:#111827;
  padding:14px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:
  1px solid rgba(255,255,255,.08);

  box-shadow:
  0 0 25px
  rgba(43,108,255,.25);
}

.logo{
  font-size:20px;
  font-weight:bold;
}

.menu{
  display:flex;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
}

.menu span{
  cursor:pointer;
  background:#1e293b;
  padding:10px;
  border-radius:12px;
  transition:.2s;
}

.menu span:hover{
  background:#2b6cff;
  transform:scale(1.05);
}

.chat{
  flex:1;
  overflow-y:auto;
  padding:20px;
  display:flex;
  flex-direction:column;
  gap:16px;
  scroll-behavior:smooth;

  background:
  radial-gradient(
    circle at top,
    rgba(43,108,255,.15),
    transparent 40%
  );
}

.chat::-webkit-scrollbar{
  width:6px;
}

.chat::-webkit-scrollbar-thumb{
  background:#2b6cff;
  border-radius:10px;
}

.message{
  padding:16px;
  border-radius:20px;
  max-width:85%;
  white-space:pre-wrap;
  line-height:1.7;
  animation:fade .25s ease;
}

.user{
  background:linear-gradient(
    135deg,
    #2b6cff,
    #4d8dff
  );

  align-self:flex-end;

  box-shadow:
  0 0 15px
  rgba(43,108,255,.3);
}

.bot{
  background:#141b2d;
  border:
  1px solid rgba(255,255,255,.06);

  align-self:flex-start;

  backdrop-filter:blur(10px);
}

.typing{
  opacity:.7;
  font-style:italic;
}

.typing::after{
  content:"...";
  animation:dots 1s infinite;
}

@keyframes dots{

  0%{content:".";}
  50%{content:"..";}
  100%{content:"...";}
}

.input-area{
  display:flex;
  gap:10px;
  padding:14px;
  background:#101624;
  border-top:
  1px solid rgba(255,255,255,.08);
}

input{
  flex:1;
  background:#1a2238;
  border:none;
  color:white;
  padding:15px;
  border-radius:16px;
  outline:none;
  font-size:15px;
}

button{
  background:#2b6cff;
  border:none;
  color:white;
  padding:14px 20px;
  border-radius:16px;
  cursor:pointer;
  font-weight:bold;
  transition:.2s;
}

button:hover{
  transform:scale(1.03);
  opacity:.95;
}

#clock{
  font-size:12px;
  opacity:.7;
}

pre{
  background:#0d1117;
  padding:12px;
  border-radius:12px;
  overflow:auto;
  position:relative;
}

pre button{
  position:absolute;
  top:8px;
  right:8px;
  padding:5px 10px;
  font-size:12px;
}

img{
  max-width:100%;
  border-radius:12px;
}

@keyframes fade{
  from{
    opacity:0;
    transform:translateY(10px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

@media(max-width:700px){

  .message{
    max-width:100%;
    font-size:14px;
  }

  .menu{
    width:100%;
    justify-content:center;
  }

  .header{
    flex-direction:column;
    align-items:flex-start;
    gap:10px;
  }

  .input-area{
    padding:10px;
  }
}

</style>
</head>

<body>

<div class="header">

  <div class="logo">
    🤖 GeminiTok AI Ultra
  </div>

  <div class="menu">

    <span onclick="startVoice()">🎤</span>

    <span onclick="toggleVoice()">🔊</span>

    <span onclick="readCurrentText()">📖</span>

    <span onclick="exportChat()">📄</span>

    <span onclick="resetChat()">🔄</span>

  </div>

  <div id="clock"></div>

</div>

<div class="chat" id="chat"></div>

<div class="input-area">

  <input
    type="text"
    id="input"
    placeholder="Ketik pesan..."
  >

  <input
    type="file"
    id="imgUpload"
    accept="image/*"
    hidden
  >

  <button onclick="document.getElementById('imgUpload').click()">
    📷
  </button>

  <button onclick="kirim()">
    Kirim
  </button>

</div>

<script>

/* ================= CONFIG ================= */

const WORKER_API =
"https://geminitok-api.linkd1146.workers.dev/";

/* ================= ELEMENT ================= */

const chat =
document.getElementById("chat");

const input =
document.getElementById("input");

/* ================= STORAGE ================= */

let history =
JSON.parse(
localStorage.getItem("ultraHistory")
) || [];

let voiceEnabled = true;

/* ================= SAVE ================= */

async function askGemini(prompt){

  try{

    console.log("PROMPT:", prompt);

    const response =
    await fetch(
      WORKER_API,
      {
        method:"POST",

        headers:{
          "Content-Type":"application/json"
        },

        body:JSON.stringify({
          prompt:prompt
        })
      }
    );

    console.log("STATUS:", response.status);

    const data =
    await response.json();

    console.log("DATA:", data);

    if(data.answer){

      return data.answer;

    }

    if(data.error){

      return "❌ " + data.error;

    }

    return "❌ Tidak ada response";

  }catch(err){

    console.log("ERROR:", err);

    return "❌ Gagal koneksi";

  }

}

/* ================= VOICE ================= */

function toggleVoice(){

  voiceEnabled = !voiceEnabled;

  tambahPesan(
    voiceEnabled
    ? "🔊 Voice diaktifkan"
    : "🔇 Voice dimatikan",
    "bot"
  );
}

function speak(text){

  if(!voiceEnabled) return;

  if(!window.speechSynthesis) return;

  speechSynthesis.cancel();

  const utter =
  new SpeechSynthesisUtterance(text);

  utter.lang = "id-ID";
  utter.rate = 1;
  utter.pitch = 1;

  speechSynthesis.speak(utter);
}

function readCurrentText(){

  const teks =
  input.value.trim();

  if(!teks){

    alert("Masukkan teks dulu");
    return;
  }

  speak(teks);
}

/* ================= SPEECH ================= */

function startVoice(){

  const SR =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if(!SR){

    alert(
      "Browser tidak mendukung voice recognition"
    );

    return;
  }

  const recog = new SR();

  recog.lang = "id-ID";

  recog.start();

  recog.onresult = (e)=>{

    input.value =
    e.results[0][0].transcript;
  };
}

/* ================= SEARCH ================= */

async function searchWikipedia(query){

  try{

    const res = await fetch(
      "https://id.wikipedia.org/api/rest_v1/page/summary/" +
      encodeURIComponent(query)
    );

    if(!res.ok) return null;

    const data =
    await res.json();

    return data.extract || null;

  }catch(err){

    console.log(err);

    return null;
  }
}

async function duckSearch(query){

  try{

    const res = await fetch(
      "https://api.duckduckgo.com/?q=" +
      encodeURIComponent(query) +
      "&format=json"
    );

    const data =
    await res.json();

    return (
      data.AbstractText ||
      data.RelatedTopics?.[0]?.Text ||
      null
    );

  }catch(err){

    console.log(err);

    return null;
  }
}

/* ================= GEMINI ================= */

async function askGemini(userText){

  try{

    const context =
    history
    .slice(-20)
    .map(h =>
      `${h.role}: ${h.text}`
    )
    .join("\n");

    const finalPrompt = `
Kamu adalah GeminiTok AI Ultra.

Tugas:
- jawab semua pertanyaan user
- jawab natural
- jawab lengkap
- gunakan bahasa Indonesia
- jika user meminta coding maka buat lengkap
- jika user curhat maka respon empati
- jika user bercanda maka santai
- jangan jawab kosong

Riwayat:
${context}

User:
${userText}
`;

    const response =
    await fetch(
      WORKER_API,
      {
        method:"POST",

        headers:{
          "Content-Type":"application/json"
        },

        body:JSON.stringify({
          prompt:finalPrompt
        })
      }
    );

    const data =
    await response.json();

    console.log(data);

    const ai =
      data.answer ||
      data.response ||
      data.text;

    if(
      !ai ||
      ai.length < 2
    ){

      return `
Maaf, AI sedang sibuk.
Silakan coba lagi.
`;
    }

    return ai;

  }catch(err){

    console.log(err);

    return `
❌ Gagal terhubung ke AI server.
`;
  }
}

/* ================= SMART REPLY ================= */

async function smartReply(text){

  const lower =
  text.toLowerCase();

  if(
    lower.startsWith("bacakan ") ||
    lower.startsWith("baca ")
  ){

    const isi =
    text
    .replace(/^bacakan\s+/i,"")
    .replace(/^baca\s+/i,"");

    speak(isi);

    return `
🔊 Sedang membacakan:

${isi}
`;
  }

  if(lower.startsWith("wiki ")){

    const q =
    text.replace(/^wiki\s+/i,"");

    const hasil =
    await searchWikipedia(q);

    return hasil
    ? `
📚 Wikipedia:

${hasil}
`
    : "Wikipedia tidak menemukan hasil.";
  }

  if(lower.startsWith("cari ")){

    const q =
    text.replace(/^cari\s+/i,"");

    const hasil =
    await duckSearch(q);

    return hasil
    ? `
🌐 Hasil pencarian:

${hasil}
`
    : "Tidak ditemukan.";
  }

  if(lower==="siapa kamu"){

    return `
# 🤖 GeminiTok AI Ultra

Aku adalah AI assistant modern.

## Fitur:
- AI pintar
- Coding assistant
- Voice AI
- Memory chat
- Internet search
- Markdown render
- Syntax highlight
- Responsive UI
`;
  }

  const ai =
  await askGemini(text);

  return ai;
}

/* ================= SEND ================= */

async function kirim(){

  const teks =
  input.value.trim();

  if(!teks) return;

  tambahPesan(teks,"user");

  history.push({
    role:"user",
    text:teks
  });

  saveAll();

  input.value = "";

  const typing =
  document.createElement("div");

  typing.className =
  "message bot typing";

  const loadingTexts = [
    "🤖 AI sedang berpikir",
    "🧠 Menganalisis pertanyaan",
    "🌐 Mengakses pengetahuan",
    "⚡ Membuat jawaban terbaik"
  ];

  typing.innerText =
  loadingTexts[
    Math.floor(
      Math.random() *
      loadingTexts.length
    )
  ];

  chat.appendChild(typing);

  chat.scrollTop =
  chat.scrollHeight;

  const jawaban =
  await smartReply(teks);

  typing.remove();

  history.push({
    role:"bot",
    text:jawaban
  });

  saveAll();

  tambahPesan(
    jawaban,
    "bot"
  );
}

/* ================= EXPORT ================= */

function exportChat(){

  let content = "";

  history.forEach(h=>{

    content +=
    h.role.toUpperCase() +
    ":\n" +
    h.text +
    "\n\n";
  });

  const blob =
  new Blob(
    [content],
    {type:"text/plain"}
  );

  const a =
  document.createElement("a");

  a.href =
  URL.createObjectURL(blob);

  a.download =
  "GeminiTok_Chat.txt";

  a.click();
}

/* ================= RESET ================= */

function resetChat(){

  if(confirm(
    "Hapus semua chat?"
  )){

    localStorage.clear();

    location.reload();
  }
}

/* ================= IMAGE ================= */

document
.getElementById("imgUpload")
.addEventListener(
"change",
function(e){

  const file =
  e.target.files[0];

  if(!file) return;

  tambahPesan(
    "📷 Gambar dikirim:\n" +
    file.name,
    "user"
  );
});

/* ================= CLOCK ================= */

setInterval(()=>{

  const now =
  new Date();

  document
  .getElementById("clock")
  .innerText =
  now.toLocaleTimeString();

},1000);

/* ================= ENTER ================= */

input.addEventListener(
  "keydown",
  function(e){

    if(
      e.key === "Enter" &&
      !e.shiftKey
    ){

      e.preventDefault();

      kirim();
    }
  }
);

/* ================= LOAD ================= */

window.onload = ()=>{

  if(history.length){

    history.forEach(h=>{

      tambahPesan(
        h.text,
        h.role==="user"
        ? "user"
        : "bot"
      );
    });

  }else{

    tambahPesan(
`
# 👋 Halo

Aku adalah **GeminiTok AI Ultra**

Aku bisa:
- Menjawab pertanyaan
- Membantu coding
- Voice AI
- Browsing sederhana
- Memory chat
- Markdown & code
- Responsive AI assistant
`,
      "bot"
    );
  }
};

</script>

</body>
</html>
