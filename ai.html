<script>

const API_KEY = "AIzaSyAhjmf6rNQ-xWBurQelQkMzN8kQvvgDfLw";
<div class="ai-header">
  <div style="display:flex; gap:10px; align-items:center;">
    <span onclick="resetChat()" style="cursor:pointer;">🔄</span>
    GeminiTok AI
  </div>

  <span class="close-btn" onclick="toggleAI()">✖</span>
</div>
/* ============================= */
/*         MEMORY SYSTEM         */
/* ============================= */

let chatHistory = JSON.parse(localStorage.getItem("geminiHistory")) || [];

/* SAVE HISTORY */
function saveHistory(){
  localStorage.setItem("geminiHistory", JSON.stringify(chatHistory));
}

/* RESET CHAT */
function resetChat(){
  chatHistory = [];
  localStorage.removeItem("geminiHistory");
  document.getElementById("aiChat").innerHTML = "";
}

/* ============================= */
/*         ADD MESSAGE           */
/* ============================= */

function addMessage(text, type){
  const div = document.createElement("div");
  div.className = "msg " + type;
  div.innerHTML = formatMarkdown(text);

  const chat = document.getElementById("aiChat");
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

/* ============================= */
/*      MARKDOWN FORMATTER       */
/* ============================= */

function formatMarkdown(text){
  return text
    .replace(/\*\*(.*?)\*\*/g, "<b>$1</b>")
    .replace(/\n/g, "<br>")
    .replace(/```(.*?)```/gs, "<pre>$1</pre>");
}

/* ============================= */
/*      STREAMING EFFECT         */
/* ============================= */

function streamText(text){
  const div = document.createElement("div");
  div.className = "msg ai";
  document.getElementById("aiChat").appendChild(div);

  let i = 0;
  function typing(){
    if(i < text.length){
      div.innerHTML = formatMarkdown(text.substring(0,i));
      i++;
      setTimeout(typing, 8);
    }
  }
  typing();
}

/* ============================= */
/*          SEND CHAT            */
/* ============================= */

async function sendAI(){

  const input = document.getElementById("aiText");
  const text = input.value.trim();
  if(!text) return;

  addMessage(text, "user");
  input.value = "";

  chatHistory.push({
    role:"user",
    parts:[{
      text:"Jawab seperti asisten AI profesional seperti ChatGPT. Gunakan bahasa natural dan jelas. "+text
    }]
  });

  saveHistory();

  addMessage("...", "ai");

  try{
    const res = await fetch(
      "https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key="+API_KEY,
      {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
          contents: chatHistory
        })
      }
    );

    const data = await res.json();

    const reply =
      data?.candidates?.[0]?.content?.parts?.[0]?.text
      || "Maaf, saya tidak bisa menjawab.";

    /* hapus loading */
    document.getElementById("aiChat").lastChild.remove();

    streamText(reply);

    chatHistory.push({
      role:"model",
      parts:[{text:reply}]
    });

    saveHistory();

  }catch(e){
    document.getElementById("aiChat").lastChild.remove();
    addMessage("Error koneksi AI.", "ai");
  }
}

/* ============================= */
/*           VOICE AI            */
/* ============================= */

function startVoice(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){
    alert("Voice tidak support di browser ini");
    return;
  }

  const rec = new SR();
  rec.lang="id-ID";
  rec.start();

  rec.onresult=(e)=>{
    document.getElementById("aiText").value =
      e.results[0][0].transcript;
    sendAI();
  };
}

/* ============================= */
/*       LOAD OLD CHAT           */
/* ============================= */

window.onload = function(){
  chatHistory.forEach(msg=>{
    const role = msg.role === "user" ? "user" : "ai";
    addMessage(msg.parts[0].text, role);
  });
};

</script>
