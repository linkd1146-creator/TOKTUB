```html
<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GeminiTok AI Debug</title>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:#0b0f19;
  color:white;
  font-family:Arial,sans-serif;
  height:100vh;
  display:flex;
  flex-direction:column;
}

.header{
  background:#111827;
  padding:15px;
  font-size:20px;
  font-weight:bold;
  border-bottom:1px solid rgba(255,255,255,.08);
}

.chat{
  flex:1;
  overflow-y:auto;
  padding:20px;
  display:flex;
  flex-direction:column;
  gap:15px;
}

.message{
  padding:15px;
  border-radius:16px;
  max-width:85%;
  white-space:pre-wrap;
  line-height:1.6;
}

.user{
  align-self:flex-end;
  background:#2b6cff;
}

.bot{
  align-self:flex-start;
  background:#141b2d;
}

.input-area{
  display:flex;
  gap:10px;
  padding:14px;
  background:#101624;
}

input{
  flex:1;
  padding:15px;
  border:none;
  border-radius:14px;
  background:#1a2238;
  color:white;
  outline:none;
}

button{
  background:#2b6cff;
  border:none;
  color:white;
  padding:14px 20px;
  border-radius:14px;
  cursor:pointer;
}

.debug{
  background:#111;
  color:#00ff88;
  padding:10px;
  font-size:12px;
  border-top:1px solid #333;
  height:180px;
  overflow:auto;
  font-family:monospace;
}

</style>
</head>

<body>

<div class="header">
🤖 GeminiTok AI DEBUG
</div>

<div
class="chat"
id="chat">
</div>

<div class="input-area">

  <input
    type="text"
    id="input"
    placeholder="Ketik pesan..."
  >

  <button onclick="kirim()">
    Kirim
  </button>

</div>

<div
class="debug"
id="debug">
DEBUG LOG...
</div>

<script>

/* ================= CONFIG ================= */

const GEMINI_API =
"https://geminitok-api.linkd1146.workers.dev/";

/* ================= ELEMENT ================= */

const chat =
document.getElementById("chat");

const input =
document.getElementById("input");

const debug =
document.getElementById("debug");

/* ================= DEBUG ================= */

function logDebug(text){

  console.log(text);

  debug.innerHTML +=
  "<br>" + text;

  debug.scrollTop =
  debug.scrollHeight;
}

/* ================= MESSAGE ================= */

function tambahPesan(text,type){

  const div =
  document.createElement("div");

  div.className =
  "message " + type;

  if(type==="bot"){

    div.innerHTML =
    marked.parse(text);

  }else{

    div.innerText =
    text;
  }

  chat.appendChild(div);

  chat.scrollTop =
  chat.scrollHeight;
}

/* ================= GEMINI ================= */

async function askGemini(prompt){

  try{

    logDebug(
      "📡 Menghubungi API..."
    );

    const response =
    await fetch(
      GEMINI_API,
      {
        method:"POST",

        headers:{
          "Content-Type":
          "application/json"
        },

        body:JSON.stringify({
          prompt:prompt
        })
      }
    );

    logDebug(
      "✅ STATUS: " +
      response.status
    );

    logDebug(
      "✅ STATUS TEXT: " +
      response.statusText
    );

    const raw =
    await response.text();

    logDebug(
      "📦 RAW RESPONSE:"
    );

    logDebug(raw);

    if(!response.ok){

      return `
# ❌ API ERROR

Status:
${response.status}

Response:
${raw}
`;
    }

    let data;

    try{

      data =
      JSON.parse(raw);

      logDebug(
        "✅ JSON VALID"
      );

    }catch(err){

      logDebug(
        "❌ JSON ERROR"
      );

      logDebug(err);

      return raw;
    }

    const hasil =

      data.answer ||

      data.response ||

      data.text ||

      data.reply ||

      data.message ||

      data.result ||

      data?.candidates?.[0]
      ?.content?.parts?.[0]
      ?.text ||

      null;

    if(!hasil){

      return `
# ❌ RESPONSE KOSONG

JSON diterima
tetapi field jawaban
tidak ditemukan.
`;
    }

    return hasil;

  }catch(err){

    logDebug(
      "❌ FETCH ERROR:"
    );

    logDebug(err);

    return `
# ❌ FETCH ERROR

${err}

Kemungkinan:
- CORS
- Worker mati
- URL salah
- Internet error
`;
  }
}

/* ================= AI ================= */

async function AIResponse(text){

  const hasil =
  await askGemini(text);

  return `
# 🤖 AI RESPONSE

${hasil}
`;
}

/* ================= SEND ================= */

async function kirim(){

  const text =
  input.value.trim();

  if(!text) return;

  tambahPesan(
    text,
    "user"
  );

  input.value = "";

  const typing =
  document.createElement("div");

  typing.className =
  "message bot";

  typing.innerText =
  "🤖 AI sedang berpikir...";

  chat.appendChild(typing);

  chat.scrollTop =
  chat.scrollHeight;

  const jawaban =
  await AIResponse(text);

  typing.remove();

  tambahPesan(
    jawaban,
    "bot"
  );
}

/* ================= ENTER ================= */

input.addEventListener(
"keydown",
function(e){

  if(e.key==="Enter"){

    e.preventDefault();

    kirim();
  }
});

/* ================= LOAD ================= */

window.onload = ()=>{

  tambahPesan(
`
# 👋 DEBUG MODE

Ketik pesan untuk test API.

Lihat log debug di bawah.
`,
"bot"
);
};

</script>

</body>
</html>
```
