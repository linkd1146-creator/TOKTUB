<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GeminiTok AI</title>

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#0f0f0f;
  color:white;
  display:flex;
  flex-direction:column;
  height:100vh;
}
.header{
  background:#111;
  padding:12px 16px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid #222;
  box-shadow:0 0 15px #2b6cff33;
}
.header span{
  cursor:pointer;
  font-size:18px;
  margin-left:12px;
}
.chat{
  flex:1;
  overflow-y:auto;
  padding:20px;
  display:flex;
  flex-direction:column;
  gap:14px;
}
.message{
  padding:12px 16px;
  border-radius:16px;
  max-width:75%;
  white-space:pre-line;
}
.user{background:#2b6cff;align-self:flex-end;}
.bot{background:#1e1e1e;border:1px solid #2b6cff33;}
.typing{opacity:0.6;font-style:italic;}
.input-area{
  display:flex;
  padding:12px;
  background:#111;
}
input{
  flex:1;
  padding:12px;
  border:none;
  border-radius:12px;
  background:#1e1e1e;
  color:white;
}
button{
  margin-left:8px;
  padding:12px 16px;
  border:none;
  border-radius:12px;
  background:#2b6cff;
  color:white;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="header">
  <div>🤖 GeminiTok AI</div>
  <div>
    <span onclick="setMode('genius')">🧠</span>
    <span onclick="setMode('pelajar')">🎓</span>
    <span onclick="setMode('ceo')">💼</span>
    <span onclick="setMode('debat')">⚔️</span>
    <span onclick="setMode('opini')">💡</span>
    <span onclick="startVoice()">🎤</span>
    <span onclick="toggleVoice()">🔊</span>
    <span onclick="resetChat()">🔄</span>
  </div>
</div>

<div class="chat" id="chat"></div>

<div class="input-area">
  <input type="text" id="input" placeholder="Ketik pesan..." onkeydown="if(event.key==='Enter') kirim()">
  <button onclick="kirim()">Kirim</button>
</div>

<script>
const chat=document.getElementById("chat");
let history=JSON.parse(localStorage.getItem("ultraHistory"))||[];
let voiceEnabled=true;
let aiMode="genius";

/* ================= MODE ================= */
function setMode(mode){
  aiMode=mode;
  alert("Mode: "+mode.toUpperCase());
}

/* ================= MEMORY ================= */
function saveMemory(){
  localStorage.setItem("ultraHistory",JSON.stringify(history));
}

/* ================= MESSAGE ================= */
function tambahPesan(text,type){
  const div=document.createElement("div");
  div.className="message "+type;
  div.innerText=text;
  chat.appendChild(div);
  chat.scrollTop=chat.scrollHeight;
  if(type==="bot") speak(text);
}

/* ================= VOICE ================= */
function toggleVoice(){voiceEnabled=!voiceEnabled;}

function speak(text){
  if(!voiceEnabled||!window.speechSynthesis) return;
  const u=new SpeechSynthesisUtterance(text);
  u.lang="id-ID";
  speechSynthesis.speak(u);
}

function startVoice(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR)return;
  const r=new SR();
  r.lang="id-ID";
  r.start();
  r.onresult=e=>{
    document.getElementById("input").value=e.results[0][0].transcript;
  };
}

/* ================= INTENT DETECTION ================= */
function detectIntent(text){
  const lower=text.toLowerCase();

  if(["halo","hai","hi","hello","pagi","malam","assalamualaikum"].includes(lower))
    return "greeting";

  if(lower.includes("sedih")||lower.includes("capek")||lower.includes("lelah"))
    return "emotion";

  if(text.trim().split(" ").length===1)
    return "keyword";

  if(lower.includes("?"))
    return "question";

  return "general";
}

/* ================= KNOWLEDGE ENGINE ================= */
function generateSmartAnswer(text){

  const lower=text.toLowerCase();

  if(lower.includes("politik"))
    return "Politik adalah sistem pengelolaan kekuasaan dalam suatu negara. Ia menentukan kebijakan publik, hukum, dan arah pembangunan masyarakat.";

  if(lower.includes("ai"))
    return "AI adalah teknologi yang memungkinkan mesin belajar dari data dan mengambil keputusan seperti manusia. Digunakan di bisnis, kesehatan, dan media sosial.";

  if(lower.includes("bisnis"))
    return "Bisnis adalah proses menciptakan nilai melalui produk atau jasa dengan tujuan mendapatkan keuntungan dan pertumbuhan.";

  if(lower.includes("cinta"))
    return "Cinta adalah kombinasi emosi, komitmen, dan rasa saling peduli. Hubungan sehat dibangun lewat komunikasi dan kepercayaan.";

  if(lower.includes("bagaimana cara"))
    return "Langkah awalnya adalah memahami tujuan, lalu membuat strategi bertahap dan konsisten dalam eksekusinya.";

  if(lower.includes("kenapa"))
    return "Biasanya hal itu terjadi karena kombinasi faktor internal dan eksternal yang saling mempengaruhi.";

  return "Topik itu menarik dan bisa dilihat dari berbagai sudut pandang. Jika kamu beri detail tambahan, aku bisa jelaskan lebih spesifik.";
}

/* ================= FORMAT MODE ================= */
function formatAnswer(text){

  if(aiMode==="pelajar")
    return "📘 Penjelasan:\n\n"+text;

  if(aiMode==="ceo")
    return "💼 Insight Strategis:\n\n"+text+"\n\n👉 Fokus pada eksekusi nyata.";

  if(aiMode==="debat")
    return "⚔️ Perspektif Utama:\n"+text+"\n\n⚖️ Perspektif Lain:\nBisa berbeda tergantung konteks sosial dan budaya.";

  if(aiMode==="opini")
    return "💡 Opini:\n"+text+"\n\nTopik ini relevan dengan perkembangan zaman.";

  return text;
}

/* ================= SMART REPLY ================= */
async function smartReply(text){

  let intent=detectIntent(text);

  if(intent==="greeting"){
    if(text.toLowerCase()==="assalamualaikum")
      return "Waalaikumsalam 🤍 Semoga harimu berkah.";
    return "Halo juga 👋 Ada yang ingin kamu bahas?";
  }

  if(intent==="emotion"){
    return "Aku bisa merasakan itu berat ya 😔 Kalau mau cerita lebih dalam, aku siap dengar.";
  }

  let baseAnswer=generateSmartAnswer(text);

  return formatAnswer(baseAnswer);
}

/* ================= SEND ================= */
async function kirim(){
  const input=document.getElementById("input");
  const teks=input.value.trim();
  if(!teks)return;

  tambahPesan(teks,"user");
  history.push({role:"user",text:teks});
  saveMemory();
  input.value="";

  const typing=document.createElement("div");
  typing.className="message bot typing";
  typing.innerText="GeminiTok AI menganalisis...";
  chat.appendChild(typing);
  chat.scrollTop=chat.scrollHeight;

  let final=await smartReply(teks);

  typing.remove();
  history.push({role:"bot",text:final});
  saveMemory();
  tambahPesan(final,"bot");
}

/* ================= RESET ================= */
function resetChat(){
  localStorage.clear();
  location.reload();
}

/* ================= LOAD ================= */
window.onload=function(){
  if(history.length>0){
    history.forEach(h=>tambahPesan(h.text,h.role==="user"?"user":"bot"));
  }else{
    tambahPesan("Halo 👋 Aku GeminiTok AI.\nTanya apa saja, aku jawab.","bot");
  }
};
</script>

</body>
</html>
