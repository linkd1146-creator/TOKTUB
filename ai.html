<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GeminiTok AI PRO MAX</title>

<style>
body{
  margin:0;
  background:#000;
  font-family:Arial, sans-serif;
  color:white;
}

.header{
  text-align:center;
  padding:15px;
  font-size:20px;
  background:#0a0a0a;
  box-shadow:0 0 15px #2b6cff;
}

.chat-container{
  max-width:700px;
  margin:auto;
  display:flex;
  flex-direction:column;
  height:90vh;
}

.chat-box{
  flex:1;
  overflow-y:auto;
  padding:20px;
  display:flex;
  flex-direction:column;
  gap:12px;
}

.message{
  padding:12px 16px;
  border-radius:18px;
  max-width:70%;
  animation:fadeIn 0.3s ease-in;
  line-height:1.4;
}

.user{
  align-self:flex-end;
  background:#2b6cff;
}

.bot{
  align-self:flex-start;
  background:#111;
  border:1px solid #2b6cff;
  box-shadow:0 0 10px #2b6cff;
}

.input-area{
  display:flex;
  padding:15px;
  background:#0a0a0a;
}

input{
  flex:1;
  padding:14px;
  border:none;
  border-radius:20px;
  outline:none;
}

button{
  margin-left:10px;
  padding:14px;
  border:none;
  border-radius:50%;
  cursor:pointer;
  font-size:16px;
  background:#2b6cff;
  color:white;
}

@keyframes fadeIn{
  from{opacity:0;}
  to{opacity:1;}
}
</style>
</head>
<body>

<div class="header">🤖 GeminiTok AI PRO MAX</div>

<div class="chat-container">
  <div class="chat-box" id="chatBox"></div>

  <div class="input-area">
    <input type="text" id="userInput" placeholder="Ketik pesan...">
    <button onclick="sendMessage()">➤</button>
  </div>
</div>

<script>

let chatBox = document.getElementById("chatBox");
let userName = localStorage.getItem("userName") || "";
let learnedData = JSON.parse(localStorage.getItem("learnedData") || "{}");
let chatHistory = JSON.parse(localStorage.getItem("chatHistory") || "[]");

function addMessage(text, type){
  let msg = document.createElement("div");
  msg.className = "message " + type;
  msg.innerText = text;
  chatBox.appendChild(msg);
  chatBox.scrollTop = chatBox.scrollHeight;

  chatHistory.push({type,text});
  localStorage.setItem("chatHistory", JSON.stringify(chatHistory));
}

function loadHistory(){
  chatHistory.forEach(m => addMessage(m.text,m.type));
}

function detectLang(text){
  return /^[a-zA-Z0-9 ?!.,]+$/.test(text) ? "en" : "id";
}

async function autoTranslate(text){
  let target = detectLang(text) === "en" ? "id" : "en";
  try{
    let res = await fetch("https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl="+target+"&dt=t&q="+encodeURIComponent(text));
    let data = await res.json();
    return data[0][0][0];
  }catch{
    return text;
  }
}

function learn(question, answer){
  learnedData[question] = answer;
  localStorage.setItem("learnedData", JSON.stringify(learnedData));
}

async function smartReply(text){

  if(learnedData[text]) return learnedData[text];

  if(!userName){
    if(text.toLowerCase().includes("nama saya")){
      userName = text.replace("nama saya","").trim();
      localStorage.setItem("userName", userName);
      return "Senang kenal " + userName + " 😎";
    }
    return "Halo 👋 Siapa nama kamu?";
  }

  if(text.toLowerCase().includes("minitok")){
    return "MiniTok.fun adalah platform video pendek & AI modern 🚀";
  }

  if(text.toLowerCase().includes("ajar")){
    return "Oke 😎 ajarkan saya jawabannya dengan format: belajar: pertanyaan = jawaban";
  }

  if(text.toLowerCase().startsWith("belajar:")){
    let data = text.replace("belajar:","").split("=");
    if(data.length===2){
      learn(data[0].trim(), data[1].trim());
      return "Saya sudah belajar sesuatu yang baru 🧠🔥";
    }
  }

  let translated = await autoTranslate(text);
  return "Menarik 🤔 Dalam bahasa lain: " + translated;
}

async function sendMessage(){
  let input = document.getElementById("userInput");
  let text = input.value;
  if(!text) return;

  addMessage(text,"user");
  input.value="";

  let reply = await smartReply(text);
  addMessage(reply,"bot");
}

loadHistory();

</script>

</body>
</html>
