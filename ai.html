<script>

/* ================= CONFIG ================= */

const GEMINI_API =
"https://geminitok-api.linkd1146.workers.dev/";

/* ================= ELEMENT ================= */

const chat =
document.getElementById("chat");

const input =
document.getElementById("input");

/* ================= STORAGE ================= */

let history =
JSON.parse(
localStorage.getItem("ultraHistory")
) || [];

let voiceEnabled = true;

/* ================= SAVE ================= */

function saveAll(){

  localStorage.setItem(
    "ultraHistory",
    JSON.stringify(history)
  );
}

/* ================= MESSAGE ================= */

function tambahPesan(text,type){

  const div =
  document.createElement("div");

  div.className =
  "message " + type;

  if(type==="bot"){

    div.innerHTML =
    marked.parse(text);

  }else{

    div.innerText = text;
  }

  chat.appendChild(div);

  chat.scrollTop =
  chat.scrollHeight;

  setTimeout(()=>{

    document
    .querySelectorAll("pre code")
    .forEach(el=>{

      hljs.highlightElement(el);

    });

  },50);

  if(type==="bot"){

    speak(
      div.innerText.substring(0,300)
    );
  }
}

/* ================= SPEAK ================= */

function speak(text){

  if(!voiceEnabled) return;

  if(!window.speechSynthesis) return;

  speechSynthesis.cancel();

  const utter =
  new SpeechSynthesisUtterance(text);

  utter.lang = "id-ID";

  utter.rate = 1;

  speechSynthesis.speak(utter);
}

/* ================= TOGGLE VOICE ================= */

function toggleVoice(){

  voiceEnabled = !voiceEnabled;

  tambahPesan(
    voiceEnabled
    ? "🔊 Voice aktif"
    : "🔇 Voice mati",
    "bot"
  );
}

/* ================= READ INPUT ================= */

function readCurrentText(){

  const text =
  input.value.trim();

  if(!text){

    tambahPesan(
      "⚠️ Masukkan teks dulu",
      "bot"
    );

    return;
  }

  speak(text);

  tambahPesan(
    "📖 Membacakan:\n\n" + text,
    "bot"
  );
}

/* ================= VOICE INPUT ================= */

function startVoice(){

  const SR =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if(!SR){

    tambahPesan(
      "❌ Browser tidak support voice",
      "bot"
    );

    return;
  }

  const recog =
  new SR();

  recog.lang = "id-ID";

  recog.start();

  recog.onresult = (e)=>{

    input.value =
    e.results[0][0].transcript;
  };

  recog.onerror = (e)=>{

    tambahPesan(
      "❌ Voice Error: " +
      e.error,
      "bot"
    );
  };
}

/* ================= GEMINI ================= */

async function askGemini(prompt){

  try{

    const response =
    await fetch(
      GEMINI_API,
      {
        method:"POST",

        headers:{
          "Content-Type":"application/json"
        },

        body:JSON.stringify({
          prompt:prompt
        })
      }
    );

    /* ===== RESPONSE TEXT ===== */

    const text =
    await response.text();

    console.log(
      "RAW GEMINI:",
      text
    );

    /* ===== JSON PARSE ===== */

    let data;

    try{

      data =
      JSON.parse(text);

    }catch{

      /* kalau bukan json */

      if(
        text &&
        text.length > 3
      ){

        return text;
      }

      return null;
    }

    /* ===== FORMAT RESPONSE ===== */

    return (

      data.answer ||

      data.response ||

      data.text ||

      data.result ||

      data.message ||

      data.reply ||

      data.content ||

      data?.candidates?.[0]
      ?.content?.parts?.[0]
      ?.text ||

      data?.choices?.[0]
      ?.message?.content ||

      null
    );

  }catch(err){

    console.log(
      "Gemini Error:",
      err
    );

    return null;
  }
}

/* ================= WIKIPEDIA ================= */

async function searchWikipedia(query){

  try{

    const url =
    "https://id.wikipedia.org/api/rest_v1/page/summary/" +
    encodeURIComponent(query);

    const res =
    await fetch(url);

    if(!res.ok) return null;

    const data =
    await res.json();

    if(data.extract){

      return `
# 📚 Wikipedia

${data.extract}
`;
    }

    return null;

  }catch(err){

    console.log(err);

    return null;
  }
}

/* ================= DDG ================= */

async function searchDuck(query){

  try{

    const url =
    "https://api.duckduckgo.com/?q=" +
    encodeURIComponent(query) +
    "&format=json&no_html=1";

    const res =
    await fetch(url);

    if(!res.ok) return null;

    const data =
    await res.json();

    const hasil =

      data.AbstractText ||

      data.Answer ||

      data.RelatedTopics?.[0]?.Text ||

      null;

    if(hasil){

      return `
# 🌐 DuckDuckGo

${hasil}
`;
    }

    return null;

  }catch(err){

    console.log(err);

    return null;
  }
}

/* ================= AI ================= */

async function AIResponse(userText){

  const lower =
  userText.toLowerCase();

  /* ===== BACA ===== */

  if(
    lower.startsWith("bacakan ")
  ){

    const isi =
    userText.replace(
      /^bacakan\s+/i,
      ""
    );

    speak(isi);

    return `
# 🔊 Membacakan

${isi}
`;
  }

  /* ===== WIKI ===== */

  if(
    lower.startsWith("wiki ")
  ){

    const q =
    userText.replace(
      /^wiki\s+/i,
      ""
    );

    const wiki =
    await searchWikipedia(q);

    if(wiki) return wiki;
  }

  /* ===== CARI ===== */

  if(
    lower.startsWith("cari ")
  ){

    const q =
    userText.replace(
      /^cari\s+/i,
      ""
    );

    const ddg =
    await searchDuck(q);

    if(ddg) return ddg;
  }

  /* ===== GEMINI ===== */

  const gemini =
  await askGemini(userText);

  if(
    gemini &&
    gemini.length > 1
  ){

    return `
# 🤖 Gemini AI

${gemini}
`;
  }

  /* ===== WIKI FALLBACK ===== */

  const wiki =
  await searchWikipedia(userText);

  if(wiki){

    return wiki;
  }

  /* ===== DDG FALLBACK ===== */

  const ddg =
  await searchDuck(userText);

  if(ddg){

    return ddg;
  }

  /* ===== FINAL ===== */

  return `
# ❌ Tidak Ada Jawaban

Kemungkinan:
- Gemini worker error
- API diblokir browser
- Pertanyaan terlalu umum

Coba:
- "wiki Indonesia"
- "cari berita AI"
`;
}

/* ================= SEND ================= */

async function kirim(){

  const text =
  input.value.trim();

  if(!text) return;

  tambahPesan(
    text,
    "user"
  );

  history.push({
    role:"user",
    text:text
  });

  saveAll();

  input.value = "";

  const typing =
  document.createElement("div");

  typing.className =
  "message bot typing";

  typing.innerText =
  "🤖 AI sedang berpikir...";

  chat.appendChild(typing);

  chat.scrollTop =
  chat.scrollHeight;

  /* ===== RESPONSE ===== */

  const jawaban =
  await AIResponse(text);

  typing.remove();

  history.push({
    role:"bot",
    text:jawaban
  });

  saveAll();

  tambahPesan(
    jawaban,
    "bot"
  );
}

/* ================= EXPORT ================= */

function exportChat(){

  let isi = "";

  history.forEach(h=>{

    isi +=
    h.role.toUpperCase() +
    ":\n" +
    h.text +
    "\n\n";
  });

  const blob =
  new Blob(
    [isi],
    {type:"text/plain"}
  );

  const a =
  document.createElement("a");

  a.href =
  URL.createObjectURL(blob);

  a.download =
  "GeminiTok_Chat.txt";

  a.click();
}

/* ================= RESET ================= */

function resetChat(){

  if(confirm(
    "Hapus semua chat?"
  )){

    localStorage.clear();

    location.reload();
  }
}

/* ================= CLOCK ================= */

setInterval(()=>{

  document
  .getElementById("clock")
  .innerText =
  new Date()
  .toLocaleTimeString();

},1000);

/* ================= ENTER ================= */

input.addEventListener(
"keydown",
function(e){

  if(
    e.key === "Enter"
  ){

    e.preventDefault();

    kirim();
  }
});

/* ================= LOAD ================= */

window.onload = ()=>{

  tambahPesan(
`
# 👋 Halo

Aku adalah GeminiTok AI Ultra

`,
  "bot"
  );
};

</script>
