<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GeminiTok AI </title>

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#0f0f0f;
  color:white;
  display:flex;
  flex-direction:column;
  height:100vh;
}
.header{
  background:#111;
  padding:12px 16px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid #222;
  box-shadow:0 0 15px #2b6cff33;
}
.header span{
  cursor:pointer;
  font-size:18px;
  margin-left:12px;
}
.chat{
  flex:1;
  overflow-y:auto;
  padding:20px;
  display:flex;
  flex-direction:column;
  gap:14px;
}
.message{
  padding:12px 16px;
  border-radius:16px;
  max-width:75%;
  white-space:pre-line;
}
.user{background:#2b6cff;align-self:flex-end;}
.bot{background:#1e1e1e;border:1px solid #2b6cff33;}
.typing{opacity:0.6;font-style:italic;}
.input-area{
  display:flex;
  padding:12px;
  background:#111;
}
input{
  flex:1;
  padding:12px;
  border:none;
  border-radius:12px;
  background:#1e1e1e;
  color:white;
}
button{
  margin-left:8px;
  padding:12px 16px;
  border:none;
  border-radius:12px;
  background:#2b6cff;
  color:white;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="header">
  <div>🤖 GeminiTok AI ULTRA</div>
  <div>
    <span onclick="setMode('genius')">🧠</span>
    <span onclick="setMode('pelajar')">🎓</span>
    <span onclick="setMode('ceo')">💼</span>
    <span onclick="setMode('debat')">⚔️</span>
    <span onclick="setMode('opini')">💡</span>
    <span onclick="startVoice()">🎤</span>
    <span onclick="toggleVoice()">🔊</span>
    <span onclick="resetChat()">🔄</span>
  </div>
</div>

<div class="chat" id="chat"></div>

<div class="input-area">
  <input type="text" id="input" placeholder="Ketik pesan..." onkeydown="if(event.key==='Enter') kirim()">
  <button onclick="kirim()">Kirim</button>
</div>

<script>
const chat=document.getElementById("chat");
let history=JSON.parse(localStorage.getItem("ultraHistory"))||[];
let voiceEnabled=true;
let aiMode="genius";

/* ================= MODE ================= */
function setMode(mode){
  aiMode=mode;
  alert("Mode: "+mode.toUpperCase());
}

/* ================= MEMORY ================= */
function saveMemory(){
  localStorage.setItem("ultraHistory",JSON.stringify(history));
}

/* ================= MESSAGE ================= */
function tambahPesan(text,type){
  const div=document.createElement("div");
  div.className="message "+type;
  div.innerText=text;
  chat.appendChild(div);
  chat.scrollTop=chat.scrollHeight;
  if(type==="bot") speak(text);
}

/* ================= VOICE ================= */
function toggleVoice(){voiceEnabled=!voiceEnabled;}
function speak(text){
  if(!voiceEnabled||!window.speechSynthesis) return;
  const u=new SpeechSynthesisUtterance(text);
  u.lang="id-ID";
  speechSynthesis.speak(u);
}
function startVoice(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR)return;
  const r=new SR();
  r.lang="id-ID";
  r.start();
  r.onresult=e=>{
    document.getElementById("input").value=e.results[0][0].transcript;
  };
}

/* ================= MULTI SOURCE ================= */
async function searchInternet(q){
  let results=[];
  try{
    let r=await fetch("https://id.wikipedia.org/api/rest_v1/page/summary/"+encodeURIComponent(q));
    if(r.ok){let d=await r.json();if(d.extract)results.push(d.extract);}
  }catch{}
  try{
    let r=await fetch("https://en.wikipedia.org/api/rest_v1/page/summary/"+encodeURIComponent(q));
    if(r.ok){let d=await r.json();if(d.extract)results.push(d.extract);}
  }catch{}
  try{
    let r=await fetch("https://api.duckduckgo.com/?q="+encodeURIComponent(q)+"&format=json&no_redirect=1");
    let d=await r.json();
    if(d.Abstract)results.push(d.Abstract);
  }catch{}
  if(results.length===0) return null;
  results.sort((a,b)=>b.length-a.length);
  return results[0];
}

/* ================= FORMAT MODE ================= */
function formatAnswer(text,query){

  let reasoning="🔍 Step-by-step reasoning:\n1. Memahami pertanyaan.\n2. Mengambil sumber terpercaya.\n3. Menyusun analisis.\n\n";

  let rekom="🚀 Rekomendasi Konten MiniTok:\n• Buat video edukasi tentang '"+query+"'\n• Gunakan hook 3 detik pertama\n• Tambahkan CTA follow\n\n";

  if(aiMode==="pelajar"){
    return "📘 Penjelasan Guru:\n\n"+text+"\n\n📌 Kesimpulan:\nTopik ini penting dipahami secara bertahap.\n\n"+rekom;
  }

  if(aiMode==="ceo"){
    return "💼 Strategic Insight:\n\n"+text+"\n\n📊 Action Plan:\n• Identifikasi peluang\n• Eksekusi cepat\n• Optimasi performa\n\n"+rekom;
  }

  if(aiMode==="debat"){
    return "⚔️ Argumen Pro:\n"+text+"\n\n⚖️ Argumen Kontra:\nBeberapa pihak mungkin memiliki sudut pandang berbeda tergantung konteks.\n\n"+rekom;
  }

  if(aiMode==="opini"){
    return "💡 Opini AI:\n"+text+"\n\nMenurut analisis, topik ini sangat relevan dengan perkembangan digital saat ini.\n\n"+rekom;
  }

  return reasoning+"🧠 Genius Analysis:\n\n"+text+"\n\n"+rekom;
}

/* ================= SEND ================= */
async function kirim(){
  const input=document.getElementById("input");
  const teks=input.value.trim();
  if(!teks)return;

  tambahPesan(teks,"user");
  history.push({role:"user",text:teks});
  saveMemory();
  input.value="";

  const typing=document.createElement("div");
  typing.className="message bot typing";
  typing.innerText="GeminiTok ULTRA sedang berpikir...";
  chat.appendChild(typing);
  chat.scrollTop=chat.scrollHeight;

  let result=await searchInternet(teks);
  typing.remove();

  if(!result){
    tambahPesan("⚠️ Tidak ditemukan hasil relevan.","bot");
    return;
  }

  // Memory context (ringkas 3 percakapan terakhir)
  let context="";
  history.slice(-3).forEach(h=>context+=h.text+" | ");

  let final=formatAnswer(result+"\n\n🧠 Konteks sebelumnya: "+context,teks);

  history.push({role:"bot",text:final});
  saveMemory();
  tambahPesan(final,"bot");
}

/* ================= RESET ================= */
function resetChat(){
  localStorage.clear();
  location.reload();
}

/* ================= LOAD ================= */
window.onload=function(){
  if(history.length>0){
    history.forEach(h=>tambahPesan(h.text,h.role==="user"?"user":"bot"));
  }else{
    tambahPesan("Halo 👋 Saya GeminiTok AI ULTRA.\nTanyakan apa saja — saya akan analisa dari internet secara mendalam.","bot");
  }
};
</script>

</body>
</html>
