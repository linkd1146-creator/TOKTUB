<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GeminiTok AI Ultra</title>

<!-- MARKDOWN -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<!-- HIGHLIGHT -->
<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css"
/>

<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:#0b0f19;
  color:white;
  font-family:Arial,sans-serif;
  height:100vh;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

/* ================= HEADER ================= */

.header{
  background:#111827;
  padding:14px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:
  1px solid rgba(255,255,255,.08);

  box-shadow:
  0 0 25px
  rgba(43,108,255,.25);
}

.logo{
  font-size:20px;
  font-weight:bold;
}

.menu{
  display:flex;
  gap:10px;
  align-items:center;
}

.menu span{
  background:#1e293b;
  padding:10px;
  border-radius:12px;
  cursor:pointer;
  transition:.2s;
}

.menu span:hover{
  background:#2b6cff;
  transform:scale(1.05);
}

#clock{
  font-size:12px;
  opacity:.7;
}

/* ================= CHAT ================= */

.chat{
  flex:1;
  overflow-y:auto;
  padding:20px;
  display:flex;
  flex-direction:column;
  gap:16px;
  scroll-behavior:smooth;

  background:
  radial-gradient(
    circle at top,
    rgba(43,108,255,.15),
    transparent 40%
  );
}

.chat::-webkit-scrollbar{
  width:6px;
}

.chat::-webkit-scrollbar-thumb{
  background:#2b6cff;
  border-radius:10px;
}

.message{
  padding:16px;
  border-radius:20px;
  max-width:85%;
  line-height:1.7;
  animation:fade .25s ease;
  white-space:pre-wrap;
}

.user{
  align-self:flex-end;

  background:
  linear-gradient(
    135deg,
    #2b6cff,
    #4d8dff
  );

  box-shadow:
  0 0 15px
  rgba(43,108,255,.3);
}

.bot{
  align-self:flex-start;

  background:#141b2d;

  border:
  1px solid rgba(255,255,255,.06);
}

.typing{
  opacity:.7;
  font-style:italic;
}

.typing::after{
  content:"...";
  animation:dots 1s infinite;
}

@keyframes dots{

  0%{content:".";}
  50%{content:"..";}
  100%{content:"...";}
}

@keyframes fade{

  from{
    opacity:0;
    transform:translateY(10px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }
}

/* ================= INPUT ================= */

.input-area{
  display:flex;
  gap:10px;
  padding:14px;
  background:#101624;
  border-top:
  1px solid rgba(255,255,255,.08);
}

input{
  flex:1;
  background:#1a2238;
  border:none;
  color:white;
  padding:15px;
  border-radius:16px;
  outline:none;
  font-size:15px;
}

button{
  background:#2b6cff;
  border:none;
  color:white;
  padding:14px 20px;
  border-radius:16px;
  cursor:pointer;
  font-weight:bold;
  transition:.2s;
}

button:hover{
  transform:scale(1.03);
}

/* ================= CODE ================= */

pre{
  background:#0d1117;
  padding:14px;
  border-radius:14px;
  overflow:auto;
  position:relative;
}

pre button{
  position:absolute;
  top:8px;
  right:8px;
  padding:5px 10px;
  font-size:12px;
}

/* ================= MOBILE ================= */

@media(max-width:700px){

  .message{
    max-width:100%;
    font-size:14px;
  }

  .header{
    flex-direction:column;
    align-items:flex-start;
    gap:10px;
  }

  .menu{
    width:100%;
    justify-content:center;
  }
}

</style>
</head>

<body>

<!-- ================= HEADER ================= -->

<div class="header">

  <div class="logo">
    🤖 GeminiTok AI Ultra
  </div>

  <div class="menu">

    <span onclick="startVoice()">🎤</span>

    <span onclick="toggleVoice()">🔊</span>

    <span onclick="readCurrentText()">📖</span>

    <span onclick="exportChat()">📄</span>

    <span onclick="resetChat()">🔄</span>

  </div>

  <div id="clock"></div>

</div>

<!-- ================= CHAT ================= -->

<div
class="chat"
id="chat">
</div>

<!-- ================= INPUT ================= -->

<div class="input-area">

  <input
    type="text"
    id="input"
    placeholder="Ketik pesan..."
  >

  <button onclick="kirim()">
    Kirim
  </button>

</div>

<script>

/* ================= CONFIG ================= */

const GEMINI_API =
"https://geminitok-api.linkd1146.workers.dev/";

/* ================= ELEMENT ================= */

const chat =
document.getElementById("chat");

const input =
document.getElementById("input");

/* ================= STORAGE ================= */

let history =
JSON.parse(
localStorage.getItem("ultraHistory")
) || [];

let voiceEnabled = true;

/* ================= SAVE ================= */

function saveAll(){

  localStorage.setItem(
    "ultraHistory",
    JSON.stringify(history)
  );
}

/* ================= MESSAGE ================= */

function tambahPesan(text,type){

  const div =
  document.createElement("div");

  div.className =
  "message " + type;

  if(type==="bot"){

    div.innerHTML =
    marked.parse(text);

  }else{

    div.innerText = text;
  }

  chat.appendChild(div);

  chat.scrollTop =
  chat.scrollHeight;

  setTimeout(()=>{

    document
    .querySelectorAll("pre code")
    .forEach(el=>{

      hljs.highlightElement(el);
    });

    document
    .querySelectorAll("pre")
    .forEach(pre=>{

      if(pre.querySelector("button"))
      return;

      const btn =
      document.createElement("button");

      btn.innerText = "Copy";

      btn.onclick = ()=>{

        navigator.clipboard.writeText(
          pre.innerText
        );

        btn.innerText = "Copied";

        setTimeout(()=>{
          btn.innerText = "Copy";
        },1500);
      };

      pre.prepend(btn);
    });

  },50);

  if(type==="bot"){
    speak(
      div.innerText.substring(0,300)
    );
  }
}

/* ================= VOICE ================= */

function toggleVoice(){

  voiceEnabled = !voiceEnabled;

  tambahPesan(
    voiceEnabled
    ? "🔊 Voice diaktifkan"
    : "🔇 Voice dimatikan",
    "bot"
  );
}

function speak(text){

  if(!voiceEnabled) return;

  if(!window.speechSynthesis) return;

  speechSynthesis.cancel();

  const utter =
  new SpeechSynthesisUtterance(text);

  utter.lang = "id-ID";

  utter.rate = 1;

  speechSynthesis.speak(utter);
}

function readCurrentText(){

  const teks =
  input.value.trim();

  if(!teks){

    alert(
      "Masukkan teks dulu"
    );

    return;
  }

  speak(teks);
}

/* ================= VOICE INPUT ================= */

function startVoice(){

  const SR =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if(!SR){

    alert(
      "Speech Recognition tidak didukung browser"
    );

    return;
  }

  const recog =
  new SR();

  recog.lang = "id-ID";

  recog.start();

  recog.onresult = (e)=>{

    input.value =
    e.results[0][0].transcript;
  };
}

/* ================= WIKIPEDIA ================= */

async function searchWikipedia(query){

  try{

    const url =
    "https://id.wikipedia.org/api/rest_v1/page/summary/" +
    encodeURIComponent(query);

    const res =
    await fetch(url);

    if(!res.ok) return null;

    const data =
    await res.json();

    if(data.extract){

      return `
# 📚 Wikipedia

${data.extract}
`;
    }

    return null;

  }catch(err){

    console.log(err);

    return null;
  }
}

/* ================= DUCKDUCKGO ================= */

async function searchDuckDuckGo(query){

  try{

    const url =
    "https://api.duckduckgo.com/?q=" +
    encodeURIComponent(query) +
    "&format=json&pretty=1";

    const res =
    await fetch(url);

    const data =
    await res.json();

    const hasil =
      data.AbstractText ||
      data.RelatedTopics?.[0]?.Text ||
      data.Answer ||
      null;

    if(hasil){

      return `
# 🌐 DuckDuckGo

${hasil}
`;
    }

    return null;

  }catch(err){

    console.log(err);

    return null;
  }
}

/* ================= GEMINI WORKER ================= */

async function askGemini(prompt){

  try{

    console.log("PROMPT:", prompt);

    const response =
    await fetch(
      WORKER_API,
      {
        method:"POST",

        headers:{
          "Content-Type":"application/json"
        },

        body:JSON.stringify({
          prompt:prompt
        })
      }
    );

    console.log("STATUS:", response.status);

    const data =
    await response.json();

    console.log("DATA:", data);

    if(data.answer){

      return data.answer;

    }

    if(data.error){

      return "❌ " + data.error;

    }

    return "❌ Tidak ada response";

  }catch(err){

    console.log("ERROR:", err);

    return "❌ Gagal koneksi";

  }

}

/* ================= AI ENGINE ================= */

async function AIResponse(userText){

  const lower =
  userText.toLowerCase();

  /* ===== WIKI COMMAND ===== */

  if(
    lower.startsWith("wiki ")
  ){

    const q =
    userText.replace(/^wiki\s+/i,"");

    const wiki =
    await searchWikipedia(q);

    if(wiki) return wiki;
  }

  /* ===== SEARCH COMMAND ===== */

  if(
    lower.startsWith("cari ")
  ){

    const q =
    userText.replace(/^cari\s+/i,"");

    const ddg =
    await searchDuckDuckGo(q);

    if(ddg) return ddg;
  }

  /* ===== GEMINI ===== */

  const gemini =
  await askGemini(userText);

  if(
    gemini &&
    gemini.length > 2
  ){

    return `
# 🤖 Gemini AI

${gemini}
`;
  }

  /* ===== FALLBACK WIKI ===== */

  const wikiFallback =
  await searchWikipedia(userText);

  if(wikiFallback){

    return wikiFallback;
  }

  /* ===== FALLBACK DDG ===== */

  const ddgFallback =
  await searchDuckDuckGo(userText);

  if(ddgFallback){

    return ddgFallback;
  }

  /* ===== DEFAULT ===== */

  return `
# ❌ Jawaban Tidak Ditemukan

Coba:
- gunakan pertanyaan lebih jelas
- gunakan "wiki topik"
- gunakan "cari berita"
`;
}

/* ================= SEND ================= */

async function kirim(){

  const teks =
  input.value.trim();

  if(!teks) return;

  tambahPesan(
    teks,
    "user"
  );

  history.push({
    role:"user",
    text:teks
  });

  saveAll();

  input.value = "";

  const typing =
  document.createElement("div");

  typing.className =
  "message bot typing";

  const loading = [

    "🤖 AI sedang berpikir...",
    "🧠 Menganalisis pertanyaan...",
    "🌐 Mengakses internet...",
    "⚡ Membuat jawaban terbaik..."

  ];

  typing.innerText =
  loading[
    Math.floor(
      Math.random() *
      loading.length
    )
  ];

  chat.appendChild(typing);

  chat.scrollTop =
  chat.scrollHeight;

  /* ===== RESPONSE ===== */

  const jawaban =
  await AIResponse(teks);

  typing.remove();

  history.push({
    role:"bot",
    text:jawaban
  });

  saveAll();

  tambahPesan(
    jawaban,
    "bot"
  );
}

/* ================= EXPORT ================= */

function exportChat(){

  let isi = "";

  history.forEach(h=>{

    isi +=
    h.role.toUpperCase() +
    ":\n" +
    h.text +
    "\n\n";
  });

  const blob =
  new Blob(
    [isi],
    {type:"text/plain"}
  );

  const a =
  document.createElement("a");

  a.href =
  URL.createObjectURL(blob);

  a.download =
  "GeminiTok_Chat.txt";

  a.click();
}

/* ================= RESET ================= */

function resetChat(){

  if(
    confirm(
      "Hapus semua chat?"
    )
  ){

    localStorage.clear();

    location.reload();
  }
}

/* ================= CLOCK ================= */

setInterval(()=>{

  const now =
  new Date();

  document
  .getElementById("clock")
  .innerText =
  now.toLocaleTimeString();

},1000);

/* ================= ENTER ================= */

input.addEventListener(
"keydown",
function(e){

  if(
    e.key === "Enter" &&
    !e.shiftKey
  ){

    e.preventDefault();

    kirim();
  }
});

/* ================= LOAD ================= */

window.onload = ()=>{

  if(history.length){

    history.forEach(h=>{

      tambahPesan(
        h.text,
        h.role==="user"
        ? "user"
        : "bot"
      );
    });

  }else{

    tambahPesan(
`
# 👋 Halo

Aku adalah **GeminiTok AI Ultra**

`,
      "bot"
    );
  }
};

</script>

</body>
</html>
