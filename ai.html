<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GeminiTok AI</title>

<style>
body{
  margin:0;
  background:black;
  font-family:Arial;
  color:white;
}

/* BOT ICON */
.bot-icon{
  position:fixed;
  bottom:20px;
  left:20px;
  width:60px;
  height:60px;
  background:#2b6cff;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:28px;
  cursor:pointer;
  z-index:9999;
}

/* AI PANEL */
.ai-panel{
  position:fixed;
  bottom:90px;
  left:20px;
  width:320px;
  height:450px;
  background:#111;
  border-radius:15px;
  display:none;
  flex-direction:column;
  overflow:hidden;
  z-index:9999;
}

/* HEADER */
.ai-header{
  display:flex;
  justify-content:space-between;
  padding:10px;
  background:#1a1a1a;
  font-weight:bold;
}

/* MODE */
.ai-mode{
  display:flex;
  gap:5px;
  padding:8px;
}

.ai-mode button{
  flex:1;
  padding:8px;
  border:none;
  border-radius:8px;
  background:#222;
  color:white;
  cursor:pointer;
}

.ai-mode button.active{
  background:#2b6cff;
}

/* CHAT */
.ai-chat{
  flex:1;
  overflow-y:auto;
  padding:10px;
}

.msg{
  padding:8px;
  margin:6px 0;
  border-radius:8px;
}

.user{background:#2b6cff;}
.ai{background:#222;}

/* INPUT */
.ai-input{
  display:flex;
  gap:5px;
  padding:8px;
  background:#1a1a1a;
}

.ai-input input{
  flex:1;
  padding:8px;
  border:none;
  border-radius:6px;
}

.ai-input button{
  padding:8px 10px;
  background:#2b6cff;
  border:none;
  border-radius:6px;
  color:white;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="bot-icon" onclick="toggleAI()">🤖</div>

<div class="ai-panel" id="aiPanel">

  <div class="ai-header">
    GeminiTok AI
    <span onclick="toggleAI()" style="cursor:pointer;">✖</span>
  </div>

  <div class="ai-mode">
    <button onclick="setMode('chat')" id="chatBtn">💬</button>
    <button onclick="setMode('voice')" id="voiceBtn">🎤</button>
  </div>

  <div class="ai-chat" id="chat"></div>

  <div class="ai-input">
    <input id="text" placeholder="Tulis pesan...">
    <button onclick="send()">Send</button>
  </div>

</div>

<script>

const API_KEY = "AIzaSyAyl3fLVXYtFfiUJZ-fglGKDoIpEjQFuV8";

function toggleAI(){
  const panel=document.getElementById("aiPanel");
  panel.style.display =
    panel.style.display==="flex"?"none":"flex";
}

function add(text,type){
  const div=document.createElement("div");
  div.className="msg "+type;
  div.innerText=text;
  const chat=document.getElementById("chat");
  chat.appendChild(div);
  chat.scrollTop=chat.scrollHeight;
}

async function send(){
  const input=document.getElementById("text");
  const text=input.value;
  if(!text) return;

  add(text,"user");
  input.value="";

  try{
    const res=await fetch(
      "https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key="+API_KEY,
      {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
          contents:[{
            role:"user",
            parts:[{text:text}]
          }]
        })
      }
    );

    const data=await res.json();

    const reply =
      data?.candidates?.[0]?.content?.parts?.[0]?.text
      || "No response";

    add(reply,"ai");

  }catch(e){
    add("Error koneksi AI","ai");
  }
}

function setMode(mode){
  document.getElementById("chatBtn").classList.remove("active");
  document.getElementById("voiceBtn").classList.remove("active");

  if(mode==="chat"){
    document.getElementById("chatBtn").classList.add("active");
  }else{
    document.getElementById("voiceBtn").classList.add("active");
    startVoice();
  }
}

function startVoice(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){
    alert("Voice tidak support browser ini");
    return;
  }

  const rec=new SR();
  rec.lang="id-ID";
  rec.start();

  rec.onresult=(e)=>{
    document.getElementById("text").value=
      e.results[0][0].transcript;
  };
}

setMode("chat");

</script>
</body>
</html>
