<style>

body{

<script>

/* ================= CONFIG ================= */

const GEMINI_API =
"https://geminitok-api.linkd1146.workers.dev/";

/* ================= ELEMENT ================= */

const chat =
document.getElementById("chat");

const input =
document.getElementById("input");

/* ================= STORAGE ================= */

let history =
JSON.parse(
localStorage.getItem("ultraHistory")
) || [];

let voiceEnabled = true;

/* ================= SAVE ================= */

function saveAll(){

  localStorage.setItem(
    "ultraHistory",
    JSON.stringify(history)
  );
}

/* ================= MESSAGE ================= */

function tambahPesan(text,type){

  const div =
  document.createElement("div");

  div.className =
  "message " + type;

  if(type==="bot"){

    div.innerHTML =
    marked.parse(text);

  }else{

    div.innerText = text;
  }

  chat.appendChild(div);

  chat.scrollTop =
  chat.scrollHeight;

  setTimeout(()=>{

    document
    .querySelectorAll("pre code")
    .forEach(el=>{

      hljs.highlightElement(el);
    });

  },50);

  if(type==="bot"){
    speak(
      div.innerText.substring(0,300)
    );
  }
}

/* ================= VOICE ================= */

function toggleVoice(){

  voiceEnabled = !voiceEnabled;

  tambahPesan(
    voiceEnabled
    ? "🔊 Voice diaktifkan"
    : "🔇 Voice dimatikan",
    "bot"
  );
}

function speak(text){

  if(!voiceEnabled) return;

  if(!window.speechSynthesis) return;

  speechSynthesis.cancel();

  const utter =
  new SpeechSynthesisUtterance(text);

  utter.lang = "id-ID";

  speechSynthesis.speak(utter);
}

/* ================= VOICE INPUT ================= */

function startVoice(){

  const SR =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if(!SR){

    alert(
      "Speech recognition tidak didukung browser"
    );

    return;
  }

  const recog = new SR();

  recog.lang = "id-ID";

  recog.start();

  recog.onresult = (e)=>{

    input.value =
    e.results[0][0].transcript;
  };
}

/* ================= WIKIPEDIA ================= */

async function searchWikipedia(query){

  try{

    const url =
    "https://id.wikipedia.org/api/rest_v1/page/summary/" +
    encodeURIComponent(query);

    const res =
    await fetch(url);

    if(!res.ok) return null;

    const data =
    await res.json();

    if(data.extract){

      return `
📚 Wikipedia

${data.extract}
`;
    }

    return null;

  }catch(err){

    console.log(err);

    return null;
  }
}

/* ================= DUCKDUCKGO ================= */

async function searchDuckDuckGo(query){

  try{

    const url =
    "https://api.duckduckgo.com/?q=" +
    encodeURIComponent(query) +
    "&format=json&pretty=1";

    const res =
    await fetch(url);

    const data =
    await res.json();

    const hasil =
      data.AbstractText ||
      data.RelatedTopics?.[0]?.Text ||
      data.Answer ||
      null;

    if(hasil){

      return `
🌐 DuckDuckGo

${hasil}
`;
    }

    return null;

  }catch(err){

    console.log(err);

    return null;
  }
}

/* ================= GEMINI WORKER ================= */

async function askGemini(prompt){

  try{

    const context =
    history
    .slice(-10)
    .map(h =>
      `${h.role}: ${h.text}`
    )
    .join("\n");

    const finalPrompt = `
Kamu adalah GeminiTok AI Ultra.

Jawab:
- natural
- lengkap
- bahasa Indonesia
- ramah
- pintar
- jangan kosong

Riwayat:
${context}

User:
${prompt}
`;

    const response =
    await fetch(
      GEMINI_API,
      {
        method:"POST",

        headers:{
          "Content-Type":"application/json"
        },

        body:JSON.stringify({
          prompt:finalPrompt
        })
      }
    );

    if(!response.ok){

      return null;
    }

    const data =
    await response.json();

    console.log(data);

    return (
      data.answer ||
      data.response ||
      data.text ||
      null
    );

  }catch(err){

    console.log(err);

    return null;
  }
}

/* ================= AI ENGINE ================= */

async function AIResponse(userText){

  const lower =
  userText.toLowerCase();

  /* ===== COMMAND ===== */

  if(
    lower.startsWith("wiki ")
  ){

    const q =
    userText.replace(/^wiki\s+/i,"");

    const wiki =
    await searchWikipedia(q);

    if(wiki) return wiki;
  }

  if(
    lower.startsWith("cari ")
  ){

    const q =
    userText.replace(/^cari\s+/i,"");

    const ddg =
    await searchDuckDuckGo(q);

    if(ddg) return ddg;
  }

  /* ================= TRY GEMINI ================= */

  const gemini =
  await askGemini(userText);

  if(
    gemini &&
    gemini.length > 3
  ){

    return `
🤖 Gemini AI

${gemini}
`;
  }

  /* ================= FALLBACK WIKIPEDIA ================= */

  const wikiFallback =
  await searchWikipedia(userText);

  if(wikiFallback){

    return wikiFallback;
  }

  /* ================= FALLBACK DUCKDUCKGO ================= */

  const ddgFallback =
  await searchDuckDuckGo(userText);

  if(ddgFallback){

    return ddgFallback;
  }

  /* ================= DEFAULT ================= */

  return `
❌ Maaf, jawaban tidak ditemukan.

Coba:
- gunakan kata yang lebih jelas
- gunakan "wiki nama"
- gunakan "cari topik"
`;
}

/* ================= SEND ================= */

async function kirim(){

  const teks =
  input.value.trim();

  if(!teks) return;

  tambahPesan(
    teks,
    "user"
  );

  history.push({
    role:"user",
    text:teks
  });

  saveAll();

  input.value = "";

  const typing =
  document.createElement("div");

  typing.className =
  "message bot typing";

  const loading = [
    "🤖 AI sedang berpikir...",
    "🧠 Menganalisis...",
    "🌐 Mengakses internet...",
    "⚡ Membuat jawaban..."
  ];

  typing.innerText =
  loading[
    Math.floor(
      Math.random() *
      loading.length
    )
  ];

  chat.appendChild(typing);

  chat.scrollTop =
  chat.scrollHeight;

  /* ================= GET RESPONSE ================= */

  const jawaban =
  await AIResponse(teks);

  typing.remove();

  history.push({
    role:"bot",
    text:jawaban
  });

  saveAll();

  tambahPesan(
    jawaban,
    "bot"
  );
}

/* ================= EXPORT ================= */

function exportChat(){

  let isi = "";

  history.forEach(h=>{

    isi +=
    h.role.toUpperCase() +
    ":\n" +
    h.text +
    "\n\n";
  });

  const blob =
  new Blob(
    [isi],
    {type:"text/plain"}
  );

  const a =
  document.createElement("a");

  a.href =
  URL.createObjectURL(blob);

  a.download =
  "GeminiTok_Chat.txt";

  a.click();
}

/* ================= RESET ================= */

function resetChat(){

  if(
    confirm(
      "Hapus semua chat?"
    )
  ){

    localStorage.clear();

    location.reload();
  }
}

/* ================= ENTER ================= */

input.addEventListener(
"keydown",
function(e){

  if(
    e.key === "Enter" &&
    !e.shiftKey
  ){

    e.preventDefault();

    kirim();
  }
});

/* ================= LOAD ================= */

window.onload = ()=>{

  if(history.length){

    history.forEach(h=>{

      tambahPesan(
        h.text,
        h.role==="user"
        ? "user"
        : "bot"
      );
    });

  }else{

    tambahPesan(
`
# 👋 Halo

Aku GeminiTok AI Ultra

Sumber AI:
- Gemini Worker API
- Wikipedia
- DuckDuckGo

Aku bisa:
- menjawab pertanyaan
- coding
- pengetahuan
- info internet
- voice AI
- markdown
`,
      "bot"
    );
  }
};

</script>
