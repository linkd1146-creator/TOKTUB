<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GeminiTok AI</title>
<a href="ai.html" class="ai-float">🤖</a>
<style>
body{
  margin:0;
  font-family:Arial;
  background:#000;
  color:white;
}

/* FLOATING PANEL */
.ai-panel{
  position:fixed;
  bottom:20px;
  left:20px;
  width:320px;
  height:450px;
  background:#111;
  border-radius:15px;
  box-shadow:0 0 15px rgba(0,0,0,0.6);
  display:flex;
  flex-direction:column;
  overflow:hidden;
  z-index:9999;
}

/* HEADER */
.header{
  display:flex;
  align-items:center;
  padding:10px;
  background:#1a1a1a;
  gap:10px;
  font-weight:bold;
}

/* MODE */
.mode{
  display:flex;
  gap:5px;
  padding:8px;
}

.mode button{
  flex:1;
  padding:8px;
  border:none;
  border-radius:8px;
  background:#222;
  color:white;
  cursor:pointer;
}

.mode button.active{
  background:#2b6cff;
}

/* CHAT AREA */
.chat{
  flex:1;
  overflow-y:auto;
  padding:10px;
  font-size:14px;
}

.msg{
  padding:8px;
  margin:6px 0;
  border-radius:8px;
}

.user{background:#2b6cff;}
.ai{background:#222;}

/* INPUT */
.input{
  display:flex;
  gap:5px;
  padding:8px;
  background:#1a1a1a;
}

.input input{
  flex:1;
  padding:8px;
  border:none;
  border-radius:6px;
}

.input button{
  padding:8px 10px;
  background:#2b6cff;
  border:none;
  border-radius:6px;
  color:white;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="ai-panel">

  <div class="header">
    🤖 GeminiTok AI
  </div>

  <div class="mode">
    <button onclick="setMode('chat')" id="chatBtn">💬 Chat</button>
    <button onclick="setMode('voice')" id="voiceBtn">🎤 Voice</button>
  </div>

  <div class="chat" id="chat"></div>

  <div class="input">
    <input id="text" placeholder="Tulis pesan...">
    <button onclick="send()">Send</button>
  </div>

</div>

<script>

const API_KEY = "AIzaSyAyl3fLVXYtFfiUJZ-fglGKDoIpEjQFuV8";

/* ADD MESSAGE */
function add(text,type){
  const div=document.createElement("div");
  div.className="msg "+type;
  div.innerText=text;
  document.getElementById("chat").appendChild(div);
  document.getElementById("chat").scrollTop=
  document.getElementById("chat").scrollHeight;
}

/* SEND CHAT */
async function send(){
  const input=document.getElementById("text");
  const text=input.value;
  if(!text) return;

  add(text,"user");
  input.value="";

  try{
    const res=await fetch(
      "https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key="+API_KEY,
      {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
          contents:[{
            role:"user",
            parts:[{text:"Jawab seperti ChatGPT. "+text}]
          }]
        })
      }
    );
