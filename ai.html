<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GeminiTok AI Ultra</title>

<!-- MARKDOWN -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<!-- HIGHLIGHT -->
<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css"
/>

<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:#0b1020;
  color:white;
  font-family:Arial,sans-serif;
  height:100vh;
  display:flex;
  flex-direction:column;
}

/* ================= HEADER ================= */

.header{
  background:#121a2e;
  padding:14px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid rgba(255,255,255,.08);
}

.logo{
  font-size:20px;
  font-weight:bold;
}

.menu{
  display:flex;
  gap:10px;
}

.menu span{
  background:#1e2a47;
  padding:10px;
  border-radius:10px;
  cursor:pointer;
  transition:.2s;
  user-select:none;
}

.menu span:hover{
  background:#2b6cff;
}

/* ================= CHAT ================= */

.chat{
  flex:1;
  overflow-y:auto;
  padding:20px;
  display:flex;
  flex-direction:column;
  gap:15px;
}

.message{
  padding:16px;
  border-radius:18px;
  line-height:1.7;
  max-width:85%;
  white-space:pre-wrap;
  word-wrap:break-word;
}

.user{
  align-self:flex-end;

  background:
  linear-gradient(
    135deg,
    #2b6cff,
    #4d8dff
  );
}

.bot{
  align-self:flex-start;
  background:#161f38;
}

.typing{
  opacity:.7;
  font-style:italic;
}

/* ================= INPUT ================= */

.input-area{
  display:flex;
  gap:10px;
  padding:14px;
  background:#101827;
}

input{
  flex:1;
  border:none;
  outline:none;
  background:#1c2742;
  color:white;
  padding:15px;
  border-radius:14px;
}

button{
  border:none;
  background:#2b6cff;
  color:white;
  padding:15px 20px;
  border-radius:14px;
  cursor:pointer;
  font-weight:bold;
}

/* ================= CODE ================= */

pre{
  background:#0d1117;
  padding:14px;
  border-radius:12px;
  overflow:auto;
}

@media(max-width:700px){

  .message{
    max-width:100%;
  }

  .header{
    flex-direction:column;
    gap:10px;
    align-items:flex-start;
  }
}

</style>
</head>

<body>

<!-- ================= HEADER ================= -->

<div class="header">

  <div class="logo">
    🤖 GeminiTok AI Ultra
  </div>

  <div class="menu">

    <span onclick="startVoice()">🎤</span>

    <span onclick="toggleVoice()">🔊</span>

    <span onclick="readInput()">📖</span>

    <span onclick="resetChat()">🔄</span>

  </div>

</div>

<!-- ================= CHAT ================= -->

<div
class="chat"
id="chat">
</div>

<!-- ================= INPUT ================= -->

<div class="input-area">

  <input
    type="text"
    id="input"
    placeholder="Ketik pesan..."
  >

  <button onclick="kirim()">
    Kirim
  </button>

</div>

<script>

/* ================= CONFIG ================= */

const GEMINI_API =
"https://geminitok-api.linkd1146.workers.dev/";

/* ================= ELEMENT ================= */

const chat =
document.getElementById("chat");

const input =
document.getElementById("input");

/* ================= STORAGE ================= */

let history =
JSON.parse(
localStorage.getItem("ultraHistory")
) || [];

let voiceEnabled = true;

/* ================= MESSAGE ================= */

function tambahPesan(text,type){

  const div =
  document.createElement("div");

  div.className =
  "message " + type;

  if(type==="bot"){

    div.innerHTML =
    marked.parse(text);

  }else{

    div.innerText = text;
  }

  chat.appendChild(div);

  chat.scrollTop =
  chat.scrollHeight;

  setTimeout(()=>{

    document
    .querySelectorAll("pre code")
    .forEach(el=>{

      hljs.highlightElement(el);
    });

  },50);

  if(type==="bot"){

    speak(
      div.innerText.substring(0,300)
    );
  }
}

/* ================= SPEAK ================= */

function speak(text){

  if(!voiceEnabled) return;

  if(!window.speechSynthesis)
  return;

  speechSynthesis.cancel();

  const utter =
  new SpeechSynthesisUtterance(text);

  utter.lang = "id-ID";

  speechSynthesis.speak(utter);
}

/* ================= READ INPUT ================= */

function readInput(){

  const text =
  input.value.trim();

  if(!text){

    tambahPesan(
      "⚠️ Masukkan teks dulu",
      "bot"
    );

    return;
  }

  speak(text);

  tambahPesan(
    "📖 Membacakan:\n\n" + text,
    "bot"
  );
}

/* ================= TOGGLE VOICE ================= */

function toggleVoice(){

  voiceEnabled = !voiceEnabled;

  tambahPesan(
    voiceEnabled
    ? "🔊 Voice aktif"
    : "🔇 Voice mati",
    "bot"
  );
}

/* ================= VOICE INPUT ================= */

function startVoice(){

  const SR =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if(!SR){

    tambahPesan(
      "❌ Browser tidak support voice",
      "bot"
    );

    return;
  }

  const recog =
  new SR();

  recog.lang = "id-ID";

  recog.start();

  recog.onresult = (e)=>{

    input.value =
    e.results[0][0].transcript;
  };
}

/* ================= GEMINI ================= */

async function askGemini(query){

  try{

    const res =
    await fetch(
      GEMINI_API,
      {
        method:"POST",

        headers:{
          "Content-Type":"application/json"
        },

        body:JSON.stringify({
          prompt:query
        })
      }
    );

    if(!res.ok)
    return null;

    const text =
    await res.text();

    let data;

    try{

      data =
      JSON.parse(text);

    }catch{

      return text;
    }

    return (

      data.answer ||
      data.response ||
      data.text ||
      data.result ||
      data.message ||

      data?.candidates?.[0]
      ?.content?.parts?.[0]
      ?.text ||

      null
    );

  }catch(err){

    console.log(err);

    return null;
  }
}

/* ================= WIKIPEDIA ================= */

async function askWikipedia(query){

  try{

    const url =
    "https://id.wikipedia.org/api/rest_v1/page/summary/" +
    encodeURIComponent(query);

    const res =
    await fetch(url);

    if(!res.ok)
    return null;

    const data =
    await res.json();

    return data.extract || null;

  }catch(err){

    console.log(err);

    return null;
  }
}

/* ================= DUCKDUCKGO ================= */

async function askDuck(query){

  try{

    const url =
    "https://api.duckduckgo.com/?q=" +
    encodeURIComponent(query) +
    "&format=json&no_html=1";

    const res =
    await fetch(url);

    if(!res.ok)
    return null;

    const data =
    await res.json();

    return (

      data.AbstractText ||
      data.Answer ||
      data.RelatedTopics?.[0]?.Text ||
      null
    );

  }catch(err){

    console.log(err);

    return null;
  }
}

/* ================= RANDOM INTERNET ================= */

async function randomInternet(query){

  const randomAnswers = [

`🌐 Aku tidak menemukan jawaban pasti, tetapi topik "${query}" sedang banyak dibahas di internet.`,

`🧠 Berdasarkan data internet, "${query}" memiliki banyak informasi menarik untuk dipelajari.`,

`📡 Sistem AI tidak menemukan jawaban langsung, namun "${query}" kemungkinan berkaitan dengan teknologi, pengetahuan, atau berita terbaru.`,

`⚡ Jawaban otomatis internet:\n\n${query} adalah topik yang cukup populer saat ini.`,

`🤖 Semua sumber gagal dijangkau.\nTetapi AI tetap mencoba menjawab:\n\n${query} kemungkinan memiliki informasi terbaru di web.`
  ];

  return randomAnswers[
    Math.floor(
      Math.random() *
      randomAnswers.length
    )
  ];
}

/* ================= AI ENGINE ================= */

async function AIResponse(query){

  /* ===== COMMAND BACA ===== */

  if(
    query.toLowerCase()
    .startsWith("bacakan ")
  ){

    const isi =
    query.replace(
      /^bacakan\s+/i,
      ""
    );

    speak(isi);

    return `
# 🔊 Membacakan

${isi}
`;
  }

  /* ================= PRIORITAS GEMINI ================= */

  let answer =
  await askGemini(query);

  if(answer){

    return `
# 🤖 Gemini AI

${answer}
`;
  }

  /* ================= FALLBACK WIKIPEDIA ================= */

  answer =
  await askWikipedia(query);

  if(answer){

    return `
# 📚 Wikipedia

${answer}
`;
  }

  /* ================= FALLBACK DDG ================= */

  answer =
  await askDuck(query);

  if(answer){

    return `
# 🌐 DuckDuckGo

${answer}
`;
  }

  /* ================= RETRY GEMINI ================= */

  answer =
  await askGemini(
    "Jawab singkat: " + query
  );

  if(answer){

    return `
# 🤖 Gemini Retry

${answer}
`;
  }

  /* ================= RETRY DDG ================= */

  answer =
  await askDuck(
    query + " terbaru"
  );

  if(answer){

    return `
# 🌐 DuckDuckGo Retry

${answer}
`;
  }

  /* ================= RANDOM INTERNET ================= */

  return await randomInternet(query);
}

/* ================= SEND ================= */

async function kirim(){

  const text =
  input.value.trim();

  if(!text) return;

  tambahPesan(
    text,
    "user"
  );

  history.push({
    role:"user",
    text:text
  });

  localStorage.setItem(
    "ultraHistory",
    JSON.stringify(history)
  );

  input.value = "";

  const typing =
  document.createElement("div");

  typing.className =
  "message bot typing";

  typing.innerText =
  "🤖 AI sedang berpikir...";

  chat.appendChild(typing);

  chat.scrollTop =
  chat.scrollHeight;

  /* ===== RESPONSE ===== */

  const jawaban =
  await AIResponse(text);

  typing.remove();

  history.push({
    role:"bot",
    text:jawaban
  });

  localStorage.setItem(
    "ultraHistory",
    JSON.stringify(history)
  );

  tambahPesan(
    jawaban,
    "bot"
  );
}

/* ================= RESET ================= */

function resetChat(){

  localStorage.clear();

  location.reload();
}

/* ================= ENTER ================= */

input.addEventListener(
"keydown",
function(e){

  if(e.key==="Enter"){

    e.preventDefault();

    kirim();
  }
});

/* ================= LOAD ================= */

window.onload = ()=>{

  if(history.length){

    history.forEach(h=>{

      tambahPesan(
        h.text,
        h.role==="user"
        ? "user"
        : "bot"
      );
    });

  }else{

    tambahPesan(
`
# 👋 Halo

Aku adalah GeminiTok AI Ultra

`,
    "bot"
    );
  }
};

</script>

</body>
</html>
