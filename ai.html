<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GeminiTok AI Ultra</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:#0f0f0f;
  color:white;
  font-family:Arial,sans-serif;
  height:100vh;
  display:flex;
  flex-direction:column;
}

.header{
  background:#111;
  padding:14px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid #222;
  box-shadow:0 0 15px rgba(43,108,255,.2);
}

.logo{
  font-size:18px;
  font-weight:bold;
}

.menu{
  display:flex;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
}

.menu span{
  cursor:pointer;
  background:#1e1e1e;
  padding:8px;
  border-radius:10px;
}

.chat{
  flex:1;
  overflow-y:auto;
  padding:20px;
  display:flex;
  flex-direction:column;
  gap:14px;
}

.message{
  padding:14px;
  border-radius:18px;
  max-width:80%;
  white-space:pre-line;
  line-height:1.5;
}

.user{
  background:#2b6cff;
  align-self:flex-end;
}

.bot{
  background:#1a1a1a;
  border:1px solid rgba(43,108,255,.2);
  align-self:flex-start;
}

.typing{
  opacity:.6;
  font-style:italic;
}

.input-area{
  display:flex;
  gap:10px;
  padding:12px;
  background:#111;
  border-top:1px solid #222;
}

input{
  flex:1;
  background:#1e1e1e;
  border:none;
  color:white;
  padding:14px;
  border-radius:14px;
  outline:none;
}

button{
  background:#2b6cff;
  border:none;
  color:white;
  padding:14px 18px;
  border-radius:14px;
  cursor:pointer;
  font-weight:bold;
}

button:hover{
  opacity:.9;
}

@media(max-width:700px){

  .message{
    max-width:100%;
  }

  .header{
    flex-direction:column;
    align-items:flex-start;
    gap:10px;
  }
}

</style>
</head>

<body>

<div class="header">

  <div class="logo">🤖 GeminiTok AI Ultra</div>

  <div class="menu">

    <span onclick="startVoice()">🎤</span>
    <span onclick="toggleVoice()">🔊</span>
    <span onclick="readCurrentText()">📖</span>
    <span onclick="exportChat()">📄</span>
    <span onclick="resetChat()">🔄</span>

  </div>
</div>

<div class="chat" id="chat"></div>

<div class="input-area">

  <input
    type="text"
    id="input"
    placeholder="Ketik pesan..."
    onkeydown="if(event.key==='Enter') kirim()"
  >

  <button onclick="kirim()">Kirim</button>

</div>

<script>

/* ================= WORKER API ================= */

const WORKER_API =
"https://geminitok-api.linkd1146.workers.dev/";

/* ================= ELEMENT ================= */

const chat = document.getElementById("chat");
const input = document.getElementById("input");

/* ================= STORAGE ================= */

let history =
JSON.parse(localStorage.getItem("ultraHistory")) || [];

let memoryContext =
JSON.parse(localStorage.getItem("aiContext")) || {};

let voiceEnabled = true;

/* ================= SAVE ================= */

function saveAll(){

  localStorage.setItem(
    "ultraHistory",
    JSON.stringify(history)
  );

  localStorage.setItem(
    "aiContext",
    JSON.stringify(memoryContext)
  );
}

/* ================= MESSAGE ================= */

function tambahPesan(text,type){

  const div = document.createElement("div");

  div.className = "message " + type;

  div.innerText = text;

  chat.appendChild(div);

  chat.scrollTop = chat.scrollHeight;

  if(type==="bot"){
    speak(text);
  }
}

/* ================= VOICE ================= */

function toggleVoice(){

  voiceEnabled = !voiceEnabled;

  tambahPesan(
    voiceEnabled
    ? "🔊 Voice diaktifkan"
    : "🔇 Voice dimatikan",
    "bot"
  );
}

function speak(text){

  if(!voiceEnabled) return;

  if(!window.speechSynthesis) return;

  speechSynthesis.cancel();

  const utter =
  new SpeechSynthesisUtterance(text);

  utter.lang = "id-ID";

  speechSynthesis.speak(utter);
}

function readUserText(text){

  if(!voiceEnabled) return;

  if(!window.speechSynthesis) return;

  speechSynthesis.cancel();

  const utter =
  new SpeechSynthesisUtterance(text);

  utter.lang = "id-ID";

  utter.rate = 1;
  utter.pitch = 1;
  utter.volume = 1;

  speechSynthesis.speak(utter);
}

function readCurrentText(){

  const teks = input.value.trim();

  if(!teks){

    alert("Masukkan teks terlebih dahulu");
    return;
  }

  readUserText(teks);
}

function startVoice(){

  const SR =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if(!SR){

    alert("Speech Recognition tidak didukung browser ini.");
    return;
  }

  const recog = new SR();

  recog.lang = "id-ID";

  recog.start();

  recog.onresult = (e)=>{

    input.value =
    e.results[0][0].transcript;
  };
}

/* ================= INTENT ================= */

function analyze(text){

  const lower = text.toLowerCase();

  if(
    ["halo","hai","hi","hello","assalamualaikum"]
    .includes(lower)
  ){
    return "greeting";
  }

  if(
    lower.includes("sedih") ||
    lower.includes("capek") ||
    lower.includes("lelah")
  ){
    return "emotion";
  }

  if(
    lower.includes("cara") ||
    lower.includes("bagaimana")
  ){
    return "how";
  }

  if(lower.includes("kenapa")){
    return "why";
  }

  if(text.includes("?")){
    return "question";
  }

  return "general";
}

/* ================= KNOWLEDGE ================= */

const knowledgeDB = {

  politik:
  "Politik adalah sistem pengelolaan kekuasaan dan kebijakan publik dalam negara.",

  ai:
  "Artificial Intelligence adalah teknologi yang memungkinkan mesin belajar dan mengambil keputusan otomatis.",

  bisnis:
  "Bisnis adalah proses menciptakan nilai melalui produk atau jasa untuk memperoleh keuntungan.",

  ekonomi:
  "Ekonomi mempelajari produksi, distribusi, dan konsumsi sumber daya.",

  cinta:
  "Cinta adalah kombinasi emosi, komitmen, dan kepercayaan.",

  sejarah:
  "Sejarah adalah catatan peristiwa masa lalu yang membentuk dunia saat ini.",

  teknologi:
  "Teknologi adalah penerapan ilmu pengetahuan untuk menyelesaikan masalah manusia.",

  kesehatan:
  "Kesehatan adalah kondisi fisik dan mental yang seimbang."
};

/* ================= KNOWLEDGE SEARCH ================= */

function searchKnowledge(text){

  for(const key in knowledgeDB){

    if(
      text.toLowerCase().includes(key)
    ){

      memoryContext.lastTopic = key;

      return knowledgeDB[key];
    }
  }

  return null;
}

/* ================= INTERNET SEARCH ================= */

async function searchInternet(query){

  try{

    const res = await fetch(
      "https://id.wikipedia.org/api/rest_v1/page/summary/" +
      encodeURIComponent(query)
    );

    if(res.ok){

      const data = await res.json();

      if(data.extract){
        return data.extract;
      }
    }

  }catch(err){

    console.log(err);
  }

  return null;
}

/* ================= DUCKDUCKGO SEARCH ================= */

async function duckSearch(query){

  try{

    const res = await fetch(
      "https://api.duckduckgo.com/?q=" +
      encodeURIComponent(query) +
      "&format=json&no_redirect=1"
    );

    const data = await res.json();

    return (
      data.AbstractText ||
      data.Heading ||
      "Tidak ditemukan hasil dari DuckDuckGo."
    );

  }catch(err){

    return "❌ DuckDuckGo error.";

  }

}

/* ================= GEMINI API ================= */

async function askGemini(prompt){

  try{

    const res = await fetch(
      WORKER_API,
      {
        method:"POST",

        headers:{
          "Content-Type":"application/json"
        },

        body:JSON.stringify({
          prompt:prompt
        })
      }
    );

    const data = await res.json();

    return (
      data.answer ||
      "Tidak ada jawaban dari Gemini."
    );

  }catch(err){

    return "❌ Error koneksi ke Gemini API";

  }

}

/* ================= SMART REPLY ================= */

async function smartReply(text){

  if(
    text.toLowerCase().startsWith("bacakan ") ||
    text.toLowerCase().startsWith("baca ")
  ){

    const isi = text
      .replace(/^bacakan\s+/i,"")
      .replace(/^baca\s+/i,"");

    readUserText(isi);

    return "🔊 Sedang membacakan:\n\n" + isi;
  }

  const intent = analyze(text);

  /* ================= DUCK COMMAND ================= */

  if(
    text.toLowerCase().startsWith("duck ")
  ){

    const query =
    text.replace(/^duck\s+/i,"");

    const result =
    await duckSearch(query);

    return "🦆 DuckDuckGo:\n\n" + result;
  }

  /* ================= INTERNET COMMAND ================= */

  if(
    text.toLowerCase().startsWith("cari internet ")
  ){

    const query =
    text.replace(/^cari internet\s+/i,"");

    const result =
    await duckSearch(query);

    return "🌐 Internet:\n\n" + result;
  }

  if(intent==="greeting"){

    if(
      text.toLowerCase() ===
      "assalamualaikum"
    ){

      return "Waalaikumsalam 🤍 Semoga harimu penuh keberkahan.";
    }

    return "Halo 👋 Ada yang ingin kamu bahas?";
  }

  if(intent==="emotion"){

    return "Aku bisa merasakan itu berat 😔 Kalau mau cerita, aku siap mendengarkan.";
  }

  /* ================= GEMINI AI ================= */

  let finalAnswer =
  await askGemini(text);

  /* ================= FALLBACK ================= */

  if(
    !finalAnswer ||
    finalAnswer.includes("Error")
  ){

    const online =
    await searchInternet(text);

    finalAnswer = online;
  }

  if(!finalAnswer){

    finalAnswer =
    searchKnowledge(text);
  }

  if(
    !finalAnswer &&
    memoryContext.lastTopic
  ){

    finalAnswer =
    "Melanjutkan topik tentang " +
    memoryContext.lastTopic +
    ", hal ini berkaitan dengan perkembangan sosial dan teknologi.";
  }

  if(!finalAnswer){

    finalAnswer =
    "Topik ini dapat dijelaskan dari berbagai sudut pandang tergantung konteks dan tujuan pembahasannya.";
  }

  if(intent==="how"){

    finalAnswer =
    "Langkah-langkah:\n" +
    "1. Pahami dasar konsep.\n" +
    "2. Tentukan tujuan.\n" +
    "3. Susun strategi.\n" +
    "4. Evaluasi hasil.\n\n" +
    finalAnswer;
  }

  if(intent==="why"){

    finalAnswer =
    "Hal tersebut biasanya dipengaruhi faktor internal dan eksternal.\n\n" +
    finalAnswer;
  }

  return "🧠 AI Response:\n\n" + finalAnswer;
}

/* ================= SEND ================= */

async function kirim(){

  const teks =
  input.value.trim();

  if(!teks) return;

  tambahPesan(teks,"user");

  history.push({
    role:"user",
    text:teks
  });

  saveAll();

  input.value = "";

  const typing =
  document.createElement("div");

  typing.className =
  "message bot typing";

  typing.innerText =
  "GeminiTok AI sedang menganalisis...";

  chat.appendChild(typing);

  chat.scrollTop =
  chat.scrollHeight;

  const final =
  await smartReply(teks);

  typing.remove();

  history.push({
    role:"bot",
    text:final
  });

  saveAll();

  tambahPesan(final,"bot");
}

/* ================= EXPORT ================= */

function exportChat(){

  let content = "";

  history.forEach(h=>{

    content +=
    h.role.toUpperCase() +
    ":\n" +
    h.text +
    "\n\n";
  });

  const blob =
  new Blob(
    [content],
    {type:"text/plain"}
  );

  const a =
  document.createElement("a");

  a.href =
  URL.createObjectURL(blob);

  a.download =
  "GeminiTok_Chat.txt";

  a.click();
}

/* ================= RESET ================= */

function resetChat(){

  localStorage.clear();

  location.reload();
}

/* ================= LOAD ================= */

window.onload = ()=>{

  if(history.length > 0){

    history.forEach(h=>{

      tambahPesan(
        h.text,
        h.role==="user"
        ? "user"
        : "bot"
      );
    });

  }else{

    tambahPesan(
      "Halo 👋 Aku GeminiTok AI Ultra.\nTanya apa saja dan aku akan menjawab.",
      "bot"
    );
  }
};

</script>

</body>
</html>
