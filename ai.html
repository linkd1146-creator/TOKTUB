<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>AI Chat UI</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #0b1220;
  color: white;
}

/* HEADER */
.header {
  padding: 15px;
  text-align: center;
  background: #111827;
  font-weight: bold;
  font-size: 18px;
}

/* CHAT BOX */
#chatBox {
  height: calc(100vh - 130px);
  overflow-y: auto;
  padding: 15px;
}

/* MESSAGE */
.msg {
  max-width: 80%;
  padding: 10px 12px;
  margin: 8px 0;
  border-radius: 12px;
  line-height: 1.4;
  white-space: pre-wrap;
}

.user {
  background: #2563eb;
  margin-left: auto;
  text-align: right;
}

.ai {
  background: #1f2937;
  margin-right: auto;
}

/* INPUT AREA */
.inputArea {
  position: fixed;
  bottom: 0;
  width: 100%;
  display: flex;
  padding: 10px;
  background: #111827;
  box-sizing: border-box;
}

input {
  flex: 1;
  padding: 12px;
  border: none;
  border-radius: 8px;
  outline: none;
  background: #0b1220;
  color: white;
}

button {
  margin-left: 8px;
  padding: 12px 16px;
  border: none;
  border-radius: 8px;
  background: #22c55e;
  color: white;
  cursor: pointer;
}

button:hover {
  background: #16a34a;
}
</style>
</head>

<body>

<div class="header">🤖 GeminiTok AI Chat</div>

<div id="chatBox"></div>

<div class="inputArea">
  <input id="input" placeholder="Tulis pesan..." />
  <button onclick="send()">Kirim</button>
</div>

<script>

// ======================
// 🔗 GANTI KE API KAMU
// ======================
const API_URL = "https://geminitok-api.linkd1146.workers.dev/";

// ======================

async function send() {
  const input = document.getElementById("input");
  const text = input.value;
  if (!text) return;

  addMsg(text, "user");
  input.value = "";

  const reply = await getAI(text);
  addMsg(reply, "ai");
}

function addMsg(text, type) {
  const box = document.getElementById("chatBox");

  const div = document.createElement("div");
  div.className = "msg " + type;
  div.innerText = text;

  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
}

// ======================
// 🤖 CALL BACKEND / WORKER
// ======================
async function getAI(message) {
  try {
    const res = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ prompt: message })
    });

    const data = await res.json();
    return data.reply || "Tidak ada jawaban";
  } catch (e) {
    return "Error: " + e.message;
  }
}

</script>

</body>
</html>
