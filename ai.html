<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>GeminiTok AI Ultra</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css"/>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:#0b0f19;
  color:white;
  font-family:Arial,sans-serif;
  height:100vh;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

.header{
  background:#111827;
  padding:14px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid rgba(255,255,255,.08);
  box-shadow:0 0 25px rgba(43,108,255,.25);
}

.logo{
  font-size:20px;
  font-weight:bold;
}

.menu{
  display:flex;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
}

.menu span{
  cursor:pointer;
  background:#1e293b;
  padding:10px;
  border-radius:12px;
  transition:.2s;
}

.menu span:hover{
  background:#2b6cff;
}

.chat{
  flex:1;
  overflow-y:auto;
  padding:20px;
  display:flex;
  flex-direction:column;
  gap:16px;
  scroll-behavior:smooth;
}

.message{
  padding:16px;
  border-radius:20px;
  max-width:85%;
  line-height:1.7;
  animation:fade .25s ease;
  white-space:pre-wrap;
}

.user{
  background:linear-gradient(135deg,#2b6cff,#4d8dff);
  align-self:flex-end;
}

.bot{
  background:#141b2d;
  border:1px solid rgba(255,255,255,.06);
  align-self:flex-start;
}

.typing{
  opacity:.7;
  font-style:italic;
}

.input-area{
  display:flex;
  gap:10px;
  padding:14px;
  background:#101624;
}

input{
  flex:1;
  background:#1a2238;
  border:none;
  color:white;
  padding:15px;
  border-radius:16px;
  outline:none;
}

button{
  background:#2b6cff;
  border:none;
  color:white;
  padding:14px 20px;
  border-radius:16px;
  cursor:pointer;
}

pre{
  background:#0d1117;
  padding:14px;
  border-radius:12px;
  overflow:auto;
  position:relative;
}

.copy-btn{
  position:absolute;
  top:10px;
  right:10px;
  background:#2b6cff;
  border:none;
  color:white;
  padding:5px 10px;
  border-radius:8px;
  cursor:pointer;
  font-size:12px;
}

img{
  max-width:100%;
  border-radius:12px;
  margin-top:10px;
}

@keyframes fade{
  from{
    opacity:0;
    transform:translateY(10px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

@media(max-width:700px){

  .message{
    max-width:100%;
    font-size:14px;
  }

  .header{
    flex-direction:column;
    gap:10px;
    align-items:flex-start;
  }
}

</style>
</head>

<body>

<div class="header">

  <div class="logo">
    🤖 GeminiTok AI Ultra
  </div>

  <div class="menu">

    <span onclick="startVoice()">🎤</span>

    <span onclick="toggleVoice()">🔊</span>

    <span onclick="exportChat()">📄</span>

    <span onclick="resetChat()">🔄</span>

  </div>

  <div id="clock"></div>

</div>

<div class="chat" id="chat"></div>

<div class="input-area">

  <input
    type="text"
    id="input"
    placeholder="Ketik pesan..."
  />

  <input
    type="file"
    id="imgUpload"
    accept="image/*"
    hidden
  />

  <button onclick="document.getElementById('imgUpload').click()">
    📷
  </button>

  <button onclick="kirim()">
    Kirim
  </button>

</div>

<script>

/* ================= CONFIG ================= */

const GEMINI_API =
"https://geminitok-api.linkd1146.workers.dev/";

/* ================= ELEMENT ================= */

const chat =
document.getElementById("chat");

const input =
document.getElementById("input");

/* ================= STORAGE ================= */

let history =
JSON.parse(
localStorage.getItem("ultraHistory")
) || [];

let voiceEnabled = true;

/* ================= CLOCK ================= */

function updateClock(){

  const now = new Date();

  document.getElementById("clock")
  .innerText =
  now.toLocaleTimeString("id-ID");
}

setInterval(updateClock,1000);
updateClock();

/* ================= SAVE ================= */

function saveAll(){

  localStorage.setItem(
    "ultraHistory",
    JSON.stringify(history)
  );
}

/* ================= COPY CODE ================= */

function addCopyButtons(){

  document.querySelectorAll("pre").forEach(pre=>{

    if(pre.querySelector(".copy-btn")) return;

    const btn =
    document.createElement("button");

    btn.innerText = "Copy";

    btn.className = "copy-btn";

    btn.onclick = ()=>{

      navigator.clipboard.writeText(
        pre.innerText
      );

      btn.innerText = "Copied";

      setTimeout(()=>{
        btn.innerText = "Copy";
      },1500);
    };

    pre.appendChild(btn);
  });
}

/* ================= MESSAGE ================= */

function tambahPesan(text,type){

  const div =
  document.createElement("div");

  div.className =
  "message " + type;

  if(type==="bot"){

    div.innerHTML =
    marked.parse(text);

  }else{

    div.innerText = text;
  }

  chat.appendChild(div);

  document
  .querySelectorAll("pre code")
  .forEach((el)=>{
    hljs.highlightElement(el);
  });

  addCopyButtons();

  chat.scrollTop =
  chat.scrollHeight;

  if(type==="bot"){
    speak(
      div.innerText.substring(0,200)
    );
  }
}

/* ================= VOICE ================= */

function toggleVoice(){

  voiceEnabled = !voiceEnabled;

  tambahPesan(
    voiceEnabled
    ? "🔊 Voice aktif"
    : "🔇 Voice mati",
    "bot"
  );
}

function speak(text){

  if(!voiceEnabled) return;

  if(!window.speechSynthesis) return;

  speechSynthesis.cancel();

  const utter =
  new SpeechSynthesisUtterance(text);

  utter.lang = "id-ID";

  utter.rate = 1;

  speechSynthesis.speak(utter);
}

/* ================= VOICE INPUT ================= */

function startVoice(){

  const SR =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;

  if(!SR){

    alert("Browser tidak support voice");
    return;
  }

  const recog = new SR();

  recog.lang = "id-ID";

  recog.start();

  recog.onresult = (e)=>{

    input.value =
    e.results[0][0].transcript;
  };
}

/* ================= IMAGE ================= */

document
.getElementById("imgUpload")
.addEventListener("change",function(e){

  const file = e.target.files[0];

  if(!file) return;

  const reader = new FileReader();

  reader.onload = ()=>{

    tambahPesan(
      "📷 Gambar dikirim",
      "user"
    );

    const img =
    document.createElement("img");

    img.src = reader.result;

    const wrap =
    document.createElement("div");

    wrap.className =
    "message user";

    wrap.appendChild(img);

    chat.appendChild(wrap);

    chat.scrollTop =
    chat.scrollHeight;
  };

  reader.readAsDataURL(file);
});

/* ================= WIKIPEDIA ================= */

async function searchWikipedia(query){

  try{

    const url =
    "https://id.wikipedia.org/api/rest_v1/page/summary/" +
    encodeURIComponent(query);

    const res =
    await fetch(url);

    if(!res.ok) return null;

    const data =
    await res.json();

    return data.extract
    ? "📚 Wikipedia\n\n" + data.extract
    : null;

  }catch(err){

    console.log(err);

    return null;
  }
}

/* ================= GEMINI ================= */

async function askGemini(prompt){

  try{

    const context =
    history
    .slice(-10)
    .map(h =>
      `${h.role}: ${h.text}`)
    .join("\n");

    const finalPrompt = `
Kamu adalah GeminiTok AI Ultra.

Jawab natural, lengkap,
bahasa Indonesia.

Riwayat:
${context}

User:
${prompt}
`;

    const response =
    await fetch(GEMINI_API,{
      method:"POST",
      headers:{
        "Content-Type":"application/json"
      },
      body:JSON.stringify({
        prompt:finalPrompt
      })
    });

    if(!response.ok){

      return "❌ API Error";
    }

    const data =
    await response.json();

    return (
      data.answer ||
      data.response ||
      data.text ||
      "❌ Tidak ada jawaban"
    );

  }catch(err){

    console.log(err);

    return "❌ Gagal koneksi API";
  }
}

/* ================= AI ================= */

async function AIResponse(userText){

  const lower =
  userText.toLowerCase();

  if(lower.startsWith("wiki ")){

    const q =
    userText.replace(/^wiki\s+/i,"");

    const wiki =
    await searchWikipedia(q);

    if(wiki) return wiki;
  }

  const gemini =
  await askGemini(userText);

  return "🤖 Gemini AI\n\n" + gemini;
}

/* ================= SEND ================= */

async function kirim(){

  const teks =
  input.value.trim();

  if(!teks) return;

  tambahPesan(teks,"user");

  history.push({
    role:"user",
    text:teks
  });

  saveAll();

  input.value = "";

  const typing =
  document.createElement("div");

  typing.className =
  "message bot typing";

  typing.innerText =
  "🤖 AI sedang berpikir...";

  chat.appendChild(typing);

  chat.scrollTop =
  chat.scrollHeight;

  const jawaban =
  await AIResponse(teks);

  typing.remove();

  history.push({
    role:"bot",
    text:jawaban
  });

  saveAll();

  tambahPesan(
    jawaban,
    "bot"
  );
}

/* ================= EXPORT ================= */

function exportChat(){

  let isi = "";

  history.forEach(h=>{

    isi +=
    h.role.toUpperCase() +
    ":\n" +
    h.text +
    "\n\n";
  });

  const blob =
  new Blob(
    [isi],
    {type:"text/plain"}
  );

  const a =
  document.createElement("a");

  a.href =
  URL.createObjectURL(blob);

  a.download =
  "GeminiTok_Chat.txt";

  a.click();
}

/* ================= RESET ================= */

function resetChat(){

  if(confirm("Hapus semua chat?")){

    localStorage.removeItem(
      "ultraHistory"
    );

    location.reload();
  }
}

/* ================= ENTER ================= */

input.addEventListener(
"keydown",
(e)=>{

  if(e.key==="Enter"){

    e.preventDefault();

    kirim();
  }
});

/* ================= LOAD ================= */

window.onload = ()=>{

  if(history.length){

    history.forEach(h=>{

      tambahPesan(
        h.text,
        h.role==="user"
        ? "user"
        : "bot"
      );
    });

  }else{

    tambahPesan(
`# 👋 Halo

Aku GeminiTok AI Ultra

"bot"
);
  }
};

</script>

</body>
</html>
