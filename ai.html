<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GeminiTok AI</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#000;
  color:white;
}

/* HEADER */
.header{
  display:flex;
  align-items:center;
  padding:10px;
  background:#111;
  gap:10px;
}

.back{
  cursor:pointer;
  font-size:20px;
}

/* MODE BUTTON */
.mode{
  display:flex;
  gap:10px;
  padding:10px;
}

.mode button{
  flex:1;
  padding:10px;
  border:none;
  border-radius:8px;
  background:#222;
  color:white;
}

.mode button.active{
  background:#2b6cff;
}

/* CHAT AREA */
.chat{
  height:70vh;
  overflow-y:auto;
  padding:10px;
}

.msg{
  padding:8px;
  margin:6px 0;
  border-radius:8px;
}

.user{background:#2b6cff;}
.ai{background:#222;}

/* INPUT */
.input{
  display:flex;
  gap:5px;
  padding:10px;
  background:#111;
}

input{
  flex:1;
  padding:10px;
  border:none;
}

button{
  padding:10px;
  background:#2b6cff;
  border:none;
  color:white;
}
</style>
</head>

<body>

<!-- HEADER -->
<div class="header">
  <div class="back" onclick="history.back()">⬅</div>
  🤖 GeminiTok AI
</div>

<!-- MODE: CHAT / VOICE -->
<div class="mode">
  <button onclick="setMode('chat')" id="chatBtn">💬 Chat</button>
  <button onclick="startVoice()" id="voiceBtn">🎤 Voice</button>
</div>

<!-- CHAT -->
<div class="chat" id="chat"></div>

<!-- INPUT -->
<div class="input">
  <input id="text" placeholder="Tulis pesan...">
  <button onclick="send()">Send</button>
</div>

<script>

let API_KEY="AIzaSyAyl3fLVXYtFfiUJZ-fglGKDoIpEjQFuV8";
let mode="chat";

/* ADD MESSAGE */
function add(text,type){
  const div=document.createElement("div");
  div.className="msg "+type;
  div.innerText=text;
  document.getElementById("chat").appendChild(div);
}

/* CHAT */
async function send(){
  const input=document.getElementById("text");
  const text=input.value;
  if(!text) return;

  add(text,"user");
  input.value="";

  const res=await fetch(
    "https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key="+API_KEY,
    {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({contents:[{parts:[{text}]}]})
    }
  );

  const data=await res.json();

  const reply=
    data?.candidates?.[0]?.content?.parts?.[0]?.text ||
    "No response";

  add(reply,"ai");
}

/* VOICE AI */
function startVoice(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR) return alert("Voice tidak support");

  const rec=new SR();
  rec.lang="id-ID";
  rec.start();

  rec.onresult=(e)=>{
    const text=e.results[0][0].transcript;
    document.getElementById("text").value=text;
  };
}

/* MODE UI */
function setMode(m){
  mode=m;
  document.getElementById("chatBtn").classList.remove("active");
  document.getElementById("voiceBtn").classList.remove("active");

  if(m==="chat"){
    document.getElementById("chatBtn").classList.add("active");
  }else{
    document.getElementById("voiceBtn").classList.add("active");
    startVoice();
  }
}

setMode("chat");

</script>

</body>
</html>
