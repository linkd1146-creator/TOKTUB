<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>GeminiTok AI Ultra</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.3.136/pdf.min.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#0f0f0f;
color:white;
font-family:Arial,sans-serif;
height:100vh;
display:flex;
flex-direction:column;
}

.header{
background:#111;
padding:14px;
display:flex;
justify-content:space-between;
align-items:center;
border-bottom:1px solid #222;
box-shadow:0 0 15px rgba(43,108,255,.2);
}

.logo{
font-size:18px;
font-weight:bold;
}

.menu{
display:flex;
align-items:center;
gap:10px;
flex-wrap:wrap;
}

.menu span{
cursor:pointer;
background:#1e1e1e;
padding:8px 10px;
border-radius:10px;
transition:.2s;
}

.menu span:hover{
background:#2563eb;
}

.chat{
flex:1;
overflow-y:auto;
padding:20px;
display:flex;
flex-direction:column;
gap:14px;
}

.message{
padding:14px;
border-radius:18px;
max-width:80%;
white-space:pre-wrap;
line-height:1.5;
}

.user{
background:#2563eb;
align-self:flex-end;
}

.bot{
background:#1a1a1a;
border:1px solid rgba(43,108,255,.2);
align-self:flex-start;
}

.typing{
opacity:.6;
font-style:italic;
}

.input-area{
display:flex;
gap:10px;
padding:12px;
background:#111;
border-top:1px solid #222;
}

input{
flex:1;
background:#1e1e1e;
border:none;
color:white;
padding:14px;
border-radius:14px;
outline:none;
}

button{
background:#2563eb;
border:none;
color:white;
padding:14px 18px;
border-radius:14px;
cursor:pointer;
font-weight:bold;
}

button:hover{
opacity:.9;
}

@media(max-width:700px){

.message{
max-width:100%;
}

.header{
flex-direction:column;
align-items:flex-start;
gap:10px;
}

}

</style>
</head>

<body>

<div class="header">

<div class="logo">
🤖 GeminiTok AI Ultra
</div>

<div class="menu">

<span onclick="startVoice()">🎤</span>

<span onclick="toggleVoice()">🔊</span>

<span onclick="readCurrentText()">📖</span>

<span onclick="uploadPDF()">📄 PDF</span>

<span onclick="searchWikiPrompt()">📚</span>

<span onclick="searchDuckPrompt()">🦆</span>

<span onclick="saveMemory()">🧠</span>

<span onclick="clearMemory()">🗑️</span>

<span onclick="exportChat()">💾</span>

<span onclick="resetChat()">🔄</span>

</div>

</div>

<input
type="file"
id="pdfFile"
accept=".pdf"
style="display:none"
>

<div class="chat" id="chat"></div>

<div class="input-area">

<input
type="text"
id="input"
placeholder="Tulis pertanyaan..."
onkeydown="if(event.key==='Enter')kirim()"
>

<button onclick="kirim()">
Kirim
</button>

</div>

<script>

/* ================= API ================= */

const WORKER_URL =
"https://geminitok-api.linkd1146.workers.dev/";

/* ================= ELEMENT ================= */

const chat =
document.getElementById("chat");

const input =
document.getElementById("input");

const pdfFile =
document.getElementById("pdfFile");

/* ================= STORAGE ================= */

let history =
JSON.parse(
localStorage.getItem("geminitok_history")
) || [];

let memory =
JSON.parse(
localStorage.getItem("geminitok_memory")
) || {};

let voiceEnabled = true;

let pdfText = "";

/* ================= SAVE ================= */

function saveAll(){

localStorage.setItem(
"geminitok_history",
JSON.stringify(history)
);

localStorage.setItem(
"geminitok_memory",
JSON.stringify(memory)
);

}

/* ================= MESSAGE ================= */

function tambahPesan(text,type){

const div =
document.createElement("div");

div.className =
"message " + type;

div.innerText = text;

chat.appendChild(div);

chat.scrollTop =
chat.scrollHeight;

if(type==="bot"){
speak(text);
}

}

/* ================= VOICE ================= */

function toggleVoice(){

voiceEnabled = !voiceEnabled;

tambahPesan(
voiceEnabled
? "🔊 Voice aktif"
: "🔇 Voice nonaktif",
"bot"
);

}

function speak(text){

if(!voiceEnabled) return;

if(!window.speechSynthesis) return;

speechSynthesis.cancel();

const utter =
new SpeechSynthesisUtterance(text);

utter.lang = "id-ID";

speechSynthesis.speak(utter);

}

function readCurrentText(){

const text =
input.value.trim();

if(!text){

alert("Masukkan teks");
return;

}

speak(text);

}

function startVoice(){

const SR =
window.SpeechRecognition ||
window.webkitSpeechRecognition;

if(!SR){

alert("Browser tidak mendukung");

return;

}

const recog =
new SR();

recog.lang = "id-ID";

recog.start();

recog.onresult = (e)=>{

input.value =
e.results[0][0].transcript;

};

}

/* ================= GEMINI ================= */

async function askGemini(prompt){

const res = await fetch(
WORKER_URL,
{
method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({
prompt:
(pdfText
? "ISI PDF:\n"+pdfText+"\n\n"
: "")
+ prompt
})

}
);

const data =
await res.json();

return data.answer ||
"Tidak ada jawaban";

}

/* ================= WIKIPEDIA ================= */

async function wikiSearch(query){

try{

const res =
await fetch(
"https://id.wikipedia.org/api/rest_v1/page/summary/" +
encodeURIComponent(query)
);

const data =
await res.json();

return data.extract || "Tidak ditemukan.";

}catch{

return "Wikipedia error.";

}

}

async function searchWikiPrompt(){

const q =
prompt("Cari Wikipedia:");

if(!q) return;

const hasil =
await wikiSearch(q);

tambahPesan(
"📚 Wikipedia:\n\n" + hasil,
"bot"
);

}

/* ================= DUCKDUCKGO ================= */

async function duckSearch(query){

try{

const res =
await fetch(
"https://api.duckduckgo.com/?q=" +
encodeURIComponent(query) +
"&format=json"
);

const data =
await res.json();

return data.AbstractText ||
"Tidak ditemukan.";

}catch{

return "DuckDuckGo error.";

}

}

async function searchDuckPrompt(){

const q =
prompt("Cari DuckDuckGo:");

if(!q) return;

const hasil =
await duckSearch(q);

tambahPesan(
"🦆 DuckDuckGo:\n\n" + hasil,
"bot"
);

}

/* ================= PDF ================= */

function uploadPDF(){

pdfFile.click();

}

pdfFile.onchange =
async (e)=>{

const file =
e.target.files[0];

if(!file) return;

const buffer =
await file.arrayBuffer();

const pdf =
await pdfjsLib
.getDocument(
new Uint8Array(buffer)
).promise;

pdfText = "";

for(
let i=1;
i<=pdf.numPages;
i++
){

const page =
await pdf.getPage(i);

const text =
await page.getTextContent();

pdfText +=
text.items
.map(i=>i.str)
.join(" ");

}

tambahPesan(
"📄 PDF berhasil dimuat",
"bot"
);

};

/* ================= MEMORY ================= */

function saveMemory(){

memory.lastChat =
history;

saveAll();

tambahPesan(
"🧠 Memory disimpan",
"bot"
);

}

function clearMemory(){

localStorage.clear();

tambahPesan(
"🗑️ Memory dihapus",
"bot"
);

}

/* ================= EXPORT ================= */

function exportChat(){

let txt = "";

history.forEach(h=>{

txt +=
h.role.toUpperCase() +
":\n" +
h.text +
"\n\n";

});

const blob =
new Blob(
[txt],
{type:"text/plain"}
);

const a =
document.createElement("a");

a.href =
URL.createObjectURL(blob);

a.download =
"GeminiTok_Chat.txt";

a.click();

}

/* ================= RESET ================= */

function resetChat(){

localStorage.clear();

location.reload();

}

/* ================= SEND ================= */

async function kirim(){

const text =
input.value.trim();

if(!text) return;

tambahPesan(text,"user");

history.push({
role:"user",
text:text
});

saveAll();

input.value = "";

const typing =
document.createElement("div");

typing.className =
"message bot typing";

typing.innerText =
"GeminiTok AI sedang berpikir...";

chat.appendChild(typing);

chat.scrollTop =
chat.scrollHeight;

try{

const answer =
await askGemini(text);

typing.remove();

history.push({
role:"bot",
text:answer
});

saveAll();

tambahPesan(answer,"bot");

}catch(err){

typing.remove();

tambahPesan(
"❌ Error koneksi Gemini API",
"bot"
);

}

}

/* ================= LOAD ================= */

window.onload = ()=>{

if(history.length){

history.forEach(h=>{

tambahPesan(
h.text,
h.role==="user"
? "user"
: "bot"
);

});

}else{

tambahPesan(
"👋 Halo! Selamat datang di GeminiTok AI Ultra",
"bot"
);

}

};

</script>

</body>
</html>
